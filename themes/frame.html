<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,300;1,9..144,500&family=DM+Sans:wght@500;700&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#f6f8fa;font-family:'DM Sans',sans-serif;color:#0e1217}
.o{position:absolute;left:14px;top:14px;right:14px;bottom:14px;background:#0e1217;clip-path:polygon(46px 0,calc(100% - 46px) 0,100% 46px,100% calc(100% - 46px),calc(100% - 46px) 100%,46px 100%,0 calc(100% - 46px),0 46px)}
.i{position:absolute;left:16px;top:16px;right:16px;bottom:16px;background:#f6f8fa;clip-path:polygon(44px 0,calc(100% - 44px) 0,100% 44px,100% calc(100% - 44px),calc(100% - 44px) 100%,44px 100%,0 calc(100% - 44px),0 44px)}
.wm{position:absolute;left:46px;top:36px;font-family:'Alex Brush',cursive;font-size:46px;line-height:.95}
.sys{position:absolute;left:48px;top:178px;font-size:10px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;line-height:2}
.fcr{position:absolute;left:48px;top:244px;font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:15px;width:140px;line-height:1.25}
.fcr b{font-style:normal;font-weight:800;color:#0f9d74;letter-spacing:.06em}
.sky{position:absolute;left:158px;top:196px;width:202px;height:150px;overflow:visible}
.hl{position:absolute;left:44px;top:350px;font-family:'Fraunces',serif}
.hl .a{display:block;font-style:italic;font-weight:500;font-size:22px}
.hl .b{display:block;font-weight:300;font-style:italic;font-size:176px;line-height:.82;letter-spacing:-.05em;color:#0f9d74;margin-left:-8px}
.pro{position:absolute;left:48px;top:604px;font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}
.pro span{color:#0f9d74}
.field{position:absolute;left:46px;right:46px;top:628px;height:48px;border-radius:999px;background:#fff;border:1.5px solid #0e1217;padding:0 22px;display:flex;align-items:center;font-weight:700;font-size:16px}
.field span{opacity:.55}
.key{position:absolute;left:48px;top:688px;width:260px;font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:13.5px;line-height:1.3}
.key b{font-style:normal;font-weight:800;color:#0f9d74}
.btn{position:absolute;left:46px;right:46px;top:734px;height:52px;border-radius:999px;background:linear-gradient(180deg,#232a33,#0a0d11);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 7px 0 26px;font-family:'Fraunces',serif;font-weight:700;font-size:18px;box-shadow:inset 0 0 0 1.5px #bfc9d3,0 12px 20px -10px rgba(14,18,23,.7)}
.btn i{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 34% 26%,#5be0b4,#0f9d74 55%,#066247);font-style:normal;display:flex;align-items:center;justify-content:center;font-size:19px}
</style></head><body>
<div class="o"></div><div class="i"></div>
<div class="wm">Know<br>Your<br>Energy</div>
<div class="sys">Astrology<br>Numerology<br>Human Design</div>
<div class="fcr"><b>FULL</b> charts and combined reading</div>
<svg class="sky" viewBox="0 0 202 150"><g transform="rotate(22 100 75)" fill="none" stroke="#0e1217" stroke-width="1.1"><ellipse cx="100" cy="75" rx="26" ry="10"/><ellipse cx="100" cy="75" rx="46" ry="18"/><ellipse cx="100" cy="75" rx="68" ry="26"/><ellipse cx="100" cy="75" rx="90" ry="34"/></g><circle cx="100" cy="75" r="10" fill="#0e1217"/><g transform="rotate(22 100 75)"><circle cx="54" cy="75" r="3.6" fill="#0f9d74"/><circle cx="190" cy="75" r="4" fill="#0f9d74"/></g></svg>
<div class="hl"><span class="a">first reading is</span><span class="b">free.</span></div>
<div class="pro"><span>No credit card</span> — try before you buy</div>
<div class="field"><span>Email</span></div>
<div class="key">Email is your <b>key</b> that will not be shared nor solicited</div>
<div class="btn">Continue<i>→</i></div>
</body></html>
