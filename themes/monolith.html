<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,300;1,9..144,500&family=DM+Sans:wght@500;700&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#f2f8f9;font-family:'DM Sans',sans-serif;color:#082f36}
.wm{position:absolute;left:24px;top:26px;font-family:'Fraunces',serif;font-weight:700;font-size:30px;line-height:1}
.sys{position:absolute;left:25px;top:68px;font-size:10px;font-weight:700;letter-spacing:.26em;text-transform:uppercase}
.fcr{position:absolute;left:25px;top:90px;font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:15px}
.fcr b{font-style:normal;font-weight:800;color:#0f7f8c;letter-spacing:.06em}
.sky{position:absolute;left:0;top:96px;width:390px;height:300px}
.plate{position:absolute;left:-12px;right:-12px;top:372px;bottom:-12px;background:linear-gradient(155deg,#12747f 0%,#0a4a54 55%,#06323a 100%);
 clip-path:polygon(60px 0,calc(100% - 60px) 0,100% 60px,100% 100%,0 100%,0 60px);filter:drop-shadow(0 -6px 18px rgba(8,47,54,.25))}
.plate:before{content:"";position:absolute;left:62px;right:62px;top:0;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0))}
.hl{position:absolute;left:34px;top:408px;color:#fff;font-family:'Fraunces',serif}
.hl .a{display:block;font-style:italic;font-weight:500;font-size:22px}
.hl .b{display:block;font-weight:800;font-size:150px;line-height:.82;letter-spacing:-.045em;margin-left:-6px}
.pro{position:absolute;left:34px;top:606px;color:#9fe3ea;font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}
.pro span{color:#fff}
.field{position:absolute;left:34px;right:34px;top:630px;height:50px;border-radius:999px;background:#f4fbfc;padding:0 22px;display:flex;align-items:center;font-weight:700;font-size:16px;color:#082f36}
.field span{opacity:.55}
.key{position:absolute;left:36px;top:692px;width:300px;color:#cdeff3;font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:14px;line-height:1.3}
.key b{font-style:normal;font-weight:800;color:#fff}
.btn{position:absolute;left:34px;right:34px;top:748px;height:54px;border-radius:999px;background:#fff;color:#082f36;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 28px;font-family:'Fraunces',serif;font-weight:700;font-size:18px;box-shadow:0 12px 20px -10px rgba(0,20,26,.7)}
.btn i{width:38px;height:38px;border-radius:50%;background:linear-gradient(160deg,#17909d,#08414a);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:20px}
</style></head><body>
<div class="wm">Know Your Energy</div><div class="sys">Astrology · Numerology · Human Design</div><div class="fcr"><b>FULL</b> charts and combined reading</div>
<svg class="sky" viewBox="0 0 390 300"><g transform="rotate(22 270 150)" fill="none" stroke="#0f7f8c" stroke-width="1.1"><ellipse cx="270" cy="150" rx="62" ry="24"/><ellipse cx="270" cy="150" rx="104" ry="40"/><ellipse cx="270" cy="150" rx="150" ry="58"/><ellipse cx="270" cy="150" rx="200" ry="77"/></g>
<circle cx="270" cy="150" r="18" fill="#082f36"/><g transform="rotate(22 270 150)"><circle cx="166" cy="150" r="5" fill="#082f36"/><circle cx="420" cy="150" r="6" fill="#082f36"/><circle cx="270" cy="227" r="4.5" fill="#f2f8f9" stroke="#082f36" stroke-width="1.2"/></g></svg>
<div class="plate"></div>
<div class="hl"><span class="a">first reading is</span><span class="b">free.</span></div>
<div class="pro"><span>No credit card</span> — try before you buy</div>
<div class="field"><span>Email</span></div>
<div class="key">Email is your <b>key</b> that will not be shared nor solicited</div>
<div class="btn">Continue<i>→</i></div>
</body></html>
