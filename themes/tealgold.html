<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,500&family=DM+Sans:wght@500;700&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#063f48;font-family:'Fraunces',serif;color:#f6ecd0}
.o{position:absolute;left:14px;top:14px;right:14px;bottom:14px;background:linear-gradient(160deg,#fbeec2,#d9b562 40%,#a87a26 70%,#f1d98f);clip-path:polygon(46px 0,calc(100% - 46px) 0,100% 46px,100% calc(100% - 46px),calc(100% - 46px) 100%,46px 100%,0 calc(100% - 46px),0 46px)}
.i{position:absolute;left:17px;top:17px;right:17px;bottom:17px;background:linear-gradient(170deg,#0a6672 0%,#074a54 55%,#04343c 100%);clip-path:polygon(44px 0,calc(100% - 44px) 0,100% 44px,100% calc(100% - 44px),calc(100% - 44px) 100%,44px 100%,0 calc(100% - 44px),0 44px)}
.gold{background:linear-gradient(172deg,#fff5cf 0%,#ecd089 32%,#c19a3e 66%,#f6e3a1 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.wm{position:absolute;left:46px;top:38px;font-family:'Alex Brush',cursive;font-size:52px;line-height:.95}
.sys{position:absolute;left:48px;top:150px;font-size:9.5px;font-weight:700;letter-spacing:.17em;white-space:nowrap;text-transform:uppercase;color:#e8d79d}
.fcr{position:absolute;left:48px;top:172px;font-style:italic;font-weight:500;font-size:15px}
.fcr b{font-style:normal;font-weight:800;color:#ecd089;letter-spacing:.06em}
.sky{position:absolute;left:146px;top:186px;width:204px;height:150px}
.hl{position:absolute;left:44px;top:352px}
.hl .a{display:block;font-style:italic;font-weight:500;font-size:22px;color:#f6ecd0}
.hl .b{display:inline-block;font-weight:700;font-size:178px;line-height:.82;letter-spacing:-.045em;margin-left:-6px;padding-right:.08em;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.pro{position:absolute;left:48px;top:604px;font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:#ecd089}
.pro span{color:#fff5cf}
.field{position:absolute;left:46px;right:46px;top:628px;height:48px;border-radius:999px;background:#fbf6e6;border:2px solid #d9b562;padding:0 22px;display:flex;align-items:center;font-weight:700;font-size:16px;color:#063f48}
.field span{opacity:.55}
.key{position:absolute;left:48px;top:688px;width:260px;font-style:italic;font-weight:500;font-size:13.5px;line-height:1.3;color:#f6ecd0}
.key b{font-style:normal;font-weight:800;color:#ecd089}
.btn{position:absolute;left:46px;right:46px;top:734px;height:52px;border-radius:999px;background:linear-gradient(172deg,#fff1c0 0%,#e3c273 40%,#b48a2c 78%,#efd68a 100%);color:#063f48;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;letter-spacing:.02em;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 12px 20px -10px rgba(0,0,0,.7)}
</style></head><body>
<div class="o"></div><div class="i"></div>
<div class="wm gold">Know Your Energy</div>
<div class="sys">Astrology · Numerology · Human Design</div><div class="fcr"><b>FULL</b> charts and combined reading</div>
<svg class="sky" viewBox="0 0 204 150"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff5cf"/><stop offset=".5" stop-color="#d9b562"/><stop offset="1" stop-color="#a87a26"/></linearGradient><radialGradient id="gs" cx="34%" cy="28%" r="80%"><stop offset="0" stop-color="#fff5cf"/><stop offset=".5" stop-color="#d9b562"/><stop offset="1" stop-color="#8a6218"/></radialGradient></defs>
<g transform="rotate(22 102 75)" fill="none" stroke="url(#gd)" stroke-width="1.3"><ellipse cx="102" cy="75" rx="26" ry="10"/><ellipse cx="102" cy="75" rx="48" ry="18"/><ellipse cx="102" cy="75" rx="70" ry="27"/><ellipse cx="102" cy="75" rx="92" ry="35"/></g><circle cx="102" cy="75" r="11" fill="url(#gs)"/></svg>
<div class="hl"><span class="a">first reading is</span><br><span class="b gold">free.</span></div>
<div class="pro"><span>No credit card</span> — try before you buy</div><div class="field"><span>Email</span></div>
<div class="key">Email is your <b>key</b> that will not be shared nor solicited</div><div class="btn">Continue&nbsp;→</div>
</body></html>
