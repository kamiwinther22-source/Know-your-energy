<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#b9efe0;font-family:'Fraunces',Georgia,serif;color:#042f33}
.sky{position:absolute;inset:0}
.t1{position:absolute;left:22px;top:26px;font-weight:800;font-size:46px;line-height:.98;letter-spacing:-.01em}
.sys{position:absolute;left:24px;top:134px;font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.fcr{position:absolute;left:24px;top:154px;font-size:15px;font-style:italic;font-weight:500}
.fcr b{font-style:normal;font-weight:800;color:#1b3fd6;letter-spacing:.06em}
.hl{position:absolute;left:22px;top:452px;line-height:1}
.hl .a{display:block;font-style:italic;font-weight:500;font-size:27px}
.hl .b{display:block;font-weight:800;font-size:134px;line-height:.84;letter-spacing:-.04em;margin-left:-4px;white-space:nowrap}
.dot{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fffde0 0%,#f2e24a 42%,#b69a0a 100%);box-shadow:0 .03em .05em rgba(4,47,51,.4);margin-left:.02em}
.form{position:absolute;left:22px;right:22px;bottom:34px}
.pro{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}
.pro i{font-style:normal;color:#1b3fd6}
.row{display:flex;align-items:center;gap:12px}
.field{flex:1;height:58px;border-radius:999px;background:#f6fffb;border:2px solid #042f33;padding:0 22px;font:700 17px 'Fraunces',serif;color:#042f33;display:flex;align-items:center;box-shadow:0 10px 18px -10px rgba(4,47,51,.55)}
.field span{opacity:.62}
.go{width:66px;height:66px;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle at 34% 24%,#2fd0bd 0%,#0a8a80 40%,#043b3c 100%);box-shadow:inset 0 0 0 3px #f2e24a,inset 0 2px 5px rgba(255,255,255,.5),0 14px 20px -8px rgba(4,47,51,.7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;line-height:1}
.go:after{content:"";position:absolute;left:12px;top:7px;width:26px;height:12px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-24deg)}
.cap{position:absolute;right:-6px;top:72px;width:78px;text-align:center;color:#042f33;font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.key{margin-top:14px;font-size:14px;font-style:italic;font-weight:500;width:268px;line-height:1.3}
.key b{font-style:normal;font-weight:800;color:#1b3fd6}
</style></head><body>
<svg class="sky" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <radialGradient id="sun" cx="34%" cy="26%" r="80%"><stop offset="0" stop-color="#5fe3cf"/><stop offset=".38" stop-color="#0d9488"/><stop offset="1" stop-color="#03393b"/></radialGradient>
  <radialGradient id="pl" cx="34%" cy="26%" r="80%"><stop offset="0" stop-color="#fffde0"/><stop offset=".45" stop-color="#f2e24a"/><stop offset="1" stop-color="#a88f08"/></radialGradient>
 </defs>
 <g transform="rotate(22 300 318)" fill="none" stroke="#042f33" stroke-width="1.4">
  <ellipse cx="300" cy="318" rx="86" ry="34"/><ellipse cx="300" cy="318" rx="130" ry="50"/><ellipse cx="300" cy="318" rx="176" ry="68"/>
  <ellipse cx="300" cy="318" rx="226" ry="88"/>
 </g>
 <circle cx="300" cy="318" r="62" fill="url(#sun)"/>
 <ellipse cx="278" cy="292" rx="26" ry="14" fill="#fff" opacity=".5" transform="rotate(-30 278 292)"/>
 <g transform="rotate(22 300 318)">
  <circle cx="214" cy="318" r="11" fill="url(#pl)"/><circle cx="74" cy="318" r="14" fill="url(#pl)"/><circle cx="526" cy="318" r="12" fill="url(#pl)"/><circle cx="300" cy="406" r="9" fill="#f6fffb" stroke="#042f33" stroke-width="1.4"/>
 </g>
</svg>
<div class="t1">Know Your<br>Energy</div>
<div class="sys">Astrology · Numerology · Human Design</div>
<div class="fcr"><b>FULL</b> charts and combined reading</div>
<div class="hl"><span class="a">first reading is</span><span class="b">free<span class="dot"></span></span></div>
<div class="form">
 <div class="pro"><i>No credit card</i> — try before you buy</div>
 <div class="row"><div class="field"><span>Email</span></div><div class="go">→<div class="cap">Continue</div></div></div>
 <div class="key">Email is your <b>key</b> that will not be shared nor solicited</div>
</div>
</body></html>
