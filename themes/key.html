<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,500&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#f1f4fb;font-family:'Fraunces',serif;color:#0b1330}
.vert{position:absolute;right:-26px;top:0;height:844px;width:300px;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:flex-start;white-space:nowrap;padding:18px 0}
.vert .s{font-style:italic;font-weight:500;font-size:22px;margin-bottom:4px}
.vert .f{font-weight:800;font-size:226px;line-height:.8;letter-spacing:-.03em;background:linear-gradient(90deg,#8fa6ff 0%,#2f52ff 38%,#101fa8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(8px 0 0 rgba(16,31,168,.0))}
.wm{position:absolute;left:20px;top:20px;font-family:'Alex Brush',cursive;font-size:60px;line-height:.9}
.sys{position:absolute;left:22px;top:196px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;line-height:1.9}
.fcr{position:absolute;left:22px;top:262px;font-size:15px;font-style:italic;font-weight:500;line-height:1.25;width:150px}
.fcr b{font-style:normal;font-weight:800;color:#2f52ff;letter-spacing:.05em}
.orb{position:absolute;left:14px;top:372px;width:150px;height:110px}
.pro{position:absolute;left:22px;top:590px;width:128px;font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;line-height:1.5}
.pro i{font-style:normal;color:#2f52ff}
.keywrap{position:absolute;left:18px;bottom:118px;display:flex;align-items:center;filter:drop-shadow(0 12px 12px rgba(16,31,168,.35))}
.head{width:76px;height:76px;border-radius:50%;flex:none;position:relative;z-index:2;background:radial-gradient(circle at 32% 24%,#8fa6ff 0%,#2f52ff 42%,#0c1789 100%);box-shadow:inset 0 0 0 3px #e9edff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}
.head:after{content:"";position:absolute;left:14px;top:9px;width:30px;height:13px;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-24deg)}
.shaft{position:relative;margin-left:-14px;width:92px;height:44px;background:#fff;border:2.5px solid #1a2db8;border-left:0;display:flex;align-items:center;padding:0 8px 0 24px;font:700 15px 'Fraunces',serif;color:#0b1330}
.shaft span{opacity:.55}
.shaft:before,.shaft:after{content:"";position:absolute;bottom:-17px;width:15px;height:17px;background:#fff;border:2.5px solid #1a2db8;border-top:0}
.shaft:before{right:26px}.shaft:after{right:6px}
.cap{position:absolute;left:22px;bottom:92px;font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.kt{position:absolute;left:22px;bottom:26px;width:150px;font-size:13px;font-style:italic;font-weight:500;line-height:1.3}
.kt b{font-style:normal;font-weight:800;color:#2f52ff}
</style></head><body>
<div class="vert"><span class="s">first reading is</span><span class="f">free.</span></div>
<div class="wm">Know<br>Your<br>Energy</div>
<div class="sys">Astrology<br>Numerology<br>Human Design</div>
<div class="fcr"><b>FULL</b> charts and combined reading</div>
<svg class="orb" viewBox="0 0 150 110"><defs><radialGradient id="s" cx="34%" cy="26%" r="80%"><stop offset="0" stop-color="#b9c8ff"/><stop offset=".4" stop-color="#2f52ff"/><stop offset="1" stop-color="#0a1470"/></radialGradient></defs>
 <g transform="rotate(22 75 55)" fill="none" stroke="#0b1330" stroke-width="1.2"><ellipse cx="75" cy="55" rx="40" ry="15"/><ellipse cx="75" cy="55" rx="58" ry="22"/><ellipse cx="75" cy="55" rx="76" ry="29"/></g>
 <circle cx="75" cy="55" r="20" fill="url(#s)"/><ellipse cx="68" cy="47" rx="7" ry="4" fill="#fff" opacity=".6" transform="rotate(-30 68 47)"/>
 <g transform="rotate(22 75 55)"><circle cx="35" cy="55" r="4.5" fill="#fff" stroke="#0b1330" stroke-width="1.2"/><circle cx="133" cy="55" r="4" fill="#fff" stroke="#0b1330" stroke-width="1.2"/></g></svg>
<div class="pro"><i>No credit card</i> — try before you buy</div>
<div class="keywrap"><div class="head">→</div><div class="shaft"><span>Email</span></div></div>
<div class="cap">Continue</div>
<div class="kt">Email is your <b>key</b> that will not be shared nor solicited</div>
</body></html>
