<script>function gem(svg,x,y,w,h,c,steps,d,dark,mid,light){const ns="http://www.w3.org/2000/svg";const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const D=hx(dark),M=hx(mid),L=hx(light);
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));const col=(t)=>{const c=t<.5?mix(D,M,t*2):mix(M,L,(t-.5)*2);return `rgb(${c})`};
const oct=(k)=>{const i=k*d,cc=Math.max(6,c-k*d*.55);const X=x+i,Y=y+i,W=w-2*i,H=h-2*i;return [[X+cc,Y],[X+W-cc,Y],[X+W,Y+cc],[X+W,Y+H-cc],[X+W-cc,Y+H],[X+cc,Y+H],[X,Y+H-cc],[X,Y+cc]]};
const nrm=[[0,-1],[.7,-.7],[1,0],[.7,.7],[0,1],[-.7,.7],[-1,0],[-.7,-.7]];
for(let k=0;k<steps;k++){const A=oct(k),B=oct(k+1);for(let e=0;e<8;e++){const f=(e+1)%8;const dot=(nrm[e][0]*-.62+nrm[e][1]*-.78);let t=(dot+1)/2;t=Math.min(1,Math.max(0,t+(k%2?-.07:.05)));
const p=document.createElementNS(ns,"polygon");p.setAttribute("points",[A[e],A[f],B[f],B[e]].map(q=>q.join(",")).join(" "));p.setAttribute("fill",col(t));p.setAttribute("stroke","rgba(255,255,255,.28)");p.setAttribute("stroke-width",".8");svg.appendChild(p);}}
const T=oct(steps);const tb=document.createElementNS(ns,"polygon");tb.setAttribute("points",T.map(q=>q.join(",")).join(" "));tb.setAttribute("fill",col(.46));tb.setAttribute("stroke","rgba(255,255,255,.4)");tb.setAttribute("stroke-width",".9");svg.appendChild(tb);return T;}
