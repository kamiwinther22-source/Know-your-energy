<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>

</style></head><body><div id="a"></div><script>
const p=__DATA__[0];

const col=n=>COL[n]||'#6f7b8e';

const rng=r=>{const m=r.match(/(\d+|birth)\D+(\d+|onward)/);return [m[1]=='birth'?0:+m[1],m[2]=='onward'?99:+m[2]+1]};
const Y0=2022,Y1=2037,PH=44,TOP=46,W=362,NOW=2026.79,INK='#1c1f3a';
const Y=y=>TOP+(y-Y0)*PH,H=TOP+(Y1-Y0)*PH+8;

let s='';const bir=NOW-p.age;
[['yr','YEAR'],['es','ESSENCE'],['pi','PINNACLE'],['ch','CHALLENGE'],['pe','PERIOD']].forEach(([k,t])=>{s+=`<text x="${cols[k][0]+25}" y="${TOP-10}" text-anchor="middle" font-size="8.5" fill="#5a5f80">${t}</text>`});
s+=`<text x="${296+33}" y="${TOP-10}" text-anchor="middle" font-size="9.5" fill="#5a5f80">RETURNS</text>`;
for(let y=Y0;y<Y1;y++){s+=`<text x="2" y="${Y(y)+PH/2+4}" font-size="${y===2026?13:11.5}" fill="${y===2026?'#1c2ca9':'#5a5f80'}">${y===2026?"now":y}</text>`;
 const d=p.years.find(o=>o.y===y),cur=y===2026,past=y<2026;
 s+=`<rect x="${cols.yr[0]+1}" y="${Y(y)+2}" width="48" height="${PH-4}" rx="7" fill="${cur?col(d.py):tint(col(d.py),.34)}" opacity="${past?.55:1}"/><text x="${cols.yr[0]+25}" y="${Y(y)+PH/2+6}" text-anchor="middle" font-size="19" fill="${cur?'#fff':INK}" opacity="${past?.6:1}">${d.py}</text>`;
 const cx=cols.es[0]+25,cy=Y(y)+PH/2;s+=`<polygon points="${cx-12},${cy-18} ${cx+12},${cy-18} ${cx+24},${cy} ${cx+12},${cy+18} ${cx-12},${cy+18} ${cx-24},${cy}" fill="${cur?col(d.ess):tint(col(d.ess),.34)}" opacity="${past?.55:1}"/><text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="19" fill="${cur?'#fff':INK}" opacity="${past?.6:1}">${d.ess}</text>`;}
const pin=p.pin.map(o=>{const[a,b]=rng(o.r);return{a,b,v:o.v}});
const bars=(list,k)=>list.forEach(o=>{const a=Math.max(Y0,bir+o.a),b=Math.min(Y1,bir+o.b);if(b<=a)return;const cur=bir+o.a<=NOW&&bir+o.b>NOW,x=cols[k][0],ya=Y(a),yb=Y(b);

 if(yb-ya>30){const ty=cur?Math.min(yb-20,Y(NOW)+34):(ya+yb)/2+7;s+=`<text x="${x+25}" y="${ty}" text-anchor="middle" font-size="22" fill="${cur?'#fff':INK}" opacity="${b<NOW?.6:1}">${o.v}</text>`}});
bars(pin,'pi');bars(pin.map((o,i)=>({a:o.a,b:o.b,v:p.ch[i]})),'ch');bars(p.per.map(o=>{const[a,b]=rng(o.r);return{a,b,v:o.v}}),'pe');

let lastY=-99;p.marks.filter(m=>m.age>1&&!/square|Nodal/.test(m.k)&&bir+m.age>=Y0&&bir+m.age<Y1).sort((a,b)=>a.age-b.age).forEach(m=>{const yr=bir+m.age;let y=Y(yr);if(y-lastY<38)y=lastY+38;lastY=y;const past=yr<NOW,[l1,l2]=nm[m.k];
 s+=`<line x1="${296-6}" y1="${y}" x2="${296}" y2="${y}" stroke="#8c1034" stroke-width="2" opacity="${past?.45:1}"/><rect x="296" y="${y-17}" width="66" height="34" rx="10" fill="#8c1034" opacity="${past?.45:1}"/><text x="329" y="${y-2}" text-anchor="middle" font-size="12" fill="#fff">${l1}</text><text x="329" y="${y+12}" text-anchor="middle" font-size="12" fill="#fff">${l2}</text>`});
const ny=Y(NOW);
s=`<rect x="0" y="${ny-8}" width="${W}" height="16" rx="8" fill="#1c2ca9" opacity=".08"/><line x1="0" y1="${ny}" x2="${W}" y2="${ny}" stroke="#1c2ca9" stroke-width="2.5"/>`+s;

</script></body></html>
