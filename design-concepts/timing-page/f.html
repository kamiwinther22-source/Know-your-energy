<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
@font-face{font-family:'FrauncesK';font-weight:700;src:url(../fonts/node_modules/@fontsource/fraunces/files/fraunces-latin-700-normal.woff2)}
:root{--ink:#1a2236;--mut:#56607a;--bg:#f3f5fa;--a:#1b3d9c;--s:#e2492f}
*{box-sizing:border-box;margin:0;padding:0}
html{width:390px;background:var(--bg)}
body{width:390px;padding:20px 16px 36px;color:var(--ink);font-family:'FrauncesK',Georgia,serif;font-weight:700;background:var(--bg);overflow-x:clip}
h1{font-size:23px;line-height:1.1}h2{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px}
p.s{font-size:14.5px;color:var(--mut);margin-top:5px;line-height:1.4}
.who{display:flex;gap:18px;margin-top:12px;font-size:17px}.who span{display:flex;align-items:center;gap:8px}.who i{width:22px;height:22px;border-radius:50%}
.fact{display:flex;gap:12px;padding:10px 0;font-size:15.5px;line-height:1.3;align-items:flex-start}
.fact b{flex:0 0 112px;font-size:17px;line-height:1.15}
.note{font-size:12.5px;color:var(--mut);margin-top:20px;text-align:center}
svg text{font-family:'FrauncesK',Georgia,serif;font-weight:700}
</style></head><body><div id="app"></div>
<script>
const D=__DATA__;const A=D[0],S=D[1];
const NOWY=2026,Y0=2026,Y1=2037,W=358,cw=W/(Y1-Y0),x=y=>(y-Y0)*cw;
const rng=r=>{const m=r.match(/(\d+|birth)\D+(\d+|onward)/);return [m[1]=='birth'?0:+m[1],m[2]=='onward'?99:+m[2]+1]};
const gl={Saturn:'♄',Jupiter:'♃',Uranus:'♅',Chiron:'⚷',Nodal:'☊',Pinnacle:'▲',Period:'◆'};
function events(p){const ev=[];p.marks.filter(m=>m.age>1&&!/square/.test(m.k)).forEach(m=>ev.push({y:Math.round(p.born+m.age),k:m.k,big:!/Nodal/.test(m.k)}));
 p.pin.forEach((o,i)=>{if(i){const a=rng(o.r)[0];ev.push({y:p.born+a,k:'New Pinnacle',big:true})}});
 p.per.forEach((o,i)=>{if(i){const a=rng(o.r)[0];ev.push({y:p.born+a,k:'New Period',big:true})}});return ev}
const EA=events(A),ES=events(S);
const yrs=[];for(let y=Y0;y<Y1;y++)yrs.push(y);
const get=(p,y)=>p.years.find(o=>o.y===y);
let s='',yy=6;
const AC='#1b3d9c',SC='#e2492f';
// year header
yrs.forEach(y=>{s+=`<text x="${x(y)+cw/2}" y="${yy+12}" text-anchor="middle" font-size="11" fill="#56607a">${String(y).slice(2)==='26'?'now':"'"+String(y).slice(2)}</text>`});yy+=18;
// turning-point shading for years where both have a big event
const both=yrs.filter(y=>EA.some(e=>e.big&&e.y===y)&&ES.some(e=>e.big&&e.y===y));
const either=yrs.filter(y=>EA.some(e=>e.big&&e.y===y)||ES.some(e=>e.big&&e.y===y));
const topY=yy;
// row blocks
const rowYear=yy;
yrs.forEach(y=>{const a=get(A,y),b=get(S,y),cx=x(y)+cw/2;
 const same=a.py===b.py;
 if(same)s+=`<rect x="${cx-10}" y="${yy+12}" width="20" height="40" rx="10" fill="#7a3fc4"/>`;
 s+=`<circle cx="${cx}" cy="${yy+13}" r="12" fill="${AC}"/><text x="${cx}" y="${yy+18.5}" text-anchor="middle" font-size="14" fill="#fff">${a.py}</text>`;
 s+=`<circle cx="${cx}" cy="${yy+51}" r="12" fill="${SC}"/><text x="${cx}" y="${yy+56.5}" text-anchor="middle" font-size="14" fill="#fff">${b.py}</text>`;
 if(same)s+=`<text x="${cx}" y="${yy+36}" text-anchor="middle" font-size="13" fill="#fff">=</text>`});
yy+=80;
// essence
s+=`<text x="0" y="${yy}" font-size="12" fill="#56607a">Essence</text>`;yy+=8;
yrs.forEach(y=>{const a=get(A,y),b=get(S,y),cx=x(y)+cw/2;const same=a.ess===b.ess;
 const hx=(cy,f,n)=>`<polygon points="${cx-5},${cy-11} ${cx+5},${cy-11} ${cx+11},${cy} ${cx+5},${cy+11} ${cx-5},${cy+11} ${cx-11},${cy}" fill="${f}"/><text x="${cx}" y="${cy+4.5}" text-anchor="middle" font-size="12" fill="#fff">${n}</text>`;
 if(same)s+=`<rect x="${cx-9}" y="${yy+8}" width="18" height="30" rx="9" fill="#7a3fc4"/>`;
 s+=hx(yy+12,AC,a.ess)+hx(yy+38,SC,b.ess)});yy+=62;
// turning points
s+=`<text x="0" y="${yy}" font-size="12" fill="#56607a">Turning points</text>`;yy+=8;
const tp=yy;
yrs.forEach(y=>{const cx=x(y)+cw/2;const ea=EA.filter(e=>e.y===y),es=ES.filter(e=>e.y===y);
 const shape=(cy,list,f)=>{if(!list.length)return '';const big=list.filter(e=>e.big);const g=(big[0]||list[0]);const gg=({Saturn:'♄',Jupiter:'♃',Uranus:'♅',Chiron:'⚷',Nodal:'☊','New Pinnacle':'▲','New Period':'◆'})[g.k.split(' ')[0]==='New'?g.k:g.k.split(' ')[0]]||'●';
  return big.length?`<circle cx="${cx}" cy="${cy}" r="12" fill="${f}"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" fill="#fff">${gg}︎</text>`:`<circle cx="${cx}" cy="${cy}" r="4" fill="${f}" opacity=".5"/>`};
 s+=shape(yy+13,ea,AC)+shape(yy+43,es,SC)});
yy+=62;
// shading for both
let shade='';
both.forEach(y=>{shade+=`<rect x="${x(y)+1}" y="${topY-2}" width="${cw-2}" height="${yy-topY+2}" rx="8" fill="#f6c453" opacity=".55"/>`});
const H=yy+10;
const svg=`<svg width="358" height="${H}" viewBox="0 0 358 ${H}">${shade}${s}</svg>`;
// facts
const sameYears=yrs.filter(y=>get(A,y).py===get(S,y).py);
const sameEss=yrs.filter(y=>get(A,y).ess===get(S,y).ess);
const rr=l=>l.length?l.join(', '):'none in this window';
const bothEv=both.map(y=>{const a=EA.find(e=>e.big&&e.y===y),b=ES.find(e=>e.big&&e.y===y);return `<div class="fact"><b>${y}</b><span>Alex: ${a.k}.<br>Sam: ${b.k}.</span></div>`}).join('');
document.getElementById('app').innerHTML=`<h1>Alex and Sam, year by year</h1><p class="s">Two rows, one for each of you. Where the two circles are joined by a purple bar, you have the same number that year. A gold column marks a year when you both have a major turning point at once.</p>
<div class="who"><span><i style="background:${AC}"></i>Alex</span><span><i style="background:${SC}"></i>Sam</span><span><i style="background:#7a3fc4"></i>same number</span></div>
<div style="margin-top:14px">${svg}</div>
<h2>What stands out</h2>
<div class="fact"><b>Same Year number</b><span>${rr(sameYears)}</span></div>
<div class="fact"><b>Same Essence</b><span>${rr(sameEss)}</span></div>
${bothEv||'<div class="fact"><b>Both at once</b><span>none in this window</span></div>'}
<p class="note">Test people. Design only. Circles: Year number. Hexagons: Essence. Last row: ▲ new Pinnacle, ◆ new Period, ♄ ♃ ♅ ⚷ planet returns.</p>`;
</script></body></html>
