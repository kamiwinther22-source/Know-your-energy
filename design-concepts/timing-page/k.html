<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
@font-face{font-family:'Fr';font-weight:400;src:url(../fonts/node_modules/@fontsource/fraunces/files/fraunces-latin-400-normal.woff2)}
@font-face{font-family:'Fr';font-weight:400;font-style:italic;src:url(../fonts/node_modules/@fontsource/fraunces/files/fraunces-latin-400-italic.woff2)}
@font-face{font-family:'Fr';font-weight:600;src:url(../fonts/node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2)}
:root{--ink:#17182b;--mut:#6b6d84;--gar:#8c1034;--blu:#1f2f9c;--cop:#b0653f}
*{box-sizing:border-box;margin:0;padding:0}
html{width:390px;background:#fff}
body{width:390px;padding:30px 20px 36px;background:#fff;color:var(--ink);font-family:'Fr',Georgia,serif;font-weight:400;overflow-x:clip}
.brand{text-align:center;font-size:11px;letter-spacing:.34em;color:var(--mut);font-weight:600}
h1{text-align:center;font-weight:400;font-style:italic;font-size:31px;margin-top:10px;letter-spacing:-.005em}
.rule{width:44px;height:2px;background:var(--gar);margin:14px auto 0;border-radius:1px}
svg text{font-family:'Fr',Georgia,serif}
.legend{display:flex;justify-content:space-between;margin:6px 2px 0}
.legend div{text-align:center;flex:1}.legend b{display:block;font-size:27px;font-weight:600;line-height:1}.legend span{font-size:10.5px;letter-spacing:.2em;color:var(--mut);font-weight:600}
.blk{margin-top:30px}
.lab{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.26em;font-weight:600;color:var(--mut)}
.lab i{width:14px;height:14px;border-radius:50%;display:block}
.blk h2{font-size:23px;font-weight:600;margin-top:8px;line-height:1.2}
.blk p{font-size:16.5px;line-height:1.55;margin-top:8px;color:#2a2b42}
.blk p em{font-style:italic;color:var(--gar)}
.sec{margin-top:40px;text-align:center;font-size:11px;letter-spacing:.3em;color:var(--mut);font-weight:600}
.note{margin-top:26px;text-align:center;font-size:12px;color:var(--mut);font-style:italic}
.nxt{margin-top:12px;font-size:15px;line-height:1.5;color:#2a2b42;text-align:center}
</style></head><body><div id="a"></div><script>
const p=__DATA__[0];
const red=n=>n===11?2:n===22?4:n===33?6:n;
const rng=r=>{const m=r.match(/(\d+|birth)\D+(\d+|onward)/);return [m[1]=='birth'?0:+m[1],m[2]=='onward'?99:+m[2]+1]};
const pinI=p.pin.findIndex(o=>{const[a,b]=rng(o.r);return p.age>=a&&p.age<b});
const perI=p.per.findIndex(o=>{const[a,b]=rng(o.r);return p.age>=a&&p.age<b});
const PIN=p.pin[pinI].v,YR=p.py,MO=p.pm,DY=p.pd;
const COLS={pin:['#ffffff','#c9ced8','#737b8c'],yr:['#8e9cf0','#2538b8','#0e1a6b'],mo:['#e5718f','#9a1239','#4e0a1f'],dy:['#e8b08f','#b0653f','#6a3719']};
let defs='',s='';
const sphere=(id,c)=>{defs+=`<radialGradient id="${id}" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="${c[0]}"/><stop offset=".45" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></radialGradient>`};
Object.entries(COLS).forEach(([k,c])=>sphere('g'+k,c));
defs+=`<radialGradient id="gsun" cx=".36" cy=".3" r=".9"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#e7eaf0"/><stop offset=".5" stop-color="#8b93a4"/><stop offset=".62" stop-color="#2d3140"/><stop offset=".8" stop-color="#b9c0cd"/><stop offset="1" stop-color="#5b6272"/></radialGradient><filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#2a2d55" flood-opacity=".28"/></filter>`;
const rings=[['pin',150,15,PIN],['yr',112,15,YR],['mo',76,13,MO],['dy',44,11,DY]];
rings.forEach(([k,R,r,n])=>{
 s+=`<circle r="${R}" fill="none" stroke="#d6d9e6" stroke-width="1"/>`;
 for(let i=1;i<=9;i++){const a=(i-1)/9*2*Math.PI-Math.PI/2;s+=`<circle cx="${Math.cos(a)*R}" cy="${Math.sin(a)*R}" r="2" fill="#c2c6d8"/>`;}
 const a=(red(n)-1)/9*2*Math.PI-Math.PI/2,x=Math.cos(a)*R,y=Math.sin(a)*R;
 s+=`<circle cx="${x}" cy="${y}" r="${r+5}" fill="${COLS[k][1]}" opacity=".12"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#g${k})" filter="url(#sh)"/><text x="${x}" y="${y+(n>9?4:5.5)}" text-anchor="middle" font-size="${n>9?13:16}" font-weight="600" fill="${k==='pin'?'#1b1d33':'#fff'}">${n}</text>`;
});
s+=`<circle r="25" fill="url(#gsun)" filter="url(#sh)"/><text y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#1b1d33">${p.lp}</text>`;
const dt=new Date(2026,9,17);const dstr=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
// compact timeline
const Y0=2023,Y1=2037,W=350,cw=W/(Y1-Y0),X=y=>(y-Y0)*cw,NOW=2026.79,bir=NOW-p.age;
const COL={1:'#c9483d',2:'#d9822b',3:'#b99a12',4:'#4a9040',5:'#17958c',6:'#2f78c4',7:'#5a4fc4',8:'#9b46ae',9:'#cc4584',11:'#6f7b8e',22:'#2b3347',33:'#7a5a3a'};
const tint=(hex,a)=>{const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;const m=v=>Math.round(v*a+255*(1-a));return `rgb(${m(r)},${m(g)},${m(b)})`};
let t='',ty=22;
for(let y=Y0+1;y<Y1;y+=2)t+=`<text x="${X(y)+cw/2}" y="11" text-anchor="middle" font-size="11" fill="#6b6d84">${y}</text>`;
const lab=(x)=>{t+=`<text x="0" y="${ty+8}" font-size="9.5" letter-spacing="1.6" font-weight="600" fill="#6b6d84">${x}</text>`;ty+=12};
lab('YEAR');p.years.forEach(Y=>{if(Y.y<Y0||Y.y>=Y1)return;const cur=Y.y===2026;t+=`<rect x="${X(Y.y)+1}" y="${ty}" width="${cw-2}" height="24" rx="6" fill="${cur?COL[Y.py]:tint(COL[Y.py],.3)}" opacity="${Y.y<2026?.6:1}"/><text x="${X(Y.y)+cw/2}" y="${ty+17}" text-anchor="middle" font-size="14" font-weight="600" fill="${cur?'#fff':'#17182b'}">${Y.py}</text>`});ty+=32;
const pin=p.pin.map(o=>{const[a,b]=rng(o.r);return{a,b,v:o.v}});
const bars=(l)=>{l.forEach(o=>{const a=Math.max(Y0,bir+o.a),b=Math.min(Y1,bir+o.b);if(b<=a)return;const cur=bir+o.a<=NOW&&bir+o.b>NOW,xa=X(a),xb=X(b);t+=`<rect x="${xa+1}" y="${ty}" width="${xb-xa-2}" height="24" rx="8" fill="${cur?COL[o.v]:tint(COL[o.v],.3)}" opacity="${b<NOW?.6:1}"/>`;if(xb-xa>20)t+=`<text x="${(cur?(Math.max(xa,X(NOW))+xb)/2:(xa+xb)/2)}" y="${ty+17}" text-anchor="middle" font-size="14" font-weight="600" fill="${cur?'#fff':'#17182b'}">${o.v}</text>`});ty+=32};
lab('PINNACLE');bars(pin);lab('CHALLENGE');bars(pin.map((o,i)=>({a:o.a,b:o.b,v:p.ch[i]})));lab('PERIOD');bars(p.per.map(o=>{const[a,b]=rng(o.r);return{a,b,v:o.v}}));
const TH=ty+4,nx=X(NOW);
t=`<line x1="${nx}" y1="16" x2="${nx}" y2="${TH}" stroke="#8c1034" stroke-width="2"/><circle cx="${nx}" cy="16" r="3.5" fill="#8c1034"/>`+t;
document.getElementById('a').innerHTML=`
<div class="brand">KNOW YOUR ENERGY</div><h1>${dstr}</h1><div class="rule"></div>
<svg width="350" height="350" viewBox="-175 -175 350 350" style="display:block;margin:16px auto 0">${'<defs>'+defs+'</defs>'+s}</svg>
<div class="legend"><div><b style="color:#59606f">${PIN}</b><span>PINNACLE</span></div><div><b style="color:#1f2f9c">${YR}</b><span>YEAR</span></div><div><b style="color:#9a1239">${MO}</b><span>MONTH</span></div><div><b style="color:#b0653f">${DY}</b><span>DAY</span></div></div>
<div class="blk"><div class="lab"><i style="background:radial-gradient(circle at 35% 30%,#fff,#c9ced8 45%,#737b8c)"></i>YOUR BASE</div><h2>A year of results, inside a season of letting go.</h2><p>This is an <em>8 year</em>: what you have built is being measured, paid for or promoted. It sits inside a <em>9 stretch</em> of life, which is about finishing, releasing and giving back. Underneath it all runs a long chapter of change and freedom.</p></div>
<div class="blk"><div class="lab"><i style="background:radial-gradient(circle at 35% 30%,#e5718f,#9a1239 50%,#4e0a1f)"></i>THIS MONTH</div><h2>October is a 9 month in your 8 year.</h2><p>Finish what you started this year. Clear out what no longer fits, so that the next 8 year-month can build on clean ground. This is not the month to start something big.</p></div>
<div class="blk"><div class="lab"><i style="background:radial-gradient(circle at 35% 30%,#e8b08f,#b0653f 50%,#6a3719)"></i>TODAY</div><h2>An 8 day, inside a 9 month.</h2><p>A good day for money, business and firm decisions. Close one loose end today, then let the rest of the month do its work.</p></div>
<div class="sec">YOUR BASE OVER TIME</div>
<svg width="350" height="${TH}" viewBox="0 0 350 ${TH}" style="display:block;margin:12px auto 0">${t}</svg>
<div class="nxt">Coming up: Chiron return in 2027, a new 8 Pinnacle in 2029, Saturn return in 2036.</div>
<div class="note">Sample wording and sample art. Your own words come after the design is chosen.</div>`;
</script></body></html>
