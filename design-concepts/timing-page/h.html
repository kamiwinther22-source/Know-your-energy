<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
@font-face{font-family:'FrauncesK';font-weight:700;src:url(../fonts/node_modules/@fontsource/fraunces/files/fraunces-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html{width:390px;background:#fff}
body{width:390px;padding:22px 14px 30px;background:#fff;color:#1c1f3a;font-family:'FrauncesK',Georgia,serif;font-weight:700;overflow-x:clip}
h1{font-family:Georgia,serif;font-weight:400;color:#1c2ca9;font-size:30px;text-align:center}
.sub{text-align:center;font-size:15px;color:#5a5f80;margin-top:6px;line-height:1.3}
.card{background:#f6f1e0;border:1px solid #1c2ca9;border-radius:12px;margin-top:16px;padding:12px 0 6px}
svg text{font-family:'FrauncesK',Georgia,serif;font-weight:700}
.key{display:flex;justify-content:center;gap:16px;font-size:13px;color:#5a5f80;margin-top:12px}
</style></head><body><div id="a"></div><script>
const D=__DATA__,A=D[0],S=D[1];
const COL={1:'#c9483d',2:'#d9822b',3:'#b99a12',4:'#4a9040',5:'#17958c',6:'#2f78c4',7:'#5a4fc4',8:'#9b46ae',9:'#cc4584',11:'#6f7b8e',22:'#2b3347',33:'#7a5a3a'};
const col=n=>COL[n]||'#6f7b8e';
const tint=(hex,a)=>{const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;const m=v=>Math.round(v*a+255*(1-a));return `rgb(${m(r)},${m(g)},${m(b)})`};
const rng=r=>{const m=r.match(/(\d+|birth)\D+(\d+|onward)/);return [m[1]=='birth'?0:+m[1],m[2]=='onward'?99:+m[2]+1]};
const Y0=2018,Y1=2040,PH=42,H=(Y1-Y0)*PH,TOP=44;
const yPos=y=>TOP+(y-Y0)*PH;
const NOW=2026.79;
const W=362,C=W/2;
let s='';
// ruler
s+=`<rect x="${C-14}" y="${TOP}" width="28" height="${H}" rx="14" fill="#fff" stroke="#c9c2a6"/>`;
for(let y=Y0;y<Y1;y++){ if((y%2)==0) s+=`<text x="${C}" y="${yPos(y)+PH/2+5}" text-anchor="middle" font-size="12.5" fill="#5a5f80">${String(y).slice(2)}</text>`;}
s+=`<text x="${C}" y="${TOP-6}" text-anchor="middle" font-size="11" fill="#5a5f80">YEAR</text>`;
const side=(p,dir,name)=>{ // dir -1 left, +1 right
 const xr=(off,w)=>dir<0?C-off-w:C+off;
 const bx=(a,b)=>a;
 const born=p.born+ (NOW-p.born-p.age) ; // birth in decimal year
 const bir=NOW-p.age;
 let o='';
 const pinX=xr(80,44),perX=xr(130,44),mx=xr(18,0);
 const bands=(list,x,w,fillFn,txt)=>{list.forEach(it=>{const y1=Math.max(Y0,bir+it.a),y2=Math.min(Y1,bir+it.b);if(y2<=y1)return;const yy1=yPos(y1),yy2=yPos(y2);
   const past=y2<NOW;o+=`<rect x="${x}" y="${yy1+1}" width="${w}" height="${yy2-yy1-2}" rx="8" fill="${fillFn(it.v)}" opacity="${past?.35:1}"/>`;
   const cy=(Math.max(yy1,yPos(NOW)-0)+yy2)/2; const lab=(y1<=NOW&&y2>NOW)?(yPos(NOW)+yy2)/2:(yy1+yy2)/2;
   if(yy2-yy1>34)o+=`<text x="${x+w/2}" y="${(y1<=NOW&&y2>NOW)?Math.min(yy2-16,yPos(NOW)+30):(yy1+yy2)/2+8}" text-anchor="middle" font-size="22" fill="${fillFn(it.v).startsWith('rgb')?'#1c1f3a':'#fff'}" opacity="${past?.6:1}">${it.v}</text>`});};
 bands(p.per.map(o=>{const[a,b]=rng(o.r);return{a,b,v:o.v}}),perX,44,v=>tint(col(v),.38));
 const pin=p.pin.map(o=>{const[a,b]=rng(o.r);return{a,b,v:o.v}});
 bands(pin,pinX,44,v=>col(v));
 // milestones
 p.marks.filter(m=>m.age>1&&!/square|Nodal/.test(m.k)).forEach(m=>{const yr=bir+m.age;if(yr<Y0||yr>=Y1)return;const y=yPos(yr);const past=yr<NOW;
   const w=58,x=xr(18,w);const [l1,l2]=({'Saturn return':['Saturn','return'],'Saturn opposition':['Saturn','opposite'],'Uranus opposition':['Uranus','opposite'],'Jupiter return':['Jupiter','return'],'Chiron return':['Chiron','return']})[m.k]||[m.k,''];
   o+=`<rect x="${x}" y="${y-17}" width="${w}" height="34" rx="9" fill="#8c1034" opacity="${past?.45:1}"/><text x="${x+w/2}" y="${y-2}" text-anchor="middle" font-size="12" fill="#fff">${l1}</text><text x="${x+w/2}" y="${y+12}" text-anchor="middle" font-size="12" fill="#fff">${l2}</text>`;
   const cx=dir<0?C-14:C+14;o+=`<line x1="${dir<0?x+w:x}" y1="${y}" x2="${cx}" y2="${y}" stroke="#8c1034" stroke-width="2" opacity="${past?.4:1}"/>`;});
 o+=`<text x="${(pinX+perX+44)/2}" y="${TOP-32}" text-anchor="middle" font-size="17" fill="${dir<0?'#1b3d9c':'#cf3b24'}">${name}</text>`;
 return o};
s+=side(A,-1,'ALEX')+side(S,1,'SAM');
// column labels
[[-1,80,'PINNACLE'],[-1,130,'PERIOD'],[1,80,'PINNACLE'],[1,130,'PERIOD']].forEach(([d,off,t])=>{s+=`<text x="${C+d*(off+22)}" y="${TOP-12}" text-anchor="middle" font-size="10" fill="#5a5f80" letter-spacing=".5">${t}</text>`});
// now line
const ny=yPos(NOW);
s+=`<line x1="6" y1="${ny}" x2="${W-6}" y2="${ny}" stroke="#1c2ca9" stroke-width="3" stroke-dasharray="0"/><rect x="${C-26}" y="${ny-13}" width="52" height="26" rx="13" fill="#1c2ca9"/><text x="${C}" y="${ny+5}" text-anchor="middle" font-size="14" fill="#fff">NOW</text>`;
document.getElementById('a').innerHTML=`<h1>Your story</h1><div class="sub">Each of your chapters, side by side on one calendar.</div><div class="card"><svg width="${W}" height="${H+TOP+10}" viewBox="0 0 ${W} ${H+TOP+10}">${s}</svg></div><div class="key"><span>Outer: Period</span><span>Inner: Pinnacle</span><span style="color:#8c1034">Red: a return</span></div>`;
</script></body></html>
