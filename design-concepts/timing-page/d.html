<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
@font-face{font-family:'FrauncesK';font-weight:700;src:url(../fonts/node_modules/@fontsource/fraunces/files/fraunces-latin-700-normal.woff2)}
:root{--ink:#1a2236;--mut:#56607a;--num:#0e8a86;--num2:#55b8b2;--num3:#a8dcd7;--ast:#4a4fd0;--ast2:#2b2d8c;--hd:#e8702a;--bg:#f3f5fa}
*{box-sizing:border-box;margin:0;padding:0}
html{width:390px;background:var(--bg)}
body{width:390px;padding:20px 16px 36px;color:var(--ink);font-family:'FrauncesK',Georgia,serif;font-weight:700;background:var(--bg);overflow-x:clip}
h1{font-size:23px;line-height:1.1}h2{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
p.s{font-size:14px;color:var(--mut);margin-top:4px;line-height:1.35}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.leg{margin-top:6px}.leg div{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:5px 0;line-height:1.25}
.leg b{font-weight:700}.leg span.v{text-align:right;color:var(--ink)}
.row{display:flex;gap:3px}.cell{flex:1 1 0;text-align:center;border-radius:6px;padding:4px 0}
.cell small{display:block;font-size:10.5px;color:var(--mut)}
.cell .n{font-size:19px;line-height:1.15}
.hexn{display:inline-block;width:28px;height:30px;line-height:30px;font-size:15px;color:#fff;background:var(--ast);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.now{background:#fff;box-shadow:0 2px 10px rgba(30,40,90,.18)}
.note{font-size:12.5px;color:var(--mut);margin-top:20px;text-align:center}
.bezel{background:linear-gradient(135deg,#fff,#c9d0dc 45%,#f7f9fc 55%,#aeb8c8);border-radius:50%;padding:5px;width:max-content;margin:12px auto 0;box-shadow:0 8px 22px rgba(40,55,100,.22)}
svg text{font-family:'FrauncesK',Georgia,serif;font-weight:700}
</style></head><body><div id="app"></div>
<script>
const D=__DATA__, V=new URLSearchParams(location.search).get('v')||'1';
const SG=['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'].map(g=>g+'\uFE0E'), SGN=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
const MAXAGE=92, NOWY=2026.79;
const rng=r=>{const m=r.match(/(\d+|birth)\D+(\d+|onward)/);return [m[1]=='birth'?0:+m[1],m[2]=='onward'?MAXAGE:+m[2]+1]};
const ang=a=>a/MAXAGE*2*Math.PI-Math.PI/2;
const pt=(r,a)=>[Math.cos(a)*r,Math.sin(a)*r];
function arc(r0,r1,a0,a1){const [x0,y0]=pt(r1,a0),[x1,y1]=pt(r1,a1),[x2,y2]=pt(r0,a1),[x3,y3]=pt(r0,a0);const L=(a1-a0)>Math.PI?1:0;
 return `M${x0},${y0}A${r1},${r1} 0 ${L} 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 ${L} 0 ${x3},${y3}Z`}
function dial(p){
 const R=172,W=17,G=2.5;let s='';const rings=[];
 const defs=[['events',null],['jup','Jupiter'],['sat','Saturn'],['ch','Challenge'],['pin','Pinnacle'],['per','Period']];
 defs.forEach((d,i)=>rings.push({k:d[0],r1:R-i*(W+G),r0:R-i*(W+G)-W}));
 const ring=k=>rings.find(r=>r.k==k);
 const seg=(k,list,fill,tc,label)=>{const g=ring(k);list.forEach(o=>{const a0=ang(o.a),a1=ang(o.b)-0.012;s+=`<path d="${arc(g.r0,g.r1,a0,a1)}" fill="${fill(o)}"/>`;
   if((o.b-o.a)>=7){const [x,y]=pt((g.r0+g.r1)/2,(a0+a1)/2);s+=`<text x="${x}" y="${y+4.2}" text-anchor="middle" font-size="12" fill="${tc(o)}">${label(o)}</text>`}})};
 // guide ticks every 10 years
 for(let a=0;a<=90;a+=10){const [x0,y0]=pt(R+4,ang(a)),[x1,y1]=pt(R+9,ang(a));s+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#9aa3b8" stroke-width="1.5"/>`;const [tx,ty]=pt(R+20,ang(a));s+=`<text x="${tx}" y="${ty+4}" text-anchor="middle" font-size="11" fill="#56607a">${a}</text>`}
 const pin=p.pin.map(o=>{const [a,b]=rng(o.r);return {a,b,v:o.v}});
 seg('pin',pin,o=>'#0e8a86',()=>'#fff',o=>o.v);
 seg('per',p.per.map(o=>{const [a,b]=rng(o.r);return {a,b,v:o.v}}),o=>'#55b8b2',()=>'#10333a',o=>o.v);
 seg('ch',p.ch.map((v,i)=>({a:pin[i].a,b:pin[i].b,v})),o=>'#a8dcd7',()=>'#10333a',o=>o.v);
 const mk=(arr)=>{const out=[];arr.forEach(o=>{const L=out[out.length-1];if(L&&(o.end-o.start<0.6||L.sg===o.sg)){L.b=o.end}else out.push({a:o.start,b:o.end,sg:o.sg})});return out};
 const shade=(sg)=>['#4a4fd0','#6a6fe0'][sg%2];
 seg('jup',mk(p.jup),o=>shade(o.sg),()=>'#fff',o=>'');
 seg('sat',mk(p.sat),o=>['#2b2d8c','#3d40a8'][o.sg%2],()=>'#fff',o=>SG[o.sg]);
 // events ring: dots
 const ev=ring('events'),rm=(ev.r0+ev.r1)/2;
 s+=`<circle r="${rm}" fill="none" stroke="#f2cdb6" stroke-width="2"/>`;
 p.marks.filter(m=>m.age>1&&m.age<91&&m.k!='Saturn square').forEach(m=>{const [x,y]=pt(rm,ang(m.age));const big=/return|opposition/.test(m.k)&&!/Nodal/.test(m.k);
   s+=`<circle cx="${x}" cy="${y}" r="${big?7:4}" fill="${big?'#e8702a':'#f2a679'}"/>`});
 // now needle
 const na=ang(p.age);const [nx0,ny0]=pt(58,na),[nx1,ny1]=pt(R+3,na);
 s+=`<line x1="${nx0}" y1="${ny0}" x2="${nx1}" y2="${ny1}" stroke="#1a2236" stroke-width="3" stroke-linecap="round"/><circle cx="${nx1}" cy="${ny1}" r="5" fill="#1a2236"/>`;
 // center
 s+=`<circle r="54" fill="#fff"/><text y="-22" text-anchor="middle" font-size="10" fill="#56607a" letter-spacing="1">YEAR</text><text x="-15" y="18" text-anchor="middle" font-size="40" fill="#0e8a86">${p.py}</text><foreignObject x="4" y="-2" width="40" height="40"><div xmlns="http://www.w3.org/1999/xhtml" class="hexn" style="margin-top:4px">${p.ess}</div></foreignObject><text x="24" y="40" text-anchor="middle" font-size="9" fill="#56607a" letter-spacing="1">ESSENCE</text>`;
 return `<div class="bezel"><svg width="358" height="358" viewBox="-179 -179 358 358" style="background:#fff;border-radius:50%;display:block">${s}</svg></div>`}
function legend(p){
 const ageNow=Math.floor(p.age);const cur=(list,key)=>{for(const o of list){const [a,b]=rng(o.r);if(p.age>=a&&p.age<b)return o.v}};
 const at=(l)=>SGN[l.find(o=>p.age>=o.start&&p.age<o.end).sg];
 const nxt=p.marks.filter(m=>m.age>p.age&&!/Nodal|square/.test(m.k)).sort((a,b)=>a.age-b.age)[0];
 const nn=p.marks.filter(m=>m.age>p.age&&/Nodal/.test(m.k))[0];
 const pinI=p.pin.findIndex(o=>{const[a,b]=rng(o.r);return p.age>=a&&p.age<b});
 return `<div class="leg">
 <div><b><i class="sw" style="background:#0e8a86"></i>Pinnacle</b><span class="v">${p.pin[pinI].v} until age ${rng(p.pin[pinI].r)[1]} → then ${p.pin[pinI+1].v}</span></div>
 <div><b><i class="sw" style="background:#a8dcd7"></i>Challenge</b><span class="v">${p.ch[pinI]} (same stretch)</span></div>
 <div><b><i class="sw" style="background:#55b8b2"></i>Period</b><span class="v">${cur(p.per)}</span></div>
 <div><b><i class="sw" style="background:#2b2d8c"></i>Saturn</b><span class="v">in ${at(p.sat)}</span></div>
 <div><b><i class="sw" style="background:#4a4fd0"></i>Jupiter</b><span class="v">in ${at(p.jup)}</span></div>
 <div><b><i class="sw" style="background:#e8702a"></i>Life markers</b><span class="v">next: ${nxt.k} at ${Math.round(nxt.age)}</span></div></div>`}
function zoom(p){
 const yr=p.years.slice(6,15).map((y,i)=>`<div class="cell ${i==2?'now':''}"><small>${y.y}</small><div class="n" style="color:#0e8a86">${y.py}</div><span class="hexn" style="width:22px;height:24px;line-height:24px;font-size:12px">${y.ess}</span></div>`).join('');
 const mo=p.months.map((y,i)=>`<div class="cell ${i==2?'now':''}"><small>${y.m}</small><div class="n" style="color:#0e8a86">${y.pm}</div></div>`).join('');
 const dy=p.days.map((y,i)=>`<div class="cell ${i==2?'now':''}"><small>${y.d}</small><div class="n" style="color:#0e8a86">${y.pd}</div></div>`).join('');
 return `<h2>${p.name} · years, with Essence</h2><div class="row">${yr}</div><h2>${p.name} · months</h2><div class="row" style="gap:1px">${mo}</div><h2>${p.name} · days</h2><div class="row">${dy}</div>`}
const mk2=arr=>{const out=[];arr.forEach(o=>{const L=out[out.length-1];if(L&&(o.end-o.start<0.6||L.sg===o.sg)){L.b=o.end}else out.push({a:o.start,b:o.end,sg:o.sg})});return out};
function together(){
 const y0=2022,y1=2037,W=358,x=y=>(y-y0)/(y1-y0)*W;let s='',yy=18;
 const rowH=22;const rows=[];
 D.forEach((p,pi)=>{const birth=NOWY-p.age;
  const A=a=>x(birth+a);
  const label=t=>{s+=`<text x="0" y="${yy+11}" font-size="12.5" fill="#56607a">${t}</text>`;yy+=17};
  s+=`<text x="0" y="${yy+16}" font-size="19" fill="#1a2236">${p.name}</text>`;yy+=26;
  const band=(list,fill,tc,lab)=>{list.forEach(o=>{const a=A(o.a),b=A(o.b);const l=Math.max(0,a),r=Math.min(W,b);if(r<=l)return;s+=`<rect x="${l+0.5}" y="${yy}" width="${r-l-1}" height="${rowH-3}" rx="3" fill="${fill(o)}"/>`;if(r-l>16)s+=`<text x="${(l+r)/2}" y="${yy+14}" text-anchor="middle" font-size="12" fill="${tc}">${lab(o)}</text>`});yy+=rowH};
  label('Year · Essence');
  p.years.forEach((Y,k)=>{if(Y.y<y0||Y.y>=y1)return;const cw=W/(y1-y0),cx=x(Y.y)+cw/2;const hy=yy+rowH+1;
   s+=`<rect x="${x(Y.y)+1}" y="${yy}" width="${cw-2}" height="${rowH-3}" rx="3" fill="#0e8a86"/><text x="${cx}" y="${yy+15}" text-anchor="middle" font-size="14" fill="#fff">${Y.py}</text>`;
   s+=`<polygon points="${cx-6},${hy} ${cx+6},${hy} ${cx+11},${hy+9} ${cx+6},${hy+18} ${cx-6},${hy+18} ${cx-11},${hy+9}" fill="#4a4fd0"/><text x="${cx}" y="${hy+13}" text-anchor="middle" font-size="12" fill="#fff">${Y.ess}</text>`});yy+=rowH+24;
  label('Pinnacle · Challenge');
  const pin=p.pin.map(o=>{const [a,b]=rng(o.r);return {a,b,v:o.v}});
  band(pin,()=>'#0e8a86','#fff',o=>o.v);
  band(p.ch.map((v,i)=>({a:pin[i].a,b:pin[i].b,v})),()=>'#a8dcd7','#10333a',o=>o.v);
  label('Period');
  band(p.per.map(o=>{const [a,b]=rng(o.r);return {a,b,v:o.v}}),()=>'#55b8b2','#10333a',o=>o.v);
  label('Saturn · Jupiter');
  band(mk2(p.sat),o=>['#2b2d8c','#3d40a8'][o.sg%2],'#fff',o=>SG[o.sg]);
  band(mk2(p.jup),o=>['#4a4fd0','#6a6fe0'][o.sg%2],'#fff',o=>SG[o.sg]);
  label('Life markers');
  p.marks.filter(m=>m.age>1&&!/square/.test(m.k)).forEach(m=>{const cx=A(m.age);if(cx<4||cx>W-4)return;const big=!/Nodal/.test(m.k);const gl={Saturn:'♄',Jupiter:'♃',Uranus:'♅',Chiron:'⚷'}[m.k.split(' ')[0]]+'\uFE0E';s+=big?`<circle cx="${cx}" cy="${yy+10}" r="10" fill="#e8702a"/><text x="${cx}" y="${yy+15}" text-anchor="middle" font-size="13" fill="#fff">${gl}</text>`:`<circle cx="${cx}" cy="${yy+10}" r="4" fill="#f2a679"/>`});yy+=rowH+10;
 });
 // year axis
 for(let yr=2024;yr<=2036;yr+=2){s+=`<text x="${x(yr)}" y="${yy+12}" text-anchor="middle" font-size="12" fill="#56607a">${yr}</text>`}
 const H=yy+20;
 // now line + shared windows
 const nx=x(NOWY);
 s=`<text x="${nx}" y="10" text-anchor="middle" font-size="12" fill="#1a2236">now</text><rect x="${nx-7}" y="14" width="14" height="${yy-14}" fill="#1a2236" opacity=".10" rx="7"/><line x1="${nx}" y1="14" x2="${nx}" y2="${yy}" stroke="#1a2236" stroke-width="2"/>`+s;
 return `<svg width="358" height="${H+4}" viewBox="0 0 358 ${H+4}">${s}</svg>`}
const app=document.getElementById('app');
if(V=='1'){const p=D[0];app.innerHTML=`<h1>${p.name}'s time dial</h1><p class="s">Every cycle, one picture. Around the circle is a whole life, age 0 to 90. The dark needle is where ${p.name} is today. The centre is this year and its Essence.</p>${dial(p)}<h2>Reading the rings, outside to in</h2>${legend(p)}<p class="note">Test person. Design only.</p>`}
if(V=='2'){app.innerHTML=`<h1>Close up: now and next</h1><p class="s">The needle's neighbours. Years always show Essence under them. Today is the white card.</p>${zoom(D[0])}${zoom(D[1])}<p class="note">Test people. Design only.</p>`}
if(V=='3'){app.innerHTML=`<h1>Alex &amp; Sam on one calendar</h1><p class="s">Both lives laid on the same years. Where the colours change in both rows at the same time, you are both at a turning point together. Orange: the long returns (Saturn, Jupiter, Uranus, Chiron). Small orange: Moon's nodes.</p><div style="margin-top:12px">${together()}</div><p class="note">Test people. Design only.</p>`}
</script></body></html>
