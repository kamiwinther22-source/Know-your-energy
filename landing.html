<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know Your Energy</title>
<!--
  Cold-open landing page -- separate file from index.html (the entry/data
  form). See landing-page-brief.md.

  The swirl-photo background was removed entirely, per direct
  instruction -- do not reintroduce it or that file. Page background is
  unresolved, pending new direction.

  hd-disc-circle.png is her real Human Design chart photo -- name blurred
  out (the original said "Kami" on the rim, minimal blur radius, nothing
  else touched), then an alpha mask matched to the disc's own measured
  true edge (found by pixel measurement on the source photo, not
  guessed) is applied over a generously-margined crop: everything
  outside the true disc silhouette is real transparency, zero blurred or
  reconstructed fill. A first attempt fit the mask to the crop
  rectangle's own frame instead of the disc's real (non-rectangular)
  proportions and clipped part of the outer glass rim's thickness --
  fixed by re-measuring the true edge directly and matching the mask to
  it. An earlier, separate attempt that blur-filled small background
  gaps inside the circle was rejected as "faking" the photo -- do not
  reintroduce any blur/reconstruction fill; only real photo content or
  true transparency, nothing in between.
-->
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;}

:root{
  --ink:#252a30;
  --accent:#306AC0;
}

html{min-height:100%;}
body{
  font-family:'DM Sans',sans-serif;color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  /* Sampled directly from the wall/counter behind the disc in her real
     HD chart photo (not invented) -- avg RGB(250,251,247). */
  background-color:#fafbf7;
}

.page{max-width:640px;margin:0 auto;padding:2.4rem 1.2rem 3rem;position:relative;overflow:visible;}

/* Asymmetric hero: title+tagline anchored left, chart circle bleeding
   Bleed-off-edge asymmetry was tried and explicitly rejected as the
   technique for this -- reverted to a plain centered layout. The
   single-column-template problem this was meant to solve is still
   open; needs a different technique, not guessed at again here. */
.hero{position:relative;text-align:center;margin-bottom:1.6rem;}
.brand{
  font-family:'Alex Brush',cursive;font-weight:400;line-height:1;white-space:nowrap;
  font-size:clamp(2rem,10vw,3.4rem);
  color:var(--ink);
  margin-bottom:0.7rem;
  position:relative;z-index:2;
}
.copy-placeholder{
  display:inline-block;border:1.5px dashed var(--accent);border-radius:10px;
  background:rgba(255,255,255,0.4);padding:0.6rem 0.85rem;
  max-width:100%;
}
.ph-label{
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:0.54rem;
  letter-spacing:0.09em;text-transform:uppercase;color:var(--accent);margin-bottom:0.25rem;
}
.ph-tagline{font-family:'DM Sans',sans-serif;font-style:italic;font-size:0.85rem;color:var(--ink);}

/* No card, no border, no box -- just the circular chart photo floating
   on the page background. Contained, in-flow -- no bleed-off-edge. */
.chart-circle{
  width:min(78vw,320px);height:auto;
  display:block;margin:1.4rem auto 0;
}

/* Actual squares, sized tight around the key point with the most words
   (the "email/pass" one, 17 words) -- no icons anymore, just the text
   itself. 131px is the smallest square that text fits in at this
   padding without wrapping past its own edges (found by bisection, not
   guessed). All four boxes are fixed to that same size. */
.trust-list{
  display:grid;grid-template-columns:repeat(2, 131px);gap:0.7rem;
  justify-content:center;margin:0 auto 2.2rem;
}
.trust-row{
  width:131px;height:131px;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  border:1px solid rgba(48,106,192,0.35);border-radius:12px;
  background:rgba(48,106,192,0.035);
  padding:0.5rem;
}
.trust-txt{font-size:0.86rem;line-height:1.34;color:var(--ink);font-weight:700;}
.trust-txt mark{background:none;color:var(--accent);font-weight:800;}

/* The lead offer line -- no box, no icon, set apart with real typography
   since it's the actual free-reading offer, not a bullet point like the
   other four. */
.trust-lead{text-align:center;margin-bottom:1.5rem;}
.trust-lead .trust-txt{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:1.15rem;line-height:1.4;letter-spacing:0.01em;color:var(--ink);
}
.trust-lead .trust-txt mark{color:var(--accent);font-weight:800;}

.systems-caption{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0.5em;
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.15rem;
  letter-spacing:0.05em;text-transform:uppercase;color:var(--ink);text-align:center;
  padding-top:0.6rem;
}
.systems-caption .sys{white-space:nowrap;}
.systems-caption .dot{color:var(--accent);font-weight:400;}
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <div class="brand">Know Your Energy</div>
    <div class="copy-placeholder">
      <div class="ph-label">Placeholder — replace with real tagline</div>
      <div class="ph-tagline">[ tagline goes here ]</div>
    </div>
    <img class="chart-circle" src="hd-disc-circle.png" alt="Human Design chart">
  </div>

  <div class="trust-lead" id="trustLead"></div>
  <div class="trust-list" id="trustList"></div>

  <div class="systems-caption">
    <span class="sys">Astrology</span><span class="dot">&middot;</span>
    <span class="sys">Numerology</span><span class="dot">&middot;</span>
    <span class="sys">Human Design</span>
  </div>
</div>

<script>
// Same wording already approved and live on the entry form's
// key-selling-point list (index.html KEYS array) -- reused verbatim.
const LEAD = '1 full <mark>free</mark> astrology, numerology, human design reading for you or a relationship of any two people.';
const KEYS = [
  'Your info is <mark>neither</mark> shared <mark>nor</mark> saved',
  '<mark>No subscriptions</mark> or auto-renewals',
  '<mark>Email</mark> is simply your key to your results and time-limited <mark>pass</mark> if you choose to purchase one.',
  'You will not receive emails from us',
];
document.getElementById('trustLead').innerHTML = `<div class="trust-txt">${LEAD}</div>`;
document.getElementById('trustList').innerHTML = KEYS.map(t=>`
  <div class="trust-row">
    <div class="trust-txt">${t}</div>
  </div>
`).join('');
</script>
</body>
</html>
