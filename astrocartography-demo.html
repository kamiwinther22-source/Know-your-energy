<script>
const P=[["sun","Sun","#f2c230","your core self and vitality"],["moon","Moon","#c9d3e6","your feelings, needs and sense of safety"],["mercury","Mercury","#7bd88f","thinking, talking, learning and deals"],["venus","Venus","#ff7eb6","love, pleasure, money and taste"],["mars","Mars","#ff5340","drive, courage, conflict and desire"],["jupiter","Jupiter","#ff9a3c","growth, luck, optimism and expansion"],["saturn","Saturn","#a08f7a","discipline, limits, duty and long effort"],["uranus","Uranus","#2fd4e0","change, freedom, surprise and independence"],["neptune","Neptune","#6f8cff","imagination, ideals, blur and sensitivity"],["pluto","Pluto","#b560e0","intensity, power, transformation and obsession"]];
const A={ASC:["Ascendant","rising","in you: your presence, body and the way people first meet you"],MC:["Midheaven","overhead","in your public life: career, reputation and what you are known for"],DSC:["Descendant","setting","in other people: partners, clients and close relationships, who tend to carry this energy"],IC:["Imum Coeli","underfoot","in your private life: home, family, roots and inner security"]};

const map=L.map("map",{worldCopyJump:true,minZoom:2}).setView([20,-30],2);

function popup(k,name,col,theme,ang){return `<b style="color:${col}">${name} ${ang}</b><br><i>${A[ang][0]} line</i><br>${name} is ${A[ang][1]} here. Its themes (${theme}) show up ${A[ang][2]}.<br><small style="color:#888">Placeholder wording, not final copy.</small>`}

 ["ASC","DSC"].forEach(a=>{layers[k][a]=L.layerGroup(split(ln[a]).map(s=>L.polyline(s,{color:col,weight:2.5,dashArray:dash[a]}).bindPopup(popup(k,name,col,theme,a))))});

 on[k]=true});
