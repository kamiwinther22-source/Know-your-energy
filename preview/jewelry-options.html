<!doctype html><meta charset=utf-8><title>Jewelry button options</title>
<style>
body{margin:0;padding:28px;background:radial-gradient(ellipse at 50% 0,#4a0f1c,#1c0509 80%);color:#ddd;font:14px Arial,sans-serif}
h2{font:600 15px Arial,sans-serif;letter-spacing:.08em;color:#f0b8e0;margin:34px 0 14px}
.row{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.b{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;
 font:800 15px 'Arial Narrow',Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#0a0d12;text-shadow:0 0 6px rgba(255,255,255,.9),0 1px 0 #fff}
.w{width:210px;height:58px}.s{width:140px;height:58px}
.hex{clip-path:polygon(19px 0,calc(100% - 19px) 0,100% 50%,calc(100% - 19px) 100%,19px 100%,0 50%)}
.b span{position:relative;z-index:3}
/* 4-point star glint */
.st{position:absolute;z-index:4;width:26px;height:26px;transform:translate(-50%,-50%) scale(.25);opacity:0;animation:tw 2.4s ease-in-out infinite;pointer-events:none}
.st::before,.st::after{content:"";position:absolute;left:0;top:50%;width:100%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,#fff 50%,transparent);box-shadow:0 0 6px 1px #fff}
.st::after{transform:rotate(90deg)}
.st i{position:absolute;inset:9px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px #fff}
@keyframes tw{0%,55%,100%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}85%{opacity:.5;transform:translate(-50%,-50%) scale(.5) rotate(90deg)}}

/* D: polished platinum — hard contrast rim + mirror face with crisp specular streaks */
.D{background:linear-gradient(180deg,#fff 0,#c8d0d8 22%,#1d232a 48%,#8b95a0 60%,#fff 100%)}
.D::before{content:"";position:absolute;inset:4px;z-index:-1;background:
 linear-gradient(115deg,transparent 18%,#fff 20%,#fff 24%,transparent 25%,transparent 62%,#fff 64%,#fff 67%,transparent 68%),
 linear-gradient(180deg,#eef1f4 0,#b7c0ca 34%,#6f7a86 50%,#aeb8c2 56%,#e9edf1 100%)}
.D.hex::before{inset:4px 7px;clip-path:polygon(15px 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,15px 100%,0 50%)}

/* E: brilliant-cut facets — radiating cut-gem facets, bright/dark alternating */
.E{background:linear-gradient(135deg,#fff,#9aa4af 40%,#fff 60%,#7f8993)}
.E::before{content:"";position:absolute;inset:3px;z-index:-2;background:repeating-conic-gradient(from 8deg at 50% 50%,#ffffff 0 7.5deg,#8c97a3 7.5deg 15deg,#e6eaee 15deg 22.5deg,#4f5964 22.5deg 30deg)}
.E::after{content:"";position:absolute;inset:3px;z-index:-1;background:radial-gradient(ellipse 60% 70% at 50% 50%,rgba(255,255,255,.85) 0,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 85%)}
.E.hex::before,.E.hex::after{inset:3px 6px;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%)}

/* F: diamond-set bezel — mirror face framed by rows of tiny set stones */
.F{background:linear-gradient(180deg,#fff,#a9b2bc 45%,#e8ecf0)}
.F::before{content:"";position:absolute;inset:3px;z-index:-1;background:
 radial-gradient(circle at 50% 50%,#fff 0 22%,#d6efff 34%,#fff0 62%) 0 0/13px 11px repeat-x,
 radial-gradient(circle at 50% 50%,#fff 0 22%,#d6efff 34%,#fff0 62%) 0 100%/13px 11px repeat-x,
 linear-gradient(115deg,transparent 30%,rgba(255,255,255,.95) 34%,transparent 40%),
 linear-gradient(180deg,#f4f6f8,#aab3be 46%,#6c7782 52%,#cfd5dc),#4b5560}
.F.hex::before{inset:3px 6px;clip-path:polygon(15px 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,15px 100%,0 50%)}
</style>
<h2>D — POLISHED PLATINUM: hard-contrast rim, mirror face, sharp specular streaks, twinkling star glints</h2>
<div class=row>
<button class="b D w hex"><span>Reveal Chart</span><b class=st style="left:20%;top:30%"><i></i></b><b class=st style="left:80%;top:68%;animation-delay:1.1s"><i></i></b></button>
<button class="b D s hex"><span>Pass</span><b class=st style="left:78%;top:30%"><i></i></b></button>
<button class="b D w"><span>Run / Save</span><b class=st style="left:88%;top:28%;animation-delay:.6s"><i></i></b></button></div>
<h2>E — BRILLIANT-CUT FACETS: face cut like a gemstone, light/dark facets fan out, glints on the facets</h2>
<div class=row>
<button class="b E w hex"><span>Reveal Chart</span><b class=st style="left:16%;top:50%;animation-delay:.3s"><i></i></b><b class=st style="left:86%;top:30%;animation-delay:1.4s"><i></i></b></button>
<button class="b E s hex"><span>Pass</span><b class=st style="left:80%;top:34%;animation-delay:.9s"><i></i></b></button>
<button class="b E w"><span>Run / Save</span><b class=st style="left:12%;top:30%;animation-delay:.2s"><i></i></b></button></div>
<h2>F — DIAMOND-SET BEZEL: mirror silver plate with rows of tiny set stones that flash</h2>
<div class=row>
<button class="b F w hex"><span>Reveal Chart</span><b class=st style="left:30%;top:12%;animation-delay:.5s"><i></i></b><b class=st style="left:72%;top:88%;animation-delay:1.7s"><i></i></b></button>
<button class="b F s hex"><span>Pass</span><b class=st style="left:68%;top:12%;animation-delay:1s"><i></i></b></button>
<button class="b F w"><span>Run / Save</span><b class=st style="left:40%;top:88%;animation-delay:.8s"><i></i></b></button></div>
