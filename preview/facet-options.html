<!doctype html><meta charset=utf-8><title>Jewelry button options</title>
<style>
body{margin:0;padding:28px;background:radial-gradient(ellipse at 50% 0,#4a0f1c,#1c0509 80%);color:#ddd;font:14px Arial,sans-serif}
h2{font:600 15px Arial,sans-serif;letter-spacing:.08em;color:#f0b8e0;margin:34px 0 14px}
.row{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.b{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;
 font:800 15px 'Arial Narrow',Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#0a0d12;text-shadow:0 0 6px rgba(255,255,255,.9),0 1px 0 #fff}
.w{width:210px;height:58px}.s{width:140px;height:58px}
.hex{clip-path:polygon(19px 0,calc(100% - 19px) 0,100% 50%,calc(100% - 19px) 100%,19px 100%,0 50%)}
.b span{position:relative;z-index:3}
/* 4-point star glint */
.st{position:absolute;z-index:4;width:26px;height:26px;transform:translate(-50%,-50%) scale(.25);opacity:0;animation:tw 2.4s ease-in-out infinite;pointer-events:none}
.st::before,.st::after{content:"";position:absolute;left:0;top:50%;width:100%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,#fff 50%,transparent);box-shadow:0 0 6px 1px #fff}
.st::after{transform:rotate(90deg)}
.st i{position:absolute;inset:9px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px #fff}
@keyframes tw{0%,55%,100%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}85%{opacity:.5;transform:translate(-50%,-50%) scale(.5) rotate(90deg)}}


.rimfx{background:linear-gradient(135deg,#fff,#8c97a3 40%,#fff 60%,#7f8993)}
.hexin{clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%)}
/* E2: 12 large facets fanning from the centre, clean polished centre behind the text */
.E2{background:linear-gradient(135deg,#fff,#8c97a3 40%,#fff 60%,#7f8993)}
.E2::before{content:"";position:absolute;inset:3px;z-index:-2;background:conic-gradient(from 15deg at 50% 50%,#fff 0 30deg,#9aa5b0 30deg 60deg,#f1f4f7 60deg 90deg,#5f6a76 90deg 120deg,#e2e7ec 120deg 150deg,#a4aeb9 150deg 180deg,#fff 180deg 210deg,#8893a0 210deg 240deg,#f1f4f7 240deg 270deg,#68737f 270deg 300deg,#e2e7ec 300deg 330deg,#aab4bf 330deg 360deg)}
.E2::after{content:"";position:absolute;inset:3px;z-index:-1;background:radial-gradient(ellipse 52% 75% at 50% 50%,#fff 0,rgba(255,255,255,.93) 62%,rgba(255,255,255,0) 100%)}
.E2.hex::before,.E2.hex::after{inset:3px 6px;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%)}
/* E3: angular gem shards, top half and bottom half mirrored — six wide facets, no fine lines */
.E3{background:linear-gradient(135deg,#fff,#8c97a3 40%,#fff 60%,#7f8993)}
.E3::before{content:"";position:absolute;inset:3px;z-index:-1;background:
 linear-gradient(100deg,#fff 0 20%,#aab4bf 20% 36%,#f6f8fa 36% 58%,#7b8693 58% 70%,#dfe4e9 70% 86%,#fff 86%) 0 0/100% 50% no-repeat,
 linear-gradient(80deg,#fff 0 14%,#cfd5dc 14% 30%,#6f7a87 30% 42%,#f6f8fa 42% 64%,#a3adb8 64% 80%,#fff 80%) 0 100%/100% 50% no-repeat}
.E3.hex::before{inset:3px 6px;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%)}
</style>
<h2>E2 — 12 LARGE FACETS from the centre, clean polished centre behind the lettering</h2>
<div class=row>
<button class="b E2 w hex"><span>Reveal Chart</span><b class=st style="left:14%;top:30%;animation-delay:.3s"><i></i></b><b class=st style="left:88%;top:70%;animation-delay:1.4s"><i></i></b></button>
<button class="b E2 s hex"><span>Pass</span><b class=st style="left:82%;top:28%;animation-delay:.9s"><i></i></b></button>
<button class="b E2 w"><span>Run / Save</span><b class=st style="left:10%;top:70%;animation-delay:.2s"><i></i></b></button></div>
<h2>E3 — SIX ANGULAR GEM SHARDS, top half mirrored against bottom half, no fine lines</h2>
<div class=row>
<button class="b E3 w hex"><span>Reveal Chart</span><b class=st style="left:14%;top:30%;animation-delay:.3s"><i></i></b><b class=st style="left:88%;top:70%;animation-delay:1.4s"><i></i></b></button>
<button class="b E3 s hex"><span>Pass</span><b class=st style="left:82%;top:28%;animation-delay:.9s"><i></i></b></button>
<button class="b E3 w"><span>Run / Save</span><b class=st style="left:10%;top:70%;animation-delay:.2s"><i></i></b></button></div>
