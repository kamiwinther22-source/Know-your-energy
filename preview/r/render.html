<!doctype html><meta charset=utf-8><body style="margin:0;background:#000">
<script type="module">
import * as THREE from '../../vendor/three.module.js';
const q=new URLSearchParams(location.search);const W=+q.get('w')||340,H=+q.get('h')||112,V0=q.get('v')||'mirror',V=V0=='dome'?'mirror':V0;
const S=2;const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(W*S,H*S);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.0;document.body.appendChild(r.domElement);
// studio environment: dark studio with softboxes
const env=new THREE.Scene();
const dome=new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.MeshBasicMaterial({side:THREE.BackSide,color:0x0b0d10}));env.add(dome);
function box(c,x,y,z,w,h,rx,ry,rz,i){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(i),side:THREE.DoubleSide,toneMapped:false}));m.position.set(x,y,z);m.rotation.set(rx,ry,rz);env.add(m)}
const E={
 mirror:()=>{box(0xffffff,0,30,18,60,14,Math.PI/2.4,0,0,10);box(0xffffff,-34,6,10,6,40,0,Math.PI/3,0,9);box(0xfff4e8,34,0,10,6,40,0,-Math.PI/3,0,9);box(0xffffff,0,-26,16,50,5,-Math.PI/2.5,0,0,3)},
 sparkle:()=>{for(let i=0;i<46;i++){const a=Math.random()*6.28,e=(Math.random()-.2)*1.6;const R=30;box(0xffffff,Math.cos(a)*R,Math.sin(e)*R*.8,Math.sin(a)*R*.8+8,1.2+Math.random()*2.5,1.2+Math.random()*2.5,Math.random()*3,Math.random()*3,Math.random()*3,14)}box(0xffffff,0,30,18,60,10,Math.PI/2.4,0,0,3)},
 softbox:()=>{box(0xffffff,0,28,16,70,30,Math.PI/2.6,0,0,6);box(0xffffff,0,-30,14,70,16,-Math.PI/2.6,0,0,2.5)}
};E[V]();
function wall(draw){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');draw(x,1024,512);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(150,75),new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide,toneMapped:false}));m.position.set(0,0,42);m.rotation.y=Math.PI;env.add(m)}
const WALL={
 mirror:(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#ffffff');g.addColorStop(.38,'#dfe5ea');g.addColorStop(.5,'#6b747d');g.addColorStop(.53,'#1a1e23');g.addColorStop(.6,'#8d97a2');g.addColorStop(1,'#f4f6f8');x.fillStyle=g;x.fillRect(0,0,w,h);
   const l=x.createLinearGradient(0,0,w,0);l.addColorStop(.18,'rgba(255,255,255,0)');l.addColorStop(.3,'rgba(255,255,255,.9)');l.addColorStop(.4,'rgba(255,255,255,0)');x.fillStyle=l;x.fillRect(0,0,w,h)},
 sparkle:(x,w,h)=>{x.fillStyle='#8a929b';x.fillRect(0,0,w,h);const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.5,'rgba(0,0,0,.25)');g.addColorStop(1,'rgba(255,255,255,.5)');x.fillStyle=g;x.fillRect(0,0,w,h);
   for(let i=0;i<260;i++){x.fillStyle=Math.random()<.5?'#ffffff':'#20252b';const r=3+Math.random()*16;x.fillRect(Math.random()*w,Math.random()*h,r,r*(.4+Math.random()))}},
 softbox:(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#c7ced6');g.addColorStop(.7,'#555d66');g.addColorStop(1,'#d9dee3');x.fillStyle=g;x.fillRect(0,0,w,h)}
};
wall(WALL[V]);

const pm=new THREE.PMREMGenerator(r);const envTex=pm.fromScene(env,0.01).texture;
const scene=new THREE.Scene();scene.environment=envTex;
const cam=new THREE.OrthographicCamera(-W/2,W/2,H/2,-H/2,1,500);cam.position.set(0,0,200);
// hex plate, bevelled
const s=new THREE.Shape(),w=W-(V0=='dome'?56:24),h=H-(V0=='dome'?56:24),c=h*.5;
s.moveTo(-w/2+c,-h/2);s.lineTo(w/2-c,-h/2);s.lineTo(w/2,0);s.lineTo(w/2-c,h/2);s.lineTo(-w/2+c,h/2);s.lineTo(-w/2,0);s.closePath();
const g=new THREE.ExtrudeGeometry(s,V0=='dome'?{depth:2,bevelEnabled:true,bevelThickness:26,bevelSize:24,bevelSegments:24,curveSegments:2}:{depth:6,bevelEnabled:true,bevelThickness:10,bevelSize:10,bevelSegments:V=='softbox'?8:3,curveSegments:2});
const mat=new THREE.MeshPhysicalMaterial({color:0xe6e9ed,metalness:1,roughness:V=='softbox'?0.28:V=='sparkle'?0.12:0.06,envMapIntensity:1.15,clearcoat:V=='softbox'?0.6:0,flatShading:V=='sparkle'});
if(V=='sparkle'){g.computeVertexNormals()}
const m=new THREE.Mesh(g,mat);scene.add(m);
r.render(scene,cam);window.__done=true;
</script>
