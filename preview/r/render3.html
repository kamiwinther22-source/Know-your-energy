<!doctype html><meta charset=utf-8><body style="margin:0;background:#000">
<script type="module">
import * as THREE from '../../vendor/three.module.js';
const q=new URLSearchParams(location.search);const W=+q.get('w')||340,H=+q.get('h')||112,V=q.get('v')||'t1';const S=2;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(W*S,H*S);r.toneMapping=THREE.NoToneMapping;document.body.appendChild(r.domElement);
const env=new THREE.Scene();
function wall(draw,z,w,h,ry){const c=document.createElement('canvas');c.width=2048;c.height=512;const x=c.getContext('2d');draw(x,2048,512);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide,toneMapped:false}));m.position.set(0,0,z);m.rotation.y=Math.PI;env.add(m)}
function ring(draw){/* surrounding cylinder so every reflection direction has something */const c=document.createElement('canvas');c.width=2048;c.height=512;const x=c.getContext('2d');draw(x,2048,512);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=THREE.RepeatWrapping;
 const m=new THREE.Mesh(new THREE.SphereGeometry(40,64,32),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,toneMapped:false}));m.rotation.y=Math.PI;env.add(m)}
const bands=(x,w,h,list,vert)=>{const g=x.createLinearGradient(0,0,w,0);for(const [o,c] of list)g.addColorStop(o,c);x.fillStyle=g;x.fillRect(0,0,w,h);
 const v=x.createLinearGradient(0,0,0,h);for(const [o,c] of vert)v.addColorStop(o,c);x.fillStyle=v;x.fillRect(0,0,w,h)};
const ENV={
 // T1: bright studio: white, cool-blue, black cards, warm white
 t1:(x,w,h)=>bands(x,w,h,[[0,'#ffffff'],[.12,'#cfe3ff'],[.2,'#0a0c10'],[.27,'#ffffff'],[.4,'#ffffff'],[.48,'#10131a'],[.55,'#fff1de'],[.7,'#ffffff'],[.8,'#0b0d12'],[.88,'#d9e8ff'],[1,'#ffffff']],[[0,'rgba(255,255,255,0)'],[.5,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.35)']]),
 // T2: dark jewellery-photo: near black with hot strip lights, warm and cool
 t2:(x,w,h)=>bands(x,w,h,[[0,'#04050a'],[.1,'#04050a'],[.16,'#ffffff'],[.2,'#ffe9cf'],[.25,'#04050a'],[.42,'#0a0d14'],[.5,'#bfd8ff'],[.54,'#ffffff'],[.58,'#0a0d14'],[.75,'#04050a'],[.8,'#ffffff'],[.84,'#ffd9b0'],[.9,'#04050a'],[1,'#04050a']],[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,0)']]),
 // T3: white light tent: mostly white, a few soft grey and black cards for definition
 t3:(x,w,h)=>bands(x,w,h,[[0,'#ffffff'],[.18,'#f4f8ff'],[.26,'#6d7684'],[.3,'#ffffff'],[.5,'#ffffff'],[.58,'#1a1d24'],[.62,'#ffffff'],[.78,'#fff6ea'],[.86,'#8a93a1'],[.9,'#ffffff'],[1,'#ffffff']],[[0,'rgba(255,255,255,0)'],[1,'rgba(0,0,0,.2)']])
};
ring(ENV[V]);
const pm=new THREE.PMREMGenerator(r);const envTex=pm.fromScene(env,0.0).texture;
const scene=new THREE.Scene();scene.environment=envTex;
const D=150;const cam=new THREE.PerspectiveCamera(2*Math.atan((H/2)/D)*180/Math.PI,W/H,1,600);cam.position.set(0,0,D);
const AH=+q.get('ah')||14;const w=W-26,h=H-26,c=h*.5;
const P=[[-w/2+c,-h/2],[w/2-c,-h/2],[w/2,0],[w/2-c,h/2],[-w/2+c,h/2],[-w/2,0]];
const pos=[];for(let i=0;i<6;i++){const a=P[i],b=P[(i+1)%6];pos.push(a[0],a[1],0,b[0],b[1],0,0,0,AH)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();
const mat=new THREE.MeshPhysicalMaterial({color:0xf2f4f7,metalness:1,roughness:.05,envMapIntensity:1,side:THREE.DoubleSide});
scene.add(new THREE.Mesh(g,mat));
r.render(scene,cam);window.__done=true;
</script>
