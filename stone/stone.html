<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#dedfe2}canvas{display:block;width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R;uniform vec2 L;
float hash(vec3 p){p=fract(p*0.3183099+vec3(.1,.2,.3));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*f*(f*(f*6.-15.)+10.);
 return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
const vec2 AB=vec2(.482,1.058);          // stone half-size (in screen widths)
const float NN=3.0;                   // superellipse exponent: soft rounded rectangle
float sdE(vec2 p){ // approximate signed distance to the stone outline
  vec2 q=abs(p)/AB; float d=pow(pow(q.x,NN)+pow(q.y,NN),1./NN); return (d-1.)*.33;}
float dd(vec2 p){vec2 q=abs(p)/AB;return pow(pow(q.x,NN)+pow(q.y,NN),1./NN);}
float Hh(vec2 p){float d=min(dd(p),1.);float u=1.-d*d;return .34*pow(max(u,0.),.62);}
float rbox(vec2 r,vec2 c,vec2 h,float rad,float soft){
  vec2 q=abs(r-c)-h+rad;float d=length(max(q,0.))+min(max(q.x,q.y),0.)-rad;return 1.-smoothstep(-soft,soft,d);}
vec3 env(vec3 r){
  float up=clamp(r.y*.5+.5,0.,1.);
  vec3 c=mix(vec3(.30,.33,.42),vec3(.86,.90,.98),smoothstep(.15,.85,up));
  c*=.85+.3*vn(vec3(r.xy*4.,1.));
  return c;}
float boxes(vec3 r){
  float b=rbox(r.xy,vec2(-.26,.30),vec2(.10,.075),.04,.008)*.85;
  b+=rbox(r.xy,vec2(.20,-.16),vec2(.05,.035),.02,.012)*.30;
  return b;}
void main(){
  vec2 p=(gl_FragCoord.xy-.5*R)/R.x;            // units of screen width, y up
  vec3 bgc=vec3(.905,.906,.915);
  bgc*=1.-.06*smoothstep(.3,1.3,length(p*vec2(1.,.6)));
  float sd=sdE(p);
  // shadow on the flat surface: tight contact + soft cast to lower right
  float sh=exp(-max(sd,0.)*120.)*.16+exp(-max(sdE(p-vec2(.012,-.016)),0.)*40.)*.12;
  vec3 col=bgc*(1.-sh);
  float a=1.-smoothstep(-.0012,.0012,sd);
  if(a>0.){
    vec2 e=vec2(.0016,0.);
    float dx=Hh(p+e.xy)-Hh(p-e.xy),dy=Hh(p+e.yx)-Hh(p-e.yx);
    vec3 N=normalize(vec3(-dx/(2.*e.x),-dy/(2.*e.x),1.));
    vec3 V=vec3(0.,0.,1.);
    float d=dd(p);
    vec3 Ld=normalize(vec3(L.x,L.y,.85));
    vec3 T=refract(-V,N,1./1.53);
    vec3 Hn=normalize(Ld-T);                         // half vector for light bouncing off internal layers
    // internal layers: normal drifts slowly with depth -> parallax, bounded sheen
    float blue=0.,silver=0.,cloud=0.,trans=1.;
    for(int i=0;i<8;i++){
      float t=(float(i)+.5)/8.;float depth=t*.30;
      vec3 pos=vec3(p,0.)+T*(depth/max(T.z,.25));pos.z=depth*3.;
      vec3 w=vec3(fbm(pos*vec3(2.2,2.2,3.)+3.),fbm(pos*vec3(2.2,2.2,3.)+9.),0.)-.5;
      vec3 pn=normalize(vec3(.34,.22,.91)+vec3(w.xy*.55,0.));
      float al=max(dot(pn,Hn),0.);
      vec2 ar=vec2(pos.x*.80+pos.y*.60,-pos.x*.60+pos.y*.80);float bound=smoothstep(.47,.60,fbm(vec3(ar*vec2(2.2,11.),pos.z*5.)+17.));       // sheet with a real edge
      float s=pow(al,150.)*bound;
      blue+=trans*s*.55;
      silver+=trans*pow(al,14.)*smoothstep(.5,.75,fbm(pos*vec3(5.,5.,6.)+31.))*.02;
      float c=smoothstep(.45,.80,fbm(vec3(ar*vec2(4.,12.),pos.z*4.)+5.));
      cloud+=trans*c*.12;trans*=exp(-c*.10);
    }
    // fine grain (irregular, low contrast) so the interior reads as crystal not haze
    float grain=vn(vec3(p*vec2(310.,70.),2.))*.5+vn(vec3(p*vec2(160.,38.),7.))*.5;
    vec3 body=vec3(.925,.905,.885)*(.985+.015*grain);
    body=mix(body,vec3(.80,.80,.82),clamp(cloud,0.,1.)*.38);
    float dif=clamp(dot(N,Ld)*.7+.45,0.,1.);body*=.61+.34*dif;
    body*=.88+.14*smoothstep(-.4,.5,(-p.x+p.y)*1.1);
    // thin edge: glassy, takes on the surface colour and a darker total-internal-reflection ring
    float rim=smoothstep(.72,1.,d);
    body=mix(body,bgc*.88,rim*rim*.38);
    body*=1.-.22*smoothstep(.88,.985,d)*(1.-smoothstep(.985,1.,d));
    float bl=min(1.-exp(-blue*2.4),.96);
    vec3 deep=vec3(.06,.22,.95),lite=vec3(.48,.68,1.);
    vec3 bc=mix(deep,lite,smoothstep(.15,.85,bl));
    vec3 c=mix(body,bc,bl*.90)+bc*bl*.08+vec3(.95,.97,1.)*silver;
    // polished surface
    vec3 r=reflect(-V,N);float F=.045+.955*pow(1.-max(dot(N,V),0.),5.);
    c+=env(r)*(F*1.0+.05)*vec3(.98,.99,1.);
    c+=vec3(1.,1.,1.02)*boxes(r)*(.55+.45*F*6.)*.95;
    float edgeLit=smoothstep(.965,.995,d)*smoothstep(-.1,.7,(-p.x+p.y)*1.4);c+=vec3(1.)*edgeLit*.30;
    col=mix(col,c,a);
  }
  col+=(hash(vec3(gl_FragCoord.xy,1.))-.5)/255.;
  gl_FragColor=vec4(clamp(col,0.,1.),1.);
}
</script>
<script>
const cv=document.getElementById('c');const gl=cv.getContext('webgl',{preserveDrawingBuffer:true});
const q=new URLSearchParams(location.search);
cv.width=innerWidth*2;cv.height=innerHeight*2;gl.viewport(0,0,cv.width,cv.height);
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(pr,'R'),cv.width,cv.height);
gl.uniform2f(gl.getUniformLocation(pr,'L'),+(q.get('lx')||.3),+(q.get('ly')||.25));
gl.drawArrays(gl.TRIANGLES,0,3);document.body.setAttribute('data-ready','1');
</script></body></html>
