  midheaven:{
    Aries:`With your Midheaven in Aries, the reputation you build in the world tends to center on initiative — you're the one people expect to start things, take the first swing, or lead when nobody else will. That association with boldness can fast-track you into leadership roles early, but it can also mean your public reputation reads as impatient or overly competitive if you don't pace your ambition to the institution you're operating in. The growth edge is building a track record that shows follow-through, not just first moves.`,
    Taurus:`With your Midheaven in Taurus, your public reputation tends to form around reliability and tangible results — people come to know you as someone who builds real, lasting value, whether that's financial, material, or simply dependable output over time. That association with steadiness can make you the person institutions trust with long-term responsibility, but it can also typecast you as resistant to change or slow to embrace anything that unsettles what's already working. The growth edge is letting your public direction evolve without it costing you your reputation for stability.`,
    Gemini:`With your Midheaven in Gemini, your public direction tends to run through communication — writing, teaching, media, or simply being the person who connects other people and ideas. That association with versatility can open a wide range of career paths and keep you from ever feeling boxed in, but it can also mean your public reputation reads as scattered if you're known for having your hand in everything and mastering none of it visibly. The growth edge is letting one area of your communication become the thing you're actually known for.`,
    Cancer:`With your Midheaven in Cancer, your public reputation tends to form around care — people, institutions, or causes that need protecting or nurturing often become the thing your career life is built around, sometimes literally through family business or home-related work. That association with warmth can make your public role feel personal and trusted rather than corporate, but it can also mean your professional reputation rises and falls with your emotional state more visibly than it would for other placements. The growth edge is separating your public standing from how vulnerable you feel on a given day.`,
    Leo:`With your Midheaven in Leo, your public direction tends to run toward visibility — leadership, performance, or simply being the recognizable face of whatever you're part of. That association with presence can put you in front of people faster than most placements, but it can also mean your public reputation gets read as ego-driven if the recognition isn't clearly earned by what you're actually contributing. The growth edge is building a reputation for what you make possible for others, not just for being seen.`,
    Virgo:`With your Midheaven in Virgo, your public reputation tends to form around competence — being the person whose work is genuinely correct, reliable, and useful, often in fields built on precision, health, or service. That association with skill can make you the person institutions quietly depend on to catch what others miss, but it can also mean your public direction reads as overly critical or perfectionistic if your standards for others' work show more than your standards for your own. The growth edge is letting your public reputation include what you've already gotten right, not just what still needs fixing.`,
    Libra:`With your Midheaven in Libra, your public direction tends to run through partnership and fairness — law, mediation, design, or any field where balancing competing interests is the actual job. That association with diplomacy can make you the person people trust to broker a deal or settle a dispute, but it can also mean your public reputation reads as indecisive or overly accommodating if you're known for weighing every side rather than landing on one. The growth edge is letting your public stance include an actual opinion.`,
    Scorpio:`With your Midheaven in Scorpio, your public reputation tends to form around depth and transformation — research, psychology, finance, or any field where what's hidden actually matters more than what's on the surface. That association with intensity can make you the person people trust with what they wouldn't tell just anyone — a real asset in work built on discretion, even where it reads as secretive or intimidating to people who haven't earned a closer view.`,
    Sagittarius:`With your Midheaven in Sagittarius, your public direction tends to run toward the big picture — teaching, publishing, travel, or any field built on expanding what people believe is possible. That association with vision can make you the person institutions look to for direction and morale, but it can also mean your public reputation reads as overpromising if your enthusiasm outruns your actual follow-through on the specifics. The growth edge is letting your public reputation be built on delivered specifics, not just inspired direction.`,
    Capricorn:`With your Midheaven in Capricorn, this placement is fully at home — your public direction is built for structured achievement, and the traditional markers of career success (title, authority, long-term status) tend to matter to your sense of purpose more than they would for other placements. That alignment can make you exceptionally effective at climbing a real institutional ladder, but it can also mean your entire sense of self rides on your public position more than is actually healthy. The growth edge is building an identity that would survive losing the title.`,
    Aquarius:`With your Midheaven in Aquarius, your public direction tends to run toward innovation — unconventional fields, causes bigger than any one person, or work that doesn't fit neatly inside an existing hierarchy. That association with independence can make you a genuine originator in whatever you do publicly, but it can also mean your public reputation reads as detached or hard to place within a traditional career ladder. The growth edge is letting your public direction include enough structure that people can actually find you in it.`,
    Pisces:`With your Midheaven in Pisces, your public direction tends to run through compassion and imagination — art, healing, spirituality, or any field where sensing what isn't said out loud is the actual skill. That association with intuition can make your public work feel genuinely meaningful rather than merely transactional, but it can also mean your public reputation reads as unclear or ungrounded if your direction doesn't translate into something concrete other people can point to. The growth edge is giving your public direction a shape solid enough for other people to actually follow.`
  },
  house:{
    1:`The 1st House governs the self as it first meets the world — your body, your instinctive approach to new situations, and the identity you lead with before anyone gets to know the rest of you. A planet here puts real, visible weight on that planet's themes; whatever's placed in your 1st House tends to color your presence in a way people notice immediately, whether or not you're doing it on purpose.`,
    2:`The 2nd House governs resources — money, possessions, and the values that decide what you consider worth having in the first place, including your own sense of self-worth. A planet here ties that planet's themes to security and what you build your stability on, for better or worse depending on how that planet tends to handle things.`,
    3:`The 3rd House governs everyday communication — how you think out loud, talk to the people immediately around you (siblings, neighbors, casual connections), and take in new information. A planet here shapes how that planet's energy shows up in ordinary conversation and learning, more than in any grand life direction.`,
    4:`The 4th House governs home and roots — family, your sense of where you come from, and the private emotional foundation you operate from underneath the public version of yourself. A planet here ties that planet's themes to your literal home and the family patterns you were raised inside of.`,
    5:`The 5th House governs self-expression taken out into the open — creativity, romance, play, and (traditionally) children, anything you do for its own sake rather than because it's required. A planet here tends to show up in how you create, flirt, perform, or simply enjoy yourself.`,
    6:`The 6th House governs daily upkeep — work, routine, health, and the unglamorous maintenance that keeps the rest of life functioning. A planet here shapes how that planet's themes play out in the ordinary grind: the job itself, not the career title; the habit, not the headline.`,
    7:`The 7th House governs one-on-one partnership — marriage, close business partners, and committed relationships generally, along with what you tend to project onto (or seek out in) whoever you're closely paired with. A planet here colors how that planet's themes show up specifically through your closest partnerships.`,
    8:`The 8th House governs what's shared and what's transformed — joint finances, deep intimacy, and the kind of change that comes from crisis or loss rather than gradual growth. A planet here ties that planet's themes to intensity: what you're forced to confront rather than what you chose.`,
    9:`The 9th House governs the search for meaning beyond your immediate world — higher education, travel, philosophy, and belief systems bigger than your day-to-day routine. A planet here shapes how that planet's themes show up in your worldview and your appetite for expanding past what you already know.`,
    10:`The 10th House governs public direction — career, reputation, and the role you're recognized for in the wider world (the same domain the Midheaven anchors). A planet here ties that planet's themes directly to your visible achievements and how authority figures tend to perceive you.`,
    11:`The 11th House governs community — friendships, groups, and the hopes you hold for the future that go beyond your individual life. A planet here shapes how that planet's themes show up in your friend circles and the causes or communities you attach yourself to.`,
    12:`The 12th House governs what's hidden — the subconscious, solitude, and things not fully visible even to you, traditionally linked to endings, rest, and spiritual or reflective withdrawal. A planet here tends to work quietly, showing up as an undercurrent you sense more than something you can point to directly.`
  },
  // Which specific life arena each planet's energy actually plays out in --
  // not a restatement of the sign entry (that's the planet's core theme
  // regardless of house) and not the generic house blurb above (that's
  // the same for anyone with any planet there). Every entry below has to
  // name the actual combination, not just reshuffle either half alone.
  housecombo:{
    sun_1:`With your Sun in the 1st House, your core identity is worn on the outside — who you are isn't something people have to get to know over time, it shows up immediately in your presence, manner, and the way you enter a room. That directness makes you memorable fast, but it also means you have less private distance between "who I am" and "what people see" than most placements do.`,
    sun_2:`With your Sun in the 2nd House, your sense of self is built through what you accumulate and can rely on — money, possessions, skills you can count on. Your self-worth tracks your material stability more than it does for most people, which can be a genuine motivator to build real security, or a trap if your worth starts rising and falling with your bank balance.`,
    sun_3:`With your Sun in the 3rd House, your identity is expressed through everyday communication — talking, writing, learning, connecting with the people immediately around you. You know yourself by how well you can explain a thought or pick up a new one, more than through some grander life mission.`,
    sun_4:`With your Sun in the 4th House, your core identity is rooted in home and family — where you come from, and the private world underneath your public self, matter more to your basic sense of who you are than your career or reputation do. Your foundation isn't a backdrop to your identity here; it largely is your identity.`,
    sun_5:`With your Sun in the 5th House, your identity is built through creative self-expression — making something, performing, romancing, playing, in a way that's genuinely yours and genuinely visible. You know who you are by what you make and how proudly you can put your name on it.`,
    sun_6:`With your Sun in the 6th House, your sense of self is tied to being useful — competent, reliable work and daily upkeep matter to your identity more than status does. You feel most like yourself when you're actually doing something productive, not simply being admired for it.`,
    sun_7:`With your Sun in the 7th House, you come to know yourself largely through your closest partnerships — who you are becomes clearest in relation to someone else, reflected back at you rather than worked out alone in a room. That makes partnership genuinely central to your identity, not an accessory to it, for better and worse.`,
    sun_8:`With your Sun in the 8th House, your identity is forged through intensity — crisis, transformation, and what's shared rather than what's simply yours alone shape who you understand yourself to be. You tend to know yourself best after you've been through something, not before.`,
    sun_9:`With your Sun in the 9th House, your core identity is built on belief and exploration — what you think is true, where you've traveled, and how far your worldview reaches matter more to your sense of self than your immediate surroundings do. You know who you are by what you're still trying to figure out about the bigger picture.`,
    sun_10:`With your Sun in the 10th House, your identity is deeply tied to your public role — career, reputation, and how the wider world recognizes your work aren't separate from who you are, they're close to the center of it. That makes real achievement feel personally necessary, not just externally rewarding.`,
    sun_11:`With your Sun in the 11th House, you know yourself largely through the groups and causes you belong to — your identity is built more around shared vision and community than around individual, solo accomplishment. Belonging to something bigger than yourself isn't optional here; it's part of how you actually recognize yourself.`,
    sun_12:`With your Sun in the 12th House, your core identity stays mostly private — worked out in reflection, solitude, or even confusion about yourself, rather than displayed for others to react to. You may take longer than most to feel like you know who you are, since the process happens largely out of view, including your own.`,
    moon_1:`With your Moon in the 1st House, your emotional state is visible the moment someone meets you — you don't have much of a poker face, and people read your mood before you've said a word. That makes you easy to read and genuinely hard to fake around, for better and worse.`,
    moon_2:`With your Moon in the 2nd House, you feel emotionally secure through tangible resources — money, possessions, and physical comfort aren't just practical to you, they're part of what makes you feel safe. Instability in what you own or earn tends to rattle you emotionally more than it would most people.`,
    moon_3:`With your Moon in the 3rd House, your emotional world is processed out loud — through talking, texting, writing something down. You don't fully know what you feel until you've said it to someone, which makes you an instinctive over-communicator when something's actually bothering you.`,
    moon_4:`With your Moon in the 4th House, this placement is fully at home — your emotional security is directly tied to home and family, and you likely need a physical place that feels like yours to actually recharge. Instability at home affects your mood more directly than almost anything else in your life.`,
    moon_5:`With your Moon in the 5th House, you feel emotionally alive through creativity, romance, and being genuinely seen doing something you love. Your mood visibly brightens when you're making something or being appreciated for it, and just as visibly dims when there's no outlet for that expression.`,
    moon_6:`With your Moon in the 6th House, your emotional stability is tied to routine and useful daily work — a disrupted schedule or feeling unproductive unsettles you more than it would most people, while a solid routine genuinely calms you down.`,
    moon_7:`With your Moon in the 7th House, your emotional security depends heavily on close partnership — you feel safest, and most yourself, when you're paired with someone you trust. Being between real relationships tends to leave you more emotionally unsettled than it would for other placements.`,
    moon_8:`With your Moon in the 8th House, your emotional life is intense and mostly private, drawn toward depth rather than surface calm. You process feelings most honestly during crisis or real vulnerability, and can find ordinary, uneventful emotional stability oddly hard to access or trust.`,
    moon_9:`With your Moon in the 9th House, you feel emotionally secure through meaning and exploration — travel, belief, and a sense that life is actually going somewhere matter to your mood more than material comfort does. Feeling stuck or boxed in unsettles you emotionally, not just practically.`,
    moon_10:`With your Moon in the 10th House, your emotional state is unusually tied to your public standing — being recognized or accomplishing something visible genuinely lifts your mood, and professional setbacks land emotionally, not just practically. Your private feelings and public reputation are less separate here than for most people.`,
    moon_11:`With your Moon in the 11th House, you feel emotionally secure through community and belonging to a group with shared hopes — friendships and causes function almost like an extended family for your sense of safety. Feeling excluded from a group affects you more deeply than most people would expect.`,
    moon_12:`With your Moon in the 12th House, your emotional life runs largely beneath the surface, processed in solitude, dreams, or reflection rather than shared openly in the moment. You may feel things fully only in hindsight, once you've had real time alone with them.`,
    mercury_1:`With your Mercury in the 1st House, your mind is on display immediately — how you think and talk is a core part of the first impression you give, often before your personality has a chance to show up any other way. People form an opinion of your intelligence within the first few sentences.`,
    mercury_2:`With your Mercury in the 2nd House, your thinking is practical and resource-focused — you're naturally good at reasoning through money, value, and what something is actually worth, and you tend to talk about tangible things more readily than abstract ones.`,
    mercury_3:`With your Mercury in the 3rd House, this placement is fully at home — communication, learning, and everyday information-gathering come naturally and constantly, and you're likely someone who's always mid-conversation, mid-text, or mid-thought about something new you just picked up.`,
    mercury_4:`With your Mercury in the 4th House, your thinking is shaped by home and family — you process ideas most naturally in a private, familiar setting, and conversations about your roots or upbringing tend to occupy real mental real estate, more than they would for most placements.`,
    mercury_5:`With your Mercury in the 5th House, your mind is playful and expressive — you think in terms of stories, wit, and creative angles, and you're likely a naturally entertaining communicator who enjoys the performance of a good idea as much as the idea itself.`,
    mercury_6:`With your Mercury in the 6th House, your thinking is detail-oriented and practical, well-suited to solving the actual problems in front of you at work or in daily routine. You're likely the person who catches the error everyone else's big-picture thinking missed.`,
    mercury_7:`With your Mercury in the 7th House, your best thinking happens in dialogue with someone else — you process ideas by talking them through with a partner or close collaborator, and you're naturally good at seeing an issue from both sides of a negotiation.`,
    mercury_8:`With your Mercury in the 8th House, your mind is drawn to what's hidden — research, psychology, and uncovering what other people aren't saying out loud come naturally to you. Surface-level conversation tends to bore you faster than it would most people.`,
    mercury_9:`With your Mercury in the 9th House, your thinking runs toward the big picture — philosophy, belief systems, and ideas from far outside your own background genuinely interest you, sometimes more than the small, immediate details in front of you.`,
    mercury_10:`With your Mercury in the 10th House, your communication skill is directly tied to your public reputation — how well you speak, write, or present is part of what you're professionally known for, not just a private skill you happen to have.`,
    mercury_11:`With your Mercury in the 11th House, your thinking is oriented toward groups and the future — you're naturally drawn into conversations about shared causes, group plans, and where things are collectively headed, more than one-on-one small talk.`,
    mercury_12:`With your Mercury in the 12th House, a lot of your real thinking happens privately, almost below your own awareness — you may solve a problem in your sleep or during quiet reflection more reliably than by actively talking it through with someone else.`,
    venus_1:`With your Venus in the 1st House, warmth and likability are part of your first impression itself — people tend to find you charming or attractive almost immediately, since your sense of beauty and ease with people shows up in your actual presence, not just your relationships.`,
    venus_2:`With your Venus in the 2nd House, this placement is fully at home — love and money follow similar instincts for you, and you likely have a genuine, well-developed appreciation for quality, comfort, and the pleasures that come from having built real material stability.`,
    venus_3:`With your Venus in the 3rd House, you express affection through communication — a well-chosen word, a thoughtful message, a genuinely good conversation is one of your real love languages, and you likely charm people in casual, everyday interactions more than through grand gestures.`,
    venus_4:`With your Venus in the 4th House, love and beauty are centered on home and family — you likely put real care into making your home feel warm and beautiful, and your closest, most affectionate relationships tend to be with family or people who feel like family.`,
    venus_5:`With your Venus in the 5th House, this placement is fully at home — romance, creativity, and pleasure come naturally and abundantly, and you're likely a genuinely delightful, playful presence in love and in whatever you make.`,
    venus_6:`With your Venus in the 6th House, you show affection through practical, daily acts of care — helping with something, showing up reliably, tending to the details of someone's life — more than through romantic display. Love, for you, often looks like usefulness.`,
    venus_7:`With your Venus in the 7th House, this placement is fully at home — partnership itself is where your gift for love and diplomacy shows up most clearly, and you likely have real, natural skill at making a close relationship feel balanced and fair.`,
    venus_8:`With your Venus in the 8th House, your capacity for love is intense and consuming rather than light — you're drawn to real intimacy and transformation in relationships more than casual romance, and shared resources (financial or emotional) tend to matter a great deal in how you bond.`,
    venus_9:`With your Venus in the 9th House, you're drawn to love and beauty from beyond your own background — different cultures, philosophies, or simply someone who expands your world tend to attract you more than someone who's simply familiar.`,
    venus_10:`With your Venus in the 10th House, your charm and sense of style are part of your public reputation — you're likely well-liked professionally, and your public image tends to carry real grace or aesthetic sensibility that others notice.`,
    venus_11:`With your Venus in the 11th House, you experience love most naturally through friendship first — your closest romantic relationships often grow out of a shared community or group of friends, rather than starting as romance from a standing start.`,
    venus_12:`With your Venus in the 12th House, your deepest capacity for love is often private or even secret — you may be genuinely devoted in ways you don't advertise, and you're capable of a quiet, selfless kind of affection that doesn't require being seen to be real.`,
    mars_1:`With your Mars in the 1st House, your drive to act is part of your visible identity — you come across as assertive and quick to move before you've had to work at it. People read you as someone who initiates, for better or worse, the moment they meet you.`,
    mars_2:`With your Mars in the 2nd House, your drive is directed at building and defending your own resources — you assert yourself most clearly around money and possessions, and you're willing to fight to protect what you've earned.`,
    mars_3:`With your Mars in the 3rd House, your drive comes out verbally — you argue quickly, think fast, and assert yourself in everyday conversation more readily than through physical action. Restlessness shows up as mental energy that needs somewhere to go.`,
    mars_4:`With your Mars in the 4th House, your drive centers on home and family — you're the one who defends the household, sometimes bringing real friction into it, since this is also where your temper is most likely to show up unfiltered.`,
    mars_5:`With your Mars in the 5th House, your drive shows up through creativity and romance — you pursue what and who you want boldly, and you're genuinely competitive in anything you consider play.`,
    mars_6:`With your Mars in the 6th House, your drive channels into work and daily routine — you're capable of real, sustained effort on the job, though the same intensity can push your body harder than it can actually sustain.`,
    mars_7:`With your Mars in the 7th House, your drive shows up through partnership — you assert yourself most clearly in close one-on-one relationships, which can mean real passion or real conflict, often both at different times with the same person.`,
    mars_8:`With your Mars in the 8th House, your drive is directed at intensity and control — you assert yourself most in matters of shared resources or deep intimacy, uncomfortable with anything that feels like it's controlling you instead.`,
    mars_9:`With your Mars in the 9th House, your drive shows up through belief and exploration — you pursue your convictions boldly and act fast on the chance to travel, learn, or expand your world.`,
    mars_10:`With your Mars in the 10th House, your drive is visible in your career — you're competitive about public achievement and willing to assert yourself to get the recognition you're after.`,
    mars_11:`With your Mars in the 11th House, your drive shows up within groups — you're often the one who actually gets a shared cause or community project moving, sometimes pushing harder than the group is ready for.`,
    mars_12:`With your Mars in the 12th House, your drive works mostly behind the scenes — assertiveness that doesn't display outwardly can turn into private frustration if it never finds a direct outlet, so it's worth finding one on purpose.`,
    jupiter_1:`With your Jupiter in the 1st House, growth and opportunity follow your own confidence and visible presence — you tend to catch good luck simply by putting yourself forward rather than waiting to be noticed.`,
    jupiter_2:`With your Jupiter in the 2nd House, your resources tend to expand naturally — a generally optimistic relationship to money, generous with what you have, with a real risk of overspending on that same optimism.`,
    jupiter_3:`With your Jupiter in the 3rd House, growth comes through communication and learning — an optimistic, expansive mind that grows through everyday conversation and local connections more than formal study.`,
    jupiter_4:`With your Jupiter in the 4th House, growth is tied to home and family — a generous, expansive household, and often real luck or support that traces back to family.`,
    jupiter_5:`With your Jupiter in the 5th House, growth shows up through creativity and romance — generous, expansive, genuinely lucky in matters of love and creative risk-taking.`,
    jupiter_6:`With your Jupiter in the 6th House, growth comes through daily work and service — real meaning and even opportunity found in competent, everyday effort rather than any single big break.`,
    jupiter_7:`With your Jupiter in the 7th House, growth shows up through partnership — expansive, generous in close relationships, though it's worth watching for idealizing a partner past who they actually are.`,
    jupiter_8:`With your Jupiter in the 8th House, growth comes through shared resources and real transformation — expansion that often arrives through someone else's resources, or through facing something intense and coming out ahead of it.`,
    jupiter_9:`With your Jupiter in the 9th House, this placement is fully at home — genuine growth through belief, higher learning, and travel, with a real, natural talent for teaching or exploring far outside your own background.`,
    jupiter_10:`With your Jupiter in the 10th House, growth shows up in career and public reputation — expansive professional success and a natural authority that tends to be recognized without excessive struggle.`,
    jupiter_11:`With your Jupiter in the 11th House, growth comes through community — an expansive social network and real opportunity that tends to arrive through groups and shared causes rather than solo effort.`,
    jupiter_12:`With your Jupiter in the 12th House, growth happens privately — an expansive inner or spiritual life, and generosity that often shows up anonymously or behind the scenes rather than where it will be noticed.`,
    saturn_1:`With your Saturn in the 1st House, responsibility and restriction shape your visible identity early — you may have felt burdened or older than your years from a young age, and real self-assurance here is earned slowly, not given.`,
    saturn_2:`With your Saturn in the 2nd House, your relationship to resources is cautious and hard-working — real financial security tends to arrive late and only through genuine, sustained effort, not luck.`,
    saturn_3:`With your Saturn in the 3rd House, communication carries real weight and restraint — you may have felt held back in speaking up early on, and the discipline you build there turns into real, considered thinking later.`,
    saturn_4:`With your Saturn in the 4th House, home and family carried real responsibility early, possibly more than felt fair — the structure you build later in life is often a direct response to what your foundation didn't give you.`,
    saturn_5:`With your Saturn in the 5th House, creative and romantic self-expression may have felt inhibited early — real mastery in either arena comes only through sustained, unglamorous practice, not natural ease.`,
    saturn_6:`With your Saturn in the 6th House, work here often feels thankless in the early years — recognition tends to arrive late, but it holds once it does. Health is where unprocessed stress actually surfaces: skipped attention here tends to show up as chronic tension or digestive trouble, while real, consistent routines around the body handle it well over the long run.`,
    saturn_7:`With your Saturn in the 7th House, partnership is approached seriously and carries real weight — commitment may come later or for practical reasons, but what's built tends to be genuinely durable once it's there.`,
    saturn_8:`With your Saturn in the 8th House, intensity and shared resources are approached cautiously — real transformation here comes slowly, through sustained effort, not sudden crisis.`,
    saturn_9:`With your Saturn in the 9th House, belief and worldview are built through disciplined, structured study — a hard-won philosophy that holds up because it was actually tested, not adopted on faith.`,
    saturn_10:`With your Saturn in the 10th House, this placement is fully at home — genuine, earned authority built the hard way, with career success that tends to arrive through real, sustained accomplishment rather than any shortcut.`,
    saturn_11:`With your Saturn in the 11th House, responsibility shows up through community — fewer friendships than some placements, but the ones you keep tend to be genuinely deep and long-lasting.`,
    saturn_12:`With your Saturn in the 12th House, restriction operates privately — an internal discipline and solitary work ethic that isn't visible to others, and rest here has to be earned on purpose rather than taken freely.`,
    uranus_1:`With your Uranus in the 1st House, disruption and individuality shape your visible identity — an unpredictable, unconventional presence that people notice as different right away.`,
    uranus_2:`With your Uranus in the 2nd House, your relationship to resources is erratic — income and possessions may fluctuate more than most people's, alongside a genuinely unconventional attitude toward what's actually worth having.`,
    uranus_3:`With your Uranus in the 3rd House, your thinking is original, sometimes erratic — sudden ideas and unconventional local connections, with a mind that jumps rather than proceeds in a straight line.`,
    uranus_4:`With your Uranus in the 4th House, home and family life may be unstable or simply unconventional — sudden moves or changes at home aren't the disruption to you that they'd be to someone else; a degree of instability at the root is closer to normal.`,
    uranus_5:`With your Uranus in the 5th House, creativity and romance run unconventional — experimental self-expression, and relationships that don't follow a standard script.`,
    uranus_6:`With your Uranus in the 6th House, work and routine resist convention — a job path that doesn't look like a straight line, and health that seems to need real variety rather than a fixed regimen.`,
    uranus_7:`With your Uranus in the 7th House, partnership is unpredictable — relationships that need real independence built in, or that arrive and change course suddenly rather than settling into a fixed pattern.`,
    uranus_8:`With your Uranus in the 8th House, transformation arrives suddenly — an unconventional relationship to intimacy and joint resources, with real change more likely to come as a jolt than a gradual shift.`,
    uranus_9:`With your Uranus in the 9th House, belief and worldview shift suddenly and often — an unconventional philosophy, and a pull toward travel or exploration that doesn't follow the usual route.`,
    uranus_10:`With your Uranus in the 10th House, your career path runs unconventional — public recognition that can arrive or change suddenly, in a field or role that doesn't fit a standard trajectory.`,
    uranus_11:`With your Uranus in the 11th House, this placement is fully at home — a genuine innovator within groups and causes, with real, natural investment in humanitarian or collective change.`,
    uranus_12:`With your Uranus in the 12th House, disruption operates privately — an internal restlessness that may never show outwardly, working itself out in solitude rather than in view of other people.`,
    neptune_1:`With your Neptune in the 1st House, your visible identity is dreamy and hard to pin down — a charismatic, somewhat elusive presence that other people find difficult to fully define, sometimes even to yourself.`,
    neptune_2:`With your Neptune in the 2nd House, your relationship to resources is unclear — money and possessions may be romanticized, idealized, or simply hard to keep track of in practical terms.`,
    neptune_3:`With your Neptune in the 3rd House, your thinking runs imaginative — genuine creative insight that can blur the line between what actually happened and the more compelling story about it.`,
    neptune_4:`With your Neptune in the 4th House, home and family may carry an idealized or confusing quality — a picture of your roots that doesn't quite match the practical reality, sometimes alongside real instability there.`,
    neptune_5:`With your Neptune in the 5th House, your creative and romantic instincts are deeply imaginative — real artistic sensitivity, paired with a real risk of idealizing a partner past who they actually are.`,
    neptune_6:`With your Neptune in the 6th House, daily structure and routine can feel genuinely hard to hold onto — a pull toward service or healing work, more comfortable with compassion than with rigid schedules.`,
    neptune_7:`With your Neptune in the 7th House, partnership is easily idealized — real risk of seeing a partner as who you wish they were rather than who they actually are, worth checking against plain reality.`,
    neptune_8:`With your Neptune in the 8th House, intimacy and shared resources carry a spiritual, boundary-blurred quality — transformation here is felt more than planned, and financial boundaries with others may stay genuinely unclear.`,
    neptune_9:`With your Neptune in the 9th House, belief runs toward the mystical — a real pull toward spiritual or idealistic philosophy, and travel that's sought more for the feeling of it than the destination.`,
    neptune_10:`With your Neptune in the 10th House, your public reputation carries an idealized or image-conscious quality — a career pull toward art, healing, or spiritual work, where the public image may not always match the practical reality underneath it.`,
    neptune_11:`With your Neptune in the 11th House, your hopes for groups and community run utopian — a genuinely dreamy vision for what a community or cause could become, worth pairing with practical follow-through.`,
    neptune_12:`With your Neptune in the 12th House, this placement is fully at home — a genuinely deep spiritual or intuitive inner life, comfortable with solitude and reflection in a way that feels natural rather than isolating.`,
    pluto_1:`With your Pluto in the 1st House, your visible identity carries real intensity — a magnetic presence, and you may go through more than one dramatic personal reinvention over your life.`,
    pluto_2:`With your Pluto in the 2nd House, your relationship to resources runs intense — real power struggles are possible around money or possessions, along with a deep, sometimes obsessive need for material security.`,
    pluto_3:`With your Pluto in the 3rd House, your thinking is probing and intense — conversations with you tend to go beneath the surface, and your words are genuinely capable of reshaping how someone else sees things.`,
    pluto_4:`With your Pluto in the 4th House, your home and family history holds real, sometimes difficult transformation — deep change at the root of your foundation, not always comfortable, but genuinely formative.`,
    pluto_5:`With your Pluto in the 5th House, creativity and romance run all-or-nothing — intense, transformative relationships and a real, deep creative power when you actually commit to expressing it.`,

    pluto_7:`With your Pluto in the 7th House, partnership is intense and transformative — real power dynamics with the people you're closest to, for better or worse, rarely anything casual.`,

const HOUSE_THEME={1:'Self & Identity',2:'Resources & Values',3:'Communication',4:'Home & Roots',5:'Creativity & Romance',6:'Work & Health',7:'Partnership',8:'Shared Resources',9:'Philosophy & Travel',10:'Career & Reputation',11:'Community & Hopes',12:'Subconscious & Rest'};

// Real Human Design structural data (center/gate membership, the 36
// channels, and the 64-gate zodiac wheel order), cross-checked against an
// independent real source: github.com/dturkuler/humandesign_api
// (src/humandesign/hd_constants.py) -- the wheel order there matched this
// app's own independently-known sequence exactly (same 64-item cycle, just
// rotated to a different starting point), and every center's gate count
// summed to the correct total of 64 with no gaps or duplicates.
const CENTER_GATES={
  Head:[64,61,63],
  Ajna:[47,24,4,11,43,17],
  Throat:[62,23,56,16,20,31,8,33,35,12,45],

  Heart:[21,40,26,51],

  Spleen:[48,57,44,50,32,28,18],
  SolarPlexus:[37,6,49,22,55,36,30],

Object.entries(CENTER_GATES).forEach(([c,gates])=>gates.forEach(g=>GATE_CENTER[g]=c));
const CHANNELS=[
  [64,47],[61,24],[63,4],[17,62],[43,23],[11,56],[16,48],[20,57],[20,34],[32,54],
  [28,38],[18,58],[20,10],[31,7],[8,1],[33,13],[10,34],[15,5],[2,14],[46,29],
  [10,57],[57,34],[50,27],[45,21],[59,6],[42,53],[3,60],[9,52],[26,44],[25,51],
  [40,37],[35,36],[12,22],[49,19],[55,39],[30,41]
];

const GATES={
  1:`Self-Expression. In the G Center, the identity/direction hub of the chart. This is the pressure to create something that is recognizably yours — not copied, not made to please someone else. It works best when you make from genuine impulse rather than from an audience's expectations; forcing your creative output into a template you think will be liked tends to produce work that feels hollow even when it's technically good.`,
  2:`The Driver. In the G Center. This gate holds a felt sense of the right direction to move in — for yourself, and it can be strong enough that others start asking you for direction too. It isn't calculated; it's closer to a compass that only works once you're actually moving. Sitting still trying to reason your way to the "right" direction tends to work worse than picking a direction and letting the sense correct you mid-motion.`,
  3:`Ordering. In the Sacral Center. This is the gate of a genuinely new beginning, and new beginnings are messy before they're workable — this gate's job is finding real, usable order inside that mess, not skipping past it. A period of confusion after starting something isn't a sign you did it wrong; it's the raw material this gate is built to sort through. Rushing to appear organized before the order actually exists tends to just paper over confusion instead of resolving it.`,
  4:`Answers. In the Ajna Center. This gate produces logical answers and formulas fast, often before all the facts are confirmed — it's built for hypothesizing, not for guaranteed correctness. The strength is offering a workable explanation quickly; the risk is presenting a guess with the same confidence as a verified fact. Naming an answer as provisional ("here's my best read, not yet confirmed") gets the benefit without the credibility cost of being wrong out loud.`,
  5:`Fixed Rhythms. In the Sacral Center. This gate needs a consistent, personal rhythm — sleep, work, routine — and genuinely destabilizes when that rhythm gets interrupted by someone else's schedule or demands. That's not rigidity for its own sake; disrupted rhythm here measurably costs you energy and follow-through. Protecting your own pace, even when it looks inflexible to other people, is what keeps this gate's stamina intact.`,
  6:`Friction. In the Solar Plexus Center. This gate governs emotional intimacy, and real intimacy here runs through friction first — tension, disagreement, or conflict that has to clear before closeness is actually possible, not instead of it. Avoiding all friction to keep the peace tends to keep people at a surface level; working through the friction (with the emotional wave given time, not forced in the moment) is what actually opens the door to closeness.`,
  7:`The Role. In the G Center. This is quiet, style-based leadership — leading by how you carry a role, not by giving orders. People often follow your lead because of the way you occupy a position, not because you asked them to. The risk is stepping into direction-setting before anyone's actually looking to you for it; this gate leads best in a role people already recognize, not one you assign yourself.`,
  8:`Contribution. In the Throat Center. This gate expresses individuality out loud — a personal example or a distinct way of doing things that ends up giving a group real direction, without a title attached to it. It works when the contribution comes from genuinely being yourself in front of others, not from performing individuality for effect. Contribution offered honestly draws people in; contribution staged for attention usually reads as exactly that.`,
  9:`Focus. In the Sacral Center. This gate has real staying power for small, precise details other people skip past — the follow-through that turns a plan into something that actually works. Its risk is getting so focused on the detail in front of you that the larger point of the work gets lost. Checking back against the bigger goal periodically keeps this gate's focus useful instead of just narrow.`,
  10:`Behavior of the Self. In the G Center. This gate is about behaving as yourself, in your own way, regardless of who's watching — genuine self-love expressed as conduct, not as a claim. It runs into trouble when it starts adapting itself to be loved by whoever's in the room, since that's the opposite of what the gate actually offers. The clearest version of this gate is consistent behavior whether or not anyone's approving of it.`,
  11:`Ideas. In the Ajna Center. This gate generates concepts, one after another, and finds real peace in sharing them — teaching, discussing, putting an idea into circulation rather than acting on it directly. Not every idea here is meant to be built; some exist to be talked through and let go of. The mistake is treating every generated idea as something that must be executed, which leads to scattering energy across too many half-started things.`,
  12:`Caution. In the Throat Center. This gate can articulate something genuinely moving, but it's mood-dependent — it needs the right social moment to land, and the same words said at the wrong moment can fall flat or get misread. The instinct to stay quiet until the moment feels right isn't shyness, it's accurate timing sense. Speaking on a whim here, ignoring that timing sense, is what actually produces the awkward result people worry about.`,
  13:`The Listener. In the G Center. This gate draws people in to tell their real stories and secrets — you end up as the person others confide in, sometimes without meaning to invite it. Held well, that's real fellowship: a genuine record of what people have actually lived through. Held poorly, it turns into gossip or grievance-holding. The difference is whether what's heard gets released or gets carried as resentment.`,
  14:`Power Skills. In the Sacral Center. This gate is real competence at generating resources — money, assets, momentum — through sustained, skilled effort, not luck. The energy behind it is strong enough that it can also become about power and possession for their own sake rather than what they're for. Keeping this gate pointed at a purpose bigger than accumulation itself is what keeps the power constructive instead of hollow.`,
  15:`Extremes. In the G Center. This gate holds space for the full range of human behavior — including people whose rhythms or extremes look nothing like your own — and it's built to include rather than judge that range. Its risk shows up as its own extremes: swinging between too much activity and total inertia. The gift is modesty: genuine acceptance of people exactly as they are, without needing them to moderate first.`,
  16:`Skills. In the Throat Center. This gate is enthusiasm plus repetition — real skill built through practicing something enough times that it becomes natural talent, then performed with visible confidence. The catch is that enthusiasm alone doesn't equal mastery; skipping the repetition and performing before the skill is actually there tends to be the one place this gate overreaches. Practiced first, performed after, this gate is genuinely compelling to watch.`,
  17:`Opinion. In the Ajna Center. This gate forms clear, logical opinions about how things should go, based on real patterns it's noticed — and it wants those opinions followed, since from its own view they're sound. The opinions are often accurate, but they're still one person's read of a pattern, not settled fact. Holding an opinion firmly while staying open that it could be revised by new information is what keeps this gate credible instead of just insistent.`,
  18:`Correction. In the Spleen Center. This gate has a sharp instinct for spotting what's flawed or broken and a real drive to fix it — genuinely useful when aimed at systems, processes, or work that needs improving. Aimed at people instead of systems, the same instinct reads as criticism or judgment. The gate works best asking "what needs correcting here" about the thing, not "what's wrong with you" about the person.`,
  19:`Wanting. In the Root Center. This gate is finely tuned to what's needed for real support and belonging — sensing when someone (including yourself) is under-resourced before it becomes an obvious problem. It's a genuine early-warning system for unmet needs. The risk is either ignoring your own version of that need while tending to everyone else's, or reading need into situations where there isn't one. Naming the need directly works better than hoping someone notices it.`,
  20:`The Now. In the Throat Center. This gate acts from whatever is true right in this moment — not from a plan made earlier, and not from overthinking what's about to happen. Its strength is genuine presence: showing up fully for what's actually in front of you. Its risk is acting without pausing to actually think a moment through first, since "the now" isn't the same as "the first impulse." A half-beat of awareness before acting is what keeps this gate sharp instead of reactive.`,
  21:`Control. In the Heart/Ego Center. This gate wants real, direct control over its own domain — its resources, its territory, its say in how things get run — and it's willing to assert that control rather than defer it to someone else. Held well, that's healthy self-management. Held poorly, it overreaches into controlling things (or people) that were never actually its domain to manage. The check is whether what's being controlled is genuinely yours to control.`,
  22:`Openness. In the Solar Plexus Center. This gate carries real emotional grace — social openness and warmth that lands well specifically when the emotional timing is right. The same openness, offered at the wrong emotional moment, can come across as too much or oddly timed. This gate isn't about being guarded; it's about reading the room's actual emotional state before deciding how open to be in it.`,
  23:`Assimilation. In the Throat Center. This gate takes a complex or unusual individual insight and simplifies it enough that other people can actually absorb it — genuinely valuable translation work. Timing and delivery matter a lot here: the same insight, said abruptly or at the wrong moment, can fracture a conversation instead of clarifying it. Slowing down to find simple, plain words (not clever ones) is what makes this gate's insight land instead of alienating people.`,
  24:`Rationalization. In the Ajna Center. This gate keeps returning to the same thought or realization, turning it over again until it's genuinely clear — not stuck, just thorough. Each pass at the idea should sharpen it a little; if repeated passes are only producing the same conclusion with more self-justification attached, that's the gate's shadow side (rationalizing) rather than its gift (clarifying). Real clarity here should be checkable by someone else, not just internally convincing to you.`,
  25:`Innocence. In the G Center. This gate loves without attaching to a specific outcome — a kind of universal, unconditional regard that doesn't require anything back. It's genuinely rare and often reads as a kind of resilience: setbacks don't permanently sour this gate's basic openness to people and to life. The vulnerability that comes with it is real, though — that same openness can also mean taking on hurt that a more guarded approach would have avoided.`,
  26:`The Trickster. In the Heart/Ego Center. This gate is a genuine skill at persuasion and salesmanship — presenting something (including yourself) in its best, most convincing light. That skill runs into trouble when "best light" tips into shading the truth: leaving out an inconvenient detail, or remembering events selectively to win an argument. The gate is strongest when the persuasion is built on something actually true, not on what's simply convenient to say.`,
  27:`Caring. In the Sacral Center. This gate carries real responsibility for other people's (and your own) wellbeing — nourishing, feeding, looking after, in a literal and practical sense, not just an emotional one. The risk is one-directional caretaking: giving care outward constantly while neglecting whether your own needs are being met the same way. Caring here holds up longest when it includes yourself as one of the people being looked after.`,
  28:`The Game Player. In the Spleen Center. This gate is willing to risk something real in search of a life that actually feels meaningful — it would rather gamble on a purpose worth pursuing than play it safe toward nothing in particular. The risk it's built to take should be a considered one tied to real meaning, not risk for its own thrill; taken that way, it produces exactly the kind of nothing-to-show-for-it outcome this gate fears most.`,
  29:`Perseverance. In the Sacral Center. This gate says yes to real commitments and then follows all the way through, including the hard, unglamorous middle stretch most people quit during. The catch is at the yes itself: this gate can say yes too fast, before actually checking whether the commitment is one worth its full follow-through. A brief pause before committing (not after) is what keeps this gate's real strength — persistence — pointed at things actually worth persisting through.`,
  30:`Feelings. In the Solar Plexus Center. This gate wants to feel the full range of emotional experience — desire, longing, intensity — and treats that wanting itself as valid information, not something to suppress. It runs hottest around wanting things it doesn't yet have, which can tip into a restless craving that's never quite satisfied by getting the thing. Naming the feeling honestly, rather than immediately chasing whatever might soothe it, is what this gate actually needs.`,
  31:`Influence. In the Throat Center. This gate leads through being genuinely heard and recognized by a group — real influence earned by speaking in a way others actually want to follow, not influence claimed by title. It only works with real followers behind it; without people actually choosing to listen, this gate's version of leadership doesn't function. The gift is leading well once chosen; the trap is trying to lead before that recognition is actually there.`,
  32:`Continuity. In the Spleen Center. This gate has a real, felt instinct for what will hold up over time versus what won't — a kind of survival-level pattern recognition applied to ventures, plans, and relationships. That instinct comes bundled with a fear of failure that can make it hesitant to commit to anything until it's certain of the outcome. The gate is most useful when it treats its own sense of "this won't last" as one input to weigh, not a final verdict to freeze around.`,
  33:`Privacy. In the Throat Center. This gate needs real retreat — time alone to process and remember what's already happened before it can speak about it usefully. What eventually gets said, once that private processing is done, often carries real, hard-won insight. Pressuring this gate to explain itself before that private processing is finished tends to produce a shallower answer than waiting would have gotten.`,
  34:`Power. In the Sacral Center. This gate is raw, undirected physical power — strength and capacity to act that doesn't come with its own built-in direction. It needs to be paired with a genuine response (something worth reacting to) rather than deployed just because the power is there. Directionless, this gate's strength can barrel through situations it wasn't actually needed for; aimed at a real response, the same strength becomes real, effective momentum.`,
  35:`Change. In the Throat Center. This gate gets restless without new experience and pushes toward change and progress almost for its own sake — variety itself is part of what it needs, not a means to some other end. That restlessness can swing between highs when something's new and flat boredom once the novelty wears off. Naming that swing as a pattern (not a crisis every time it happens) helps this gate ride it instead of being blindsided by it each cycle.`,
  36:`Crisis. In the Solar Plexus Center. This gate seeks new emotional territory, and getting there often runs through some real turbulence or crisis first — not because life is against it, but because unfamiliar emotional ground rarely arrives smoothly. The crisis isn't the failure here; it's frequently the actual mechanism this gate uses to reach a genuinely new emotional experience. Riding out the turbulent middle, instead of retreating at the first sign of it, is what gets this gate somewhere new.`,
  37:`Friendship. In the Solar Plexus Center. This gate builds bonds through mutual agreements, loyalty, and warmth — the glue that holds a family or close community together in practice, not just in feeling. It runs on reciprocity: the bond needs both people actually upholding their side of the agreement, spoken or not, to stay warm. When one side stops holding up their end, this gate feels it directly, often before either person names what changed.`,
  38:`The Fighter. In the Root Center. This gate is willing to oppose, resist, or fight for something it considers genuinely worth the fight — a real stubbornness in service of finding a purpose worth that much resistance. Directed at something trivial, the same stubbornness just looks combative for no clear reason. The gate is at its best when the opposition is aimed at something concrete and worth defending, not at conflict for its own sake.`,
  39:`Provocation. In the Root Center. This gate provokes — sometimes deliberately, sometimes just by its presence — in a way that tends to surface what other people actually feel underneath their polite surface. That's genuinely useful for cutting through evasiveness, but it can also read as needling people for no reason if the provocation isn't in service of an honest question. Provoking toward an actual answer, not just for reaction, is what separates this gate's gift from its shadow.`,
  40:`Aloneness. In the Heart/Ego Center. This gate takes on real responsibility for providing for others, and after doing so, it genuinely needs solitary rest to recover — not as an indulgence, but as the actual mechanism that lets it keep providing sustainably. Skipping that recovery to keep giving without pause tends to produce resentment toward the very people being provided for. Built-in aloneness here isn't withdrawal from love; it's the maintenance love like this actually requires.`,
  41:`Contraction. In the Root Center. This gate is the first, quiet stirring of a new desire or a new experience someone wants to have — a private fantasy or wish that hasn't been acted on yet. It's the seed stage, not the execution stage, and it can feel like an itch for something not yet defined. Naming what the actual desire is (rather than acting restlessly without naming it) is what lets this gate's early spark turn into a real direction.`,
  42:`Growth. In the Sacral Center. This gate brings a cycle to genuine completion — finishing what was started, letting a process run its natural course all the way to real increase, rather than cutting it short. Its risk is impatience: ending things (jobs, projects, relationships) right before the payoff that a little more follow-through would have delivered. This gate rewards staying through the whole cycle, especially the unglamorous last stretch.`,
  43:`Insight. In the Ajna Center. This gate produces a sudden, individual "knowing" that arrives complete, without a step-by-step explanation attached to it — which makes it hard to justify to other people in the moment, even when it turns out to be right. The insight itself tends to be real; the challenge is translating it into language others can actually follow, since "I just know" doesn't land as proof. Patience with being doubted until the insight is demonstrated (not just stated) is what this gate needs most.`,
  44:`Alertness. In the Spleen Center. This gate carries an instinctive, fast read on people — recognizing, almost instantly, whether someone or something matches a pattern worth trusting or worth avoiding, based on accumulated past experience. That instinct is usually accurate but isn't infallible, and it can misfire against someone who genuinely doesn't fit the old pattern it's matching against. Treating the instant read as a strong first data point, not a final verdict, keeps this gate's alertness useful rather than unfair.`,
  45:`The Gatherer. In the Throat Center. This gate gathers people and resources under one banner and has a natural instinct for distributing what's been gathered to the group it leads — a material, practical kind of leadership, often tied to teaching or resource-sharing. It works best when the gathering is actually shared back out; held onto for personal benefit instead, the same gathering instinct reads as hoarding rather than leadership.`,
  46:`Determination. In the G Center. This gate loves being embodied — genuinely enjoying physical presence, timing, and simply being in the right place at the right moment, almost by instinct. It's a determination that shows up as showing up: consistently being physically present for what matters, rather than trying to force outcomes through sheer will. Trusting the instinct for right timing and right place tends to serve this gate better than pushing to make something happen before its time.`,
  47:`Realization. In the Ajna Center. This gate processes past experiences — including confusing or difficult ones — until they suddenly resolve into real understanding, sometimes long after the experience itself happened. The confusion in the meantime isn't a malfunction; it's this gate's actual working process, sorting data before the "aha" arrives. Forcing a premature conclusion before the realization is actually ready tends to produce a shallower, less accurate read than waiting for the real one.`,
  48:`Depth. In the Spleen Center. This gate holds a real well of knowledge and talent, deep rather than broad, built through sustained practice over time. It comes paired with a fear of not being adequate to a given moment — a worry the depth isn't enough right when it's needed. In practice, the depth is usually more solid than the fear gives it credit for; the fear is worth noticing without treating it as an accurate measure of actual skill.`,
  49:`Principles. In the Solar Plexus Center. This gate holds real, felt principles about what is and isn't acceptable — in relationships, agreements, or a community — strong enough to justify walking away when those principles are violated. That's genuine integrity, not pickiness, when the principle is actually sound. It becomes rigidity when the standard being enforced hasn't been checked against whether it's still fair, or was ever fair, to begin with.`,
  50:`Values. In the Spleen Center. This gate is a custodian of shared values and standards — upholding the agreed rules that let a group or family function, and reacting strongly when those standards get violated. That instinct is genuinely stabilizing for a group. It becomes a problem when it defends an inherited rule out of habit alone, without checking whether the rule still serves the people it's meant to protect.`,
  51:`Shock. In the Heart/Ego Center. This gate is jolted alive by sudden shock or competition — a jarring event that this gate actually needs periodically to feel fully awake and engaged, rather than something to be avoided entirely. It thrives on being first, on the adrenaline of the unexpected. Without any shock or challenge for a long stretch, this gate can go quietly stagnant, restless for the very jolt it says it doesn't want.`,
  52:`Stillness. In the Root Center. This gate needs real, focused stillness — sitting with concentrated attention on one thing — before the right action actually becomes clear. That stillness isn't passivity; it's the concentration phase that makes the eventual action sharp and well-aimed instead of scattered. Skipping the stillness and moving straight to action tends to produce busy motion without much real precision behind it.`,
  53:`Beginnings. In the Root Center. This gate has real energy for starting things — new projects, new phases — and a much weaker natural pull toward finishing them, which isn't a character flaw so much as where this gate's actual strength sits. It works best paired with someone or something that handles the follow-through, rather than this gate forcing itself to personally finish every single thing it starts.`,
  54:`Ambition. In the Root Center. This gate has real drive to rise — to improve status, circumstances, and material position, often starting from very little. That ambition is a genuine engine, not vanity, when it's aimed at building something concrete. It runs into trouble when the rise itself becomes the entire goal, disconnected from what the improved position was actually supposed to be used for.`,
  55:`Spirit. In the Solar Plexus Center. This gate has access to real emotional abundance — including big, unpredictable mood swings that aren't a sign anything's wrong, just this gate's actual emotional range in motion. The lows here can feel disproportionately heavy compared to actual circumstances, and the highs disproportionately light. Naming the wave as a wave, rather than as evidence about how things "really" are right now, keeps this gate's abundance from being mistaken for instability.`,
  56:`Stimulation. In the Throat Center. This gate is a natural storyteller, gathering experiences to share as narrative — a genuine gift for making an experience come alive for someone who wasn't there for it. It runs on new material, though, and can get restless or start needing more and bigger stories to stay interesting to itself. Depth in fewer stories, told well, tends to hold this gate's attention longer than constantly chasing new experience for new content.`,
  57:`Intuition. In the Spleen Center. This gate has fast, quiet, accurate intuition about right now — often received first through sound or a gut-level read rather than reasoning it out. It only speaks to the present moment; it's not built to forecast or plan ahead. The instinct here is easy to miss or override with louder, more "logical"-sounding thoughts, but it tends to hold up well when actually followed in real time.`,
  58:`Vitality. In the Root Center. This gate has real stamina and genuine joy specifically in fixing and improving things — a correcting energy that, aimed at something worth improving, produces real satisfaction and momentum. Aimed at something that's actually fine as it is, the same energy can turn into needless nitpicking. The gate is strongest when there's a real, worthwhile flaw to correct, not a habit of finding one whether or not it's there.`,
  59:`Sexuality. In the Sacral Center. This gate is about breaking down the barriers between people to create real intimacy and bonding — a drive toward closeness that, at its root, is about dissolving separateness, not just about sex specifically. It works best directed at someone genuinely chosen for real closeness. Used to break down boundaries indiscriminately, the same drive can create intimacy that doesn't hold up once the initial dissolving-of-distance wears off.`,
  60:`Acceptance. In the Root Center. This gate works within real limitation — actual constraints of time, money, or circumstance — and finds a genuinely new way forward inside those limits rather than waiting for the limits to disappear first. That's real innovation, not resignation. It runs into trouble when the limitation gets accepted as permanent and unchangeable when it was actually possible to work around or past.`,
  61:`Inner Truth. In the Head Center. This gate carries a deep, private sense of knowing — a truth felt with real certainty even when it can't yet be explained or proven to anyone else. The mental pressure here is the need to eventually understand and articulate that inner knowing, not just sit with the mystery of it forever. Trying to force premature words onto a truth that isn't ready to be explained yet tends to come out muddled rather than clear.`,
  62:`Details. In the Throat Center. This gate expresses in precise, concrete, factual terms — the specific detail rather than the big-picture feeling, which makes what it says easy to verify and hard to misread. It's genuinely good at making the practical clear. Its risk is getting so focused on correct small details that the larger point of what's being said gets buried under them.`,
  63:`Doubt. In the Head Center. This gate questions things that already appear settled or completed — not out of negativity, but because verifying what's already been decided is exactly the mental pressure this gate is built to carry. That doubt is often what catches a real flaw others missed. Left unchecked against actual evidence, the same doubt can also spiral into questioning things that were genuinely fine, just for the sake of questioning.`,
  64:`Confusion. In the Head Center. This gate holds a flood of past impressions and images without yet having the context to make sense of them — mental pressure that feels like confusion because it genuinely is confusion, until enough new experience gives the old impressions a frame to click into. That confusion is the actual raw material for real understanding later, not a problem to make disappear immediately. Sitting with not-yet-knowing, instead of forcing a premature answer, is what this gate actually needs.`
};

const NUM_DEFS={
  lifepath:{
    1:`As a Life Path 1, you're wired to lead rather than follow — you trust your own judgment, move decisively once you've committed to a goal, and bring an original, unconventional approach to whatever you take on. You tend to do your best work independently or in charge of your own venture, since you chafe under too much direction from others. The growth edge for a 1 is keeping that drive humble: unchecked, your self-reliance can tip into pride or an unwillingness to acknowledge that your gifts aren't entirely of your own making.`,
    2:`As a Life Path 2, your gift is emotional attunement — you sense what the people around you need almost before they say it, and you become the calm, steady presence others lean on. The catch is that this same sensitivity makes you quick to hurt, so you're prone to swallowing your own opinions and avoiding confrontation rather than risk friction, which quietly builds resentment. Your path is learning to trust the inner strength you already have so you can speak up and use your gift for connection without losing yourself in it.`,
    3:`As a Life Path 3, you're a natural communicator with real charisma — expressive, optimistic, and able to light up a room, which makes you a magnet for social attention. Your challenge is turning that raw talent into something lasting: 3s often struggle with follow-through, discipline, and practical matters like money, and the same emotional openness that fuels your charm can flip into moodiness or a sharp tongue when you're low. When you commit to the work behind the gift, your self-expression becomes genuinely uplifting to everyone around you.`,
    4:`As a Life Path 4, you're the builder — practical, disciplined, and methodical, with a strong internal compass for right and wrong that makes you someone others can count on. You succeed through sustained, step-by-step effort rather than shortcuts, and that same grounded realism can make you rigid or overly quick to judge others who don't share your standards. Your work is to stay firm in your integrity while loosening your grip enough to work for a better world without demanding it happen exactly your way.`,
    5:`As a Life Path 5, you're built for motion — curious, adaptable, and drawn to variety, travel, and new people, learning best through direct experience rather than rules handed down to you. That appetite for freedom is your greatest asset, but it can easily curdle into restlessness, impulsiveness, or scattering your energy across too many pursuits to finish any of them. Your real lesson is discovering that true freedom isn't the absence of commitment — it's the discipline to choose your changes rather than being driven by them.`,
    6:`As a Life Path 6, you're the caretaker — instinctively drawn to the vulnerable, quick to offer comfort, and willing to shoulder responsibility that others let slide, often through real personal sacrifice. The lesson tucked inside that generosity is learning where help ends and interference begins: true service means equipping people to handle their own struggles, not just being a permanent shoulder to cry on. Getting that balance right is what turns your caregiving from self-sacrifice into genuine healing.`,
    7:`As a Life Path 7, you're the seeker — analytical and introspective, pulled toward life's deeper mysteries with a mind built for research, theory, and solving problems others can't crack. You tend to be something of a lone wolf, needing solitude to recharge and finding close relationships genuinely difficult to sustain, even though you can be warm and generous in company. The risk is letting that need for privacy tip into isolation; taken too far, it can leave you cynical and suspicious instead of at peace.`,
    8:`As a Life Path 8, you have a natural command of the material world — a sharp instinct for business, finance, and leadership that gives you more potential than any other Life Path to build real wealth and influence, provided you put in sustained effort. You're able to inspire others to join your vision, though you often have to keep pushing them along, and you're drawn to positions of authority in business, law, or large institutions. Your central challenge is detachment: learning that the power and resources you accumulate are meant to serve others, not just secure your own comfort and status.`,
    9:`As a Life Path 9, you carry a broad, humanitarian view of the world — compassionate, idealistic, and more concerned with the greater good than personal gain, judging people by what they contribute rather than by bias or background. You're a natural utopian, willing to give your time, money, and energy toward making things better on a larger scale. The core lesson of the 9 is release: learning to let go of possessions, outcomes, and even relationships without gripping too tightly, since your deepest fulfillment comes from giving without expecting anything back.`,
    11:`As a Life Path 11, you carry the sensitivity and partnership instincts of the 2, but amplified into something more intense — a heightened intuition that makes you a kind of lightning rod for ideas, insight, and inspiration you can't always explain rationally. That same amplified wiring makes you unusually vulnerable to nervous energy and stress, and you may have felt misunderstood or withdrawn earlier in life simply because so much was happening beneath the surface. Your path is learning to channel that intensity deliberately, so the inspiration that moves through you also reaches and uplifts the people around you.`,
    22:`As a Life Path 22, you're the Master Builder — capable of taking a big, almost visionary idea and actually constructing it in the real world, turning inspiration into something concrete and lasting on a scale most people can't. That kind of impact only happens by rallying other people, resources, and ideas around your vision, since your power works through collaboration rather than solo effort. The 22 carries an unusually wide gap between its promise and its pitfalls: flexibility tends to be your weak point, and the same drive that lets you build big things can slide into controlling or manipulating the people you need on your side.`,
    33:`As a Life Path 33, you carry the rarest of the Master Numbers — a blend of the 3's expressive gifts and the 6's instinct to nurture, producing what's often described as the Master Teacher: someone whose compassion and desire to help the vulnerable become a vehicle for genuinely lifting others up. Your spirituality tends to be experiential rather than doctrinal, showing up as sincere devotion and service rather than formal belief. Like the 6, your real work is learning the difference between truly helping someone and simply absorbing their struggles for them — knowing when to guide and when to step back so people can grow through their own experience.`
  },
  expression:{
    1:`With an Expression number of 1, you're wired to lead rather than follow — you bring original ideas, self-reliance, and drive to whatever you do, and you're happiest running the show rather than taking orders. This independence makes you an excellent pioneer, entrepreneur, or executive, but left unchecked it can tip into bossiness or an intolerance for anyone who doesn't move at your pace. Learning to channel your ambition without steamrolling the people around you is where this number's real growth lies.`,
    2:`With an Expression number of 2, your gift is sensitivity — an intuitive read on what others are feeling that makes you a natural mediator, partner, and team player rather than a solo act. You do your best work in cooperation, smoothing over conflict and creating harmony where others create friction. The flip side is that this same sensitivity leaves you easily wounded — a sharp word or tense atmosphere can knock you off balance far more than it would someone less attuned to emotional undercurrents.`,
    3:`With an Expression number of 3, you were built to communicate — your natural charm, wit, and creative spark make you a gifted writer, speaker, performer, or artist who can lift a room's mood almost without trying. People are drawn to your optimism and expressiveness, and self-expression through words, art, or performance is where you truly shine. The catch is discipline: that same free-flowing creative energy can scatter into moodiness, superficiality, or a scattered, undisciplined approach to follow-through if you don't anchor it.`,
    4:`With an Expression number of 4, you express yourself through steady, practical effort — you're the builder who turns big ideas into real, working structures through discipline, organization, and reliability. Others count on you because you take responsibility seriously and manage details that people around you overlook, which suits careers in management, finance, or any field that rewards precision. The risk is rigidity: your love of order can calcify into stubbornness or an overly serious, all-work outlook that needs conscious loosening up.`,
