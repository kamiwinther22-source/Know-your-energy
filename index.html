function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function arow(l,v,defKey,defNum,note){
  let specific;
  if(defKey&&defNum!=null&&NUM_DEFS[defKey]&&NUM_DEFS[defKey][defNum]){
    specific=NUM_DEFS[defKey][defNum];
  }else if(defKey&&defNum!=null&&ASTRO_DEFS[defKey]&&ASTRO_DEFS[defKey][defNum]){
    specific=ASTRO_DEFS[defKey][defNum];
  }else if(defKey&&defNum!=null&&HD_DEFS[defKey]&&HD_DEFS[defKey][defNum]){
    specific=HD_DEFS[defKey][defNum];
  }
  const general=defKey&&GLOSSARY[defKey]?GLOSSARY[defKey]:null;
  // show the plain "what this is" line first, then the personalized
  // interpretation below it -- someone new to this shouldn't have to
  // already know what a Life Path number is to read their own result
  const parts=[];
  if(note)parts.push(`<p class="dpdef-note">${note}</p>`);
  if(general)parts.push(`<p>${general}</p>`);
  if(specific)parts.push(`<p>${specific}</p>`);
  const def=parts.length?parts.join(''):null;
  const lbl=def?`<span class="dprl term" data-def="${defKey}">${l}</span>`:`<span class="dprl">${l}</span>`;
  return `<div class="dprow"><div class="dpr">${lbl}<span class="dprv">${escapeHtml(v)}</span></div>${def?`<div class="dpdef" hidden>${def}</div>`:''}</div>`;
}
// Human Design's real API returns free-text (e.g. "Manifesting Generator",
// "Emotional - Solar Plexus"), so match by keyword rather than requiring an
// exact string -- keeps the definitions working regardless of exact phrasing.
function normalizeHDType(s){
  const t=(s||'').toLowerCase();
  if(t.includes('manifesting generator'))return 'manifesting generator';
  if(t.includes('generator'))return 'generator';
  if(t.includes('projector'))return 'projector';
  if(t.includes('manifestor'))return 'manifestor';
  if(t.includes('reflector'))return 'reflector';
  return null;
}
function normalizeHDAuthority(s){
  const t=(s||'').toLowerCase();
  if(t.includes('sacral'))return 'sacral';
  if(t.includes('emotional')||t.includes('solar plexus'))return 'emotional';
  if(t.includes('splenic')||t.includes('spleen'))return 'splenic';
  if(t.includes('ego')||t.includes('heart'))return 'ego';
  if(t.includes('self-projected')||t.includes('self projected'))return 'self-projected';
  if(t.includes('mental')||t.includes('environment'))return 'mental';
  if(t.includes('lunar')||t.includes('moon'))return 'lunar';
  return null;
}
// Same defensive matching as type/authority -- pull the "N/M" pair out of
// whatever the API actually sends (e.g. "3/5" or "3/5 Martyr / Heretic")
// rather than requiring an exact string.
function normalizeHDProfile(s){
  const m=(s||'').match(/(\d)\s*\/\s*(\d)/);
  return m?`${m[1]}/${m[2]}`:null;
}
const HD_DEFS={
  hdtype:{
    'generator':`Every chart has 9 energy centers in the body, and this type has one of them — roughly at gut level — switched on. That center works almost like a reflex: when something real is actually in front of them, their body responds with an immediate felt pull toward it or away from it, often before they've consciously thought it through — closer to a gut "mmhm" or "uh-uh" than a reasoned decision. That same switched-on center also gives them a real, physical capacity for sustained work: energy that keeps refilling on its own, day after day, as long as what they're doing is something that gut response actually said yes to. Work that never had that real pull behind it — taken on out of obligation, or because it seemed like the responsible choice — drains this type in a way that has nothing to do with how hard the work itself is; a task with no real interest in it can leave someone more exhausted than a harder one they actually wanted to do. Life tends to go better when they let things come to them and react honestly to what shows up, rather than deciding in the abstract what they should want and chasing it down. When the work actually has that gut-level yes in it, it tends to feel deeply satisfying and energizing, even when it's genuinely hard. When it doesn't, the result usually isn't just tiredness — it's a stuck, resentful kind of frustration, the sense of spinning wheels without traction. About a third of people are built this way.`,
    'manifesting generator':`Every chart has 9 energy centers in the body, and this type has one of them — roughly at gut level — switched on. That center works almost like a reflex: when something real is actually in front of them, their body responds with an immediate felt pull toward it or away from it, often before they've consciously thought it through — closer to a gut "mmhm" or "uh-uh" than a reasoned decision. That same center also gives them a real, physical capacity for sustained work: energy that keeps refilling on its own, day after day, as long as what they're doing is something that gut response actually said yes to. What sets this specific type apart is an additional live connection running from another energy center straight up to the throat — the part of the body tied to speaking and taking action. That extra connection means there's much less delay between feeling that gut-level yes and actually being in motion on it. In practice, this type tends to move fast, jump between more than one thing at once, and skip steps that someone moving more slowly would take in order — which can look careless to people watching, even when it isn't. Letting things come to them and reacting honestly to what's real in front of them still works best; the speed only shows up once that real yes is already there. When the work has that pull behind it, it tends to feel deeply satisfying, engaged, in motion. When it's blocked, rushed, or was never a real yes to begin with, the feeling tends to run hotter than plain frustration — closer to real anger. Roughly a third of people are built this way.`,
    'projector':`Every chart has 9 energy centers in the body, and this type does not have the one responsible for steady physical stamina — roughly at gut level — switched on. There's no built-in engine constantly refilling itself; trying to keep pace with people who do have that kind of steady energy tends to wear this type out in a way that has nothing to do with willpower. What this type has instead is a real capacity to see clearly how other people, and how systems and groups, actually work — often more clearly than the people caught up inside their own energy can see it about themselves. That insight is genuinely useful, but it tends to only land well when someone actually asks for it: offering it uninvited, even when it's completely accurate, tends to get met with defensiveness rather than gratitude, since it wasn't asked for. Life tends to go better when they let their value be recognized by other people first, and let the invitation come to them, rather than pushing their insight on people who haven't asked. When that recognition and invitation actually happen, it tends to feel like real success and ease. When it doesn't — when the insight keeps getting offered and ignored or dismissed — the result tends to feel like a real, corrosive bitterness over time. Roughly a fifth of people are built this way.`,
    'manifestor':`Every chart has 9 energy centers in the body, and this type does not have the one responsible for steady physical stamina — roughly at gut level — switched on. But they do have a different energy center connected directly to the throat, the part of the body tied to speaking and taking action, without needing to go through that gut-response center at all. That direct connection is what lets this type start something entirely on their own — from a standing start, on their own initiative — without needing something outside them to react to first. The catch is that other people usually can't feel this type's energy building the way they can with a steadier motor running underneath it, so what they do can genuinely blindside the people around them, even when it isn't meant to. Saying out loud what they're about to do before doing it — not asking permission, just giving people a heads-up — tends to prevent a lot of the pushback and resistance that catches people by surprise otherwise. When they're able to move on their own initiative without getting blocked or having to over-explain themselves, the feeling tends to be a real, settled peace. When they're stopped, controlled, or forced to justify themselves after the fact, it tends to come out as real anger. Under a tenth of people are built this way.`,
    'reflector':`Every chart has 9 energy centers in the body, and this is the one type with none of them switched on — every other type has at least one energy center that stays consistent no matter who they're around; this type doesn't have a single one. In practice, that means they take in and reflect whatever's actually happening around them — the mood of a room, the health of a relationship, the state of a group — more than they run on any fixed sense of their own. That same openness is what makes this type an unusually accurate gauge of whether something is actually healthy or off, often before anyone's said a word about it. Because nothing about their own internal state holds still, a big decision made quickly, off just one day's mood, tends not to hold up. Giving it real time — waiting through roughly a full lunar cycle, about a month — lets them feel a choice from enough different days and moods to actually trust it. A decision made that way tends to genuinely surprise them with how right it feels; one made too fast, under pressure, tends to leave a real letdown once the initial mood wears off. Roughly 1 in 100 people are built this way.`
  },
  hdauthority:{
    'sacral':`Sacral Authority means your gut — literally, a physical sensation in the stomach area — gives you a yes or no the moment you're asked something real, right now. It's not something you arrive at by thinking it over; sitting alone trying to reason out the answer ahead of time tends to produce the wrong one. In practice, this is one of the fastest Authorities: unlike Emotional Authority, which needs time to settle, or Mental Authority, which needs talking it through with someone else, Sacral Authority is built to answer on the spot, in the body, right when the question is real.`,
    'emotional':`Emotional Authority means your decisions run through the Solar Plexus — the body's emotional center — which works in waves over time rather than giving a fixed answer in the moment. Whatever you feel right when a decision comes up is only half the picture; the same choice will often feel different by the next day. In practice, riding out the wave before deciding is what works — deciding at the peak of excitement or the bottom of doubt tends to backfire. Unlike Sacral or Splenic Authority, which answer instantly, Emotional Authority needs time before it's trustworthy.`,
    'splenic':`Splenic Authority means your decisions run through the Spleen — the body's intuition and survival-instinct center — which gives an instant read, but a quiet one. It's not a strong gut punch like Sacral Authority; it's more like a soft, single instinct that's easy to miss or talk yourself out of if you're not paying attention. In practice, it only speaks once, about right now — it isn't built to weigh in on some hypothetical decision for later the way Emotional Authority can revisit a question over time.`,
    'ego':`Ego Authority (sometimes called Heart Authority) means your decisions run through the Heart center — the body's zone for willpower and drive. A decision is trustworthy here when it comes from a genuine, honest want: do you have the will to put your energy into this? Because willpower isn't unlimited, this Authority runs into trouble specifically around promises made to prove something to someone — including yourself — rather than from real desire. In practice, that makes it different from the gut- or emotion-based Authorities: it's not about instinct or feeling, it's about honestly checking your own will.`,
    'self-projected':`Self-Projected Authority comes from a defined G Center — the body's zone for identity and direction — without the gut, spleen, emotional, or heart centers defined alongside it. In practice, that means clarity doesn't show up as a physical signal in the body the way it does for the other Authorities — it shows up in your own voice. Talking a direction out loud, to someone else or even to yourself, is how you discover whether it's right for you; sitting with it silently doesn't work nearly as well. This Authority belongs only to Projectors.`,
    'mental':`Mental Authority (sometimes called a "Sounding Board") means none of the body-based decision centers are defined — instead, clarity depends on your surroundings and the right people around you. Talking something through out loud with a few trusted people isn't about getting their opinion — it's about hearing your own thoughts reflected back, which is how clarity forms for you. In practice, this is the one Authority that can't really be worked out alone in your head or in silence — every other Authority can, in theory, be checked internally; this one needs real conversation.`,
    'lunar':`Lunar Authority belongs only to Reflectors, since they don't have any center switched on to provide a decision-making signal at all. Instead, clarity comes from time itself — riding out a full lunar cycle, about 28 days, asking the same question across different moods and different company before an answer holds steady. In practice, that makes it the slowest Authority by far, and the only one tied to an outside cycle rather than an internal body signal. Rushing a big decision before that month plays out is the most common way this Authority gets overridden.`
  },
  hdprofile:{
    '1/3':`A 1/3 Profile combines a conscious need for a solid, deeply researched foundation with an unconscious style of learning through trial and error — you want to know something thoroughly before you trust it, but your actual experience of learning comes from bumping into what doesn't work first. In practice, that can feel like two different processes running at once: the studying side of you wants certainty before acting, while the experimenting side only finds real answers by testing something out loud. Mistakes made along the way aren't a sign your research was wrong — they're simply how the Line 3 half of you was always going to get its information. The strength here is depth: once you've actually lived through a mistake, the understanding that follows tends to be more solid than research alone could ever give you.`,
    '1/4':`A 1/4 Profile combines a conscious need for a solid, deeply researched foundation with an unconscious style of influence that runs through a fixed circle of close friends and contacts rather than a wide audience. You build real expertise on your own first, then that knowledge moves outward almost entirely through personal relationships — people you already know, not strangers you're trying to convince. In practice, that makes your network something to actually invest in and maintain, since it's the real channel your influence travels through, not a side effect of it. The combination works best when your foundation is genuinely solid before you lean on your circle to carry it further.`,
    '2/4':`A 2/4 Profile combines a conscious need for real solitude to develop your natural talent with an unconscious style of influence built through a fixed circle of close friends. You have a gift that tends to look effortless from the outside, but it only develops properly with real time alone — and it's your existing network, not strangers, who end up calling you out to actually use it. In practice, that call-out matters: a 2/4 pushed into the spotlight by people they don't already trust tends to resist or underperform, while being invited out by someone close usually works. The lesson is trusting that your circle knows when you're ready, even when you don't feel ready yourself.`,
    '2/5':`A 2/5 Profile combines a conscious need for real solitude to develop your natural talent with an unconscious pull to be seen by others as someone who can fix their problems. You'd rather be left alone to develop your gift quietly, but people around you tend to project real expectations onto you anyway, calling you out to solve something practical whether you feel ready or not. In practice, that projection field means your reputation can outrun what you've actually offered to take on — it's worth only stepping in when a request genuinely matches what you can deliver. The tension to manage is real: withdrawing too much reads as unavailable, while accepting every call-out risks disappointing people who expected more than you signed up for.`,
    '3/5':`A 3/5 Profile combines a conscious style of learning through trial and error with an unconscious pull to be seen by others as someone who can fix their problems with practical, unconventional solutions. You learn what actually works by testing things directly and bumping into what doesn't — failure isn't a flaw here, it's the actual mechanism, the raw material your real-world wisdom is built from. Once you've lived through that testing, people tend to project real expectations onto you, seeing you as someone who can step in and solve what they couldn't. In practice, that projection field cuts both ways: you can become the person credited with fixing things, or blamed when a solution falls short, so it's worth only taking on problems you genuinely feel aligned with rather than every one people hand you.`,
    '3/6':`A 3/6 Profile combines a conscious style of learning through trial and error with an unconscious three-phase life arc that eventually settles into living as a trusted example for others. The first several decades of your life tend to be heavily experimental — testing things, making real mistakes, and figuring out what doesn't work through direct experience rather than theory. Sometime around your late twenties or early thirties, that active trial-and-error period tends to give way to a more observational phase, stepping back to actually process everything you've lived through. In practice, the wisdom you eventually offer as an example to others carries real weight specifically because it was earned through visible, lived mistakes rather than untested theory.`,
    '4/6':`A 4/6 Profile combines a conscious style of influence built through a fixed circle of close friends with an unconscious three-phase life arc that eventually settles into living as a trusted example for others. Your impact tends to travel through people you actually know rather than a wide audience, and that personal network only deepens as you move through life's phases. In practice, the trial-and-error and more visible engagement of your earlier years tends to shift, around your late twenties or early thirties, into a steadier, more observational role — one where your closest relationships increasingly look to you for grounded example rather than active involvement. The strength here is that both halves of the Profile run through real relationship, not abstraction.`,
    '4/1':`A 4/1 Profile combines a conscious style of influence built through a fixed circle of close friends with an unconscious need for a genuinely solid, deeply researched foundation underneath what you share. You spread ideas and influence others primarily through people you already know, but that influence only holds up if what you're offering them is actually well-understood, not just socially convenient. In practice, that makes your closest relationships something to be careful with — this Profile's version of losing trust often comes from being visibly wrong to people who trusted you personally, which cuts deeper than being wrong to a stranger would. The combination works best when you let your real expertise catch up before you lean on your network to carry it.`,
    '5/1':`A 5/1 Profile combines an unconscious pull to be seen by others as someone who can fix their problems with a conscious need for a genuinely solid, deeply researched foundation underneath whatever you offer. People project real expectations onto you, expecting practical solutions, but unlike a more improvisational 5, your actual answers tend to come from real depth of study rather than pure trial and error. In practice, that combination can make you unusually reliable under pressure — you're not guessing when you step in — but it also means the gap between what people assume you already know and what you've actually verified is worth watching closely. The lesson is trusting your own research enough to act on it, rather than over-preparing past the point it's useful.`,
    '5/2':`A 5/2 Profile combines an unconscious pull to be seen by others as someone who can fix their problems with a conscious need for real solitude to develop your natural talent. People tend to project expectations onto you and call you out of your own preferred privacy to solve something practical, whether or not you feel ready to be seen that way. In practice, this can create real friction: your natural gift develops best with time alone, but the same gift is exactly what draws the projections pulling you back into view. The lesson is accepting call-outs selectively — from people who actually know what you're capable of — rather than either hiding completely or overcommitting to every expectation placed on you.`,
    '6/2':`A 6/2 Profile combines an unconscious three-phase life arc that eventually settles into living as a trusted example with a conscious need for real solitude to develop your natural talent. Like other Line 6 Profiles, your first several decades tend to include real trial and error before you move into a more observational phase — but underneath that arc, you also need genuine alone time for your natural gifts to actually develop, and resent being pushed into the spotlight before you're ready. In practice, that combination means the "role model" quality this Profile is known for tends to arrive later and more quietly than for other 6-lines, built as much through your own recharging as through visible experience. The lesson is trusting that withdrawing to recharge isn't avoidance — it's actually part of how this Profile does its real work.`,
    '6/3':`A 6/3 Profile combines an unconscious three-phase life arc that eventually settles into living as a trusted example with a conscious style of learning through trial and error. Both halves of this Profile involve real, hands-on experience, which tends to make the early trial-and-error period of a 6's life especially pronounced — more mistakes, more direct testing, more bumping into what doesn't work, before the more observational "rooftop" phase begins. In practice, that means your credibility as an eventual example comes from an unusually visible track record of real trial and error, not from having avoided mistakes. The lesson is the same one every 3-line carries: a stumble here isn't failure, it's the actual mechanism your wisdom is built from.`
  }
};
function karmicRow(l,numbers,defKey){
  if(!numbers.length)return arow(l,'None',null);
  const v=numbers.join(', ');
  const pairs=numbers.map(n=>{
    const d=NUM_DEFS[defKey]&&NUM_DEFS[defKey][n];
    return d?{n,d}:null;
  }).filter(Boolean);
  if(!pairs.length)return arow(l,v,null);
  const combined=pairs.length>1?pairs.map(({n,d})=>`<strong>${n}:</strong> ${d}`).join(' '):pairs[0].d;
  const lbl=`<span class="dprl term" data-def="${defKey}">${l}</span>`;
  return `<div class="dprow"><div class="dpr">${lbl}<span class="dprv">${escapeHtml(v)}</span></div><div class="dpdef" hidden>${combined}</div></div>`;
}

// Real astrology wheel: signs at their real fixed 30deg boundaries, planets
// at their real computed degree (astro.planets[].absoluteDegrees), rotated
// so the Sun sits at the top instead of using a fixed Ascendant-at-left
// convention. Falls back gracefully when birth time wasn't given (no houses).
function astroWheelSVG(astro){
  if(!astro||astro.error)return '';
  const planets=(astro.planets||[]).filter(p=>p.name&&typeof p.absoluteDegrees==='number');
  if(!planets.length)return '';
  const NS='http://www.w3.org/2000/svg';
  // sized so full sign names have real room at the outer edge, not squeezed
  // 3-letter abbreviations -- legible without straining was the actual ask
  // wheel sized so the sign ring itself is wide enough for full spelled-out
  // names at a legible size, at the widest word ("SAGITTARIUS") -- labels
  // sit inside the ring near its outer edge, not pushed outside the circle
  const CX=230,CY=230,R_OUT=195,R_SIGN_IN=145,R_HOUSE_IN=18,R_HOUSE_LABEL=30,R_STACK_MAX=140,R_STACK_MIN=35,R_LABEL=183;
  const sunDeg=(planets.find(p=>p.name==='Sun')||planets[0]).absoluteDegrees;
  const ROT=(90-sunDeg+360)%360;
  const rot=d=>(d+ROT)%360;
  const toXY=(deg,r)=>{const rad=(180-deg)*Math.PI/180;return [CX+r*Math.cos(rad),CY-r*Math.sin(rad)];};
  let svg=`<svg viewBox="0 0 460 460" style="display:block;width:100%;height:100%;">`;
  svg+=`<circle cx="${CX}" cy="${CY}" r="${R_OUT}" fill="rgba(255,255,255,0.5)" stroke="#1C2CA9" stroke-width="2"/>`;
  svg+=`<circle cx="${CX}" cy="${CY}" r="${R_SIGN_IN}" fill="none" stroke="#1C2CA9" stroke-width="1.4" opacity="0.85"/>`;
  SIGN_ORDER.forEach((s,i)=>{
    const d0=rot(i*30);
    const [x1,y1]=toXY(d0,R_SIGN_IN), [x2,y2]=toXY(d0,R_OUT);
    svg+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#1C2CA9" stroke-width="1.6" opacity="0.85"/>`;
    const [gx,gy]=toXY(d0+15,R_LABEL);
    // rotate each label so it reads normally as if you're standing at the
    // center looking outward at it -- tangent to the ring, NOT running
    // along the radius like a spoke. At the top this is upright/unrotated;
    // going around the ring it turns to stay "facing" that viewpoint.
    let faceAngle=Math.atan2(gx-CX,CY-gy)*180/Math.PI;
    // flip any label that would otherwise render upside-down (bottom half
    // of the ring) so every sign stays upright and readable -- strictly
    // "always facing center" would put half of them the wrong way up
    if(faceAngle>90)faceAngle-=180; else if(faceAngle<-90)faceAngle+=180;
    svg+=`<text x="${gx.toFixed(1)}" y="${gy.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="#000000" font-family="'Barlow Condensed',sans-serif" transform="rotate(${faceAngle.toFixed(1)} ${gx.toFixed(1)} ${gy.toFixed(1)})">${s.toUpperCase()}</text>`;
  });
  const houses=(astro.houses||[]).filter(h=>typeof h.absoluteDegrees==='number').sort((a,b)=>a.absoluteDegrees-b.absoluteDegrees);
  if(houses.length){
    houses.forEach((h,i)=>{
      const d=rot(h.absoluteDegrees);
      const [x1,y1]=toXY(d,R_HOUSE_IN), [x2,y2]=toXY(d,R_SIGN_IN);
      svg+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#1C2CA9" stroke-width="1" opacity="0.6"/>`;
      // house number, centered in the small band just outside the inner
      // circle -- real house cusps aren't evenly spaced, so this midpoint
      // is computed per-house rather than assumed
      const next=houses[(i+1)%houses.length];
      const span=((next.absoluteDegrees-h.absoluteDegrees)+360)%360;
      const midDeg=rot(h.absoluteDegrees+span/2);
      const [hx,hy]=toXY(midDeg,R_HOUSE_LABEL);
      svg+=`<text x="${hx.toFixed(1)}" y="${(hy+1).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" fill="#1C2CA9" font-family="'Barlow Condensed',sans-serif">${h.house}</text>`;
    });
    svg+=`<circle cx="${CX}" cy="${CY}" r="${R_HOUSE_IN}" fill="none" stroke="#1C2CA9" stroke-width="1.4" opacity="0.6"/>`;
  }
  if(astro.ascendant&&typeof astro.ascendant.absoluteDegrees==='number'){
    const d=rot(astro.ascendant.absoluteDegrees);
    const [x1,y1]=toXY(d,R_HOUSE_IN||0), [x2,y2]=toXY(d,R_OUT);
    svg+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#333" stroke-width="2.2"/>`;
  }
  if(astro.midheaven&&typeof astro.midheaven.absoluteDegrees==='number'){
    const d=rot(astro.midheaven.absoluteDegrees);
    const [x1,y1]=toXY(d,R_HOUSE_IN||0), [x2,y2]=toXY(d,R_OUT);
    svg+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#333" stroke-width="2.2" stroke-dasharray="6,3"/>`;
  }
  // Glyphs stay at their own true degree always (never nudged sideways into
  // a neighboring wedge, no pointer line). Font size stays fixed and legible
  // -- crowding is resolved by radial LANES instead of shrinking text: every
  // glyph starts at the same comfortable resting radius, and only glyphs
  // that would actually collide (with each other OR with an unrelated
  // nearby planet -- e.g. Mercury and the Sun are never far apart on any
  // real chart) get pushed out one lane further, spilling outward into the
  // sign-ring band rather than becoming too small to read.
  const GLYPH_FONT=26;
  const LANE_GAP=GLYPH_FONT*1.45; // measured glyph diagonal + margin -- two glyphs whose radii differ by this much can never overlap, at any angle
  const BASE_R=(R_STACK_MAX+R_STACK_MIN)/2;
  function angDist(a,b){ const d=Math.abs(a-b)%360; return d>180?360-d:d; }
  const sorted=[...planets].sort((a,b)=>a.absoluteDegrees-b.absoluteDegrees);
  const lanes=[];
  const placements=sorted.map(p=>{
    let k=0;

        lanes[k].push(p.absoluteDegrees);
        return {p,r};
      }
      k++;
    }
    lanes[0].push(p.absoluteDegrees);
    return {p,r:BASE_R};
  });

    const glyph=PLANET_GLYPH[p.name]||p.name[0];

  });

  return svg;
}

  const CENTER_COLOR={Head:'#7B5EA7',Ajna:'#2F6FB0',Throat:'#1E8C7A',G:'#E8B923',Heart:'#C23B7A',Sacral:'#C0392B',Spleen:'#3F8F3F',SolarPlexus:'#B85C1F',Root:'#5C3A21'};
  const CENTER_TEXT={Head:'#ffffff',Ajna:'#ffffff',Throat:'#ffffff',G:INK,Heart:'#ffffff',Sacral:'#ffffff',Spleen:'#ffffff',SolarPlexus:'#ffffff',Root:'#ffffff'};
  const CX=230, CY=230, R_IN=182, R_OUT=214, R_LABEL=198;

  // rotation as the gate wheel -- no separate offset to keep in sync.
  // Sign and gate boundaries genuinely don't align (64 gates vs 12 signs
  // don't divide evenly), which is correct, not a bug.
  const R_ZODIAC_IN=219, R_ZODIAC_OUT=239, R_ZODIAC_LABEL=229;
  const SIGN_COLOR={Aries:'#C0392B',Taurus:'#5B7F45',Gemini:'#4A90A4',Cancer:'#34618A',Leo:'#D2603A',Virgo:'#3F6B4F',Libra:'#6C8FC7',Scorpio:'#2F4858',Sagittarius:'#A6414C',Capricorn:'#556B4F',Aquarius:'#4FA6B0',Pisces:'#6C7FA6'};
  const toXY=(deg,r)=>{const rad=deg*Math.PI/180;return [CX+r*Math.sin(rad),CY-r*Math.cos(rad)];};
  // Wider viewBox than the body/wheel actually need, centered on the same
  // (230,230) the body shapes below are still built around -- just extra
  // margin on all sides so the new zodiac ring (out to R_ZODIAC_OUT) has
  // room without shifting anything that was already correctly centered.
  let svg=`<svg viewBox="-20 -20 500 500" style="display:block;width:100%;height:100%;">`;
  // Zodiac sign ring, drawn first so everything else sits on top of it.
  SIGN_ORDER.forEach((sign,i)=>{
    const d0=i*30;
    const [ax1,ay1]=toXY(d0,R_ZODIAC_IN), [ax2,ay2]=toXY(d0+30,R_ZODIAC_IN), [ax3,ay3]=toXY(d0+30,R_ZODIAC_OUT), [ax4,ay4]=toXY(d0,R_ZODIAC_OUT);
    svg+=`<path d="M${ax1.toFixed(1)},${ay1.toFixed(1)} A${R_ZODIAC_IN},${R_ZODIAC_IN} 0 0 1 ${ax2.toFixed(1)},${ay2.toFixed(1)} L${ax3.toFixed(1)},${ay3.toFixed(1)} A${R_ZODIAC_OUT},${R_ZODIAC_OUT} 0 0 0 ${ax4.toFixed(1)},${ay4.toFixed(1)} Z" fill="${SIGN_COLOR[sign]}" opacity="0.85" stroke="${CREAM}" stroke-width="1"/>`;
    const [lx,ly]=toXY(d0+15,R_ZODIAC_LABEL);
    let faceAngle=d0+15;
    if(faceAngle>180)faceAngle-=360;
    if(faceAngle>90)faceAngle-=180; else if(faceAngle<-90)faceAngle+=180;
    svg+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="800" letter-spacing="0.5" fill="#ffffff" font-family="'Barlow Condensed',sans-serif" transform="rotate(${faceAngle.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})">${sign.slice(0,3).toUpperCase()}</text>`;
  });
  // outer gate wheel -- real order, all 64 segments, active gates for
  // this person picked out in solid blue, inactive left as a thin outline
  svg+=`<circle cx="${CX}" cy="${CY}" r="${R_OUT}" fill="none" stroke="${BLUE}" stroke-width="1.4" opacity="0.85"/>`;
  svg+=`<circle cx="${CX}" cy="${CY}" r="${R_IN}" fill="none" stroke="${BLUE}" stroke-width="1.4" opacity="0.85"/>`;
  const step=360/64;
  // Spokes -- a clean, even sunburst: all 64 rays share ONE center point
  // (CX,CY), representing the full field of possible gates, same as the
  // reference chart. Each spoke uses ITS GATE'S OWN center color (same
  // color as its wedge on the ring), not blue -- blue is reserved
  // exclusively for real channel connections below, so a blue line always
  // means one specific thing on this chart, never two different jobs.
  GATE_WHEEL_ORDER.forEach((g,i)=>{
    const d0=i*step;
    const [sx,sy]=toXY(d0+step/2,R_IN);
    const on=active.has(g);
    const spokeColor=CENTER_COLOR[GATE_CENTER[g]]||INK;
    svg+=`<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${CX}" y2="${CY}" stroke="${spokeColor}" stroke-width="${on?1:0.5}" opacity="${on?0.55:0.18}"/>`;
  });
  GATE_WHEEL_ORDER.forEach((g,i)=>{
    const d0=i*step;
    const [x1,y1]=toXY(d0,R_IN), [x2,y2]=toXY(d0,R_OUT);
    svg+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${BLUE}" stroke-width="1" opacity="0.55"/>`;
    const on=active.has(g);
    // Wedge fill uses the SAME color as whichever center this gate belongs
    // to -- real HD convention, matching the reference chart, not just an
    // on/off blue -- every gate carries its center's color even when
    // undefined (fainter), so the ring itself shows the 9-center grouping.
    const centerName=GATE_CENTER[g];
    const wedgeColor=CENTER_COLOR[centerName]||INK;
    const [ax1,ay1]=toXY(d0,R_IN), [ax2,ay2]=toXY(d0+step,R_IN), [ax3,ay3]=toXY(d0+step,R_OUT), [ax4,ay4]=toXY(d0,R_OUT);
    svg+=`<path d="M${ax1.toFixed(1)},${ay1.toFixed(1)} A${R_IN},${R_IN} 0 0 1 ${ax2.toFixed(1)},${ay2.toFixed(1)} L${ax3.toFixed(1)},${ay3.toFixed(1)} A${R_OUT},${R_OUT} 0 0 0 ${ax4.toFixed(1)},${ay4.toFixed(1)} Z" fill="${wedgeColor}" opacity="${on?0.9:0.13}"/>`;
    const [gx,gy]=toXY(d0+step/2,R_LABEL);
    let faceAngle=d0+step/2;
    if(faceAngle>180)faceAngle-=360;
    if(faceAngle>90)faceAngle-=180; else if(faceAngle<-90)faceAngle+=180;
    // Filled vs. hollow instead of solid-vs-gray -- the same universal
    // "filled = have it, outline = don't" convention as a checked box or
    // a filled star rating, so it reads correctly without a legend.
    const textAttrs=on?`fill="${CENTER_TEXT[centerName]||INK}"`:`fill="none" stroke="${wedgeColor}" stroke-width="0.6"`;
    svg+=`<text x="${gx.toFixed(1)}" y="${gy.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="${on?800:600}" ${textAttrs} font-family="'Barlow Condensed',sans-serif" transform="rotate(${faceAngle.toFixed(1)} ${gx.toFixed(1)} ${gy.toFixed(1)})">${g}</text>`;
  });
  // channel lines, so center shapes + gate labels sit on top
  const pairSeen={};
  CHANNELS.forEach(([a,b])=>{
    const c1=CENTER_SHAPES[GATE_CENTER[a]], c2=CENTER_SHAPES[GATE_CENTER[b]];
    if(!c1||!c2)return;
    const key=[GATE_CENTER[a],GATE_CENTER[b]].sort().join('-');
    const n=pairSeen[key]=(pairSeen[key]||0)+1;
    const off=(n-1)*3; // small parallel offset if 2+ channels share the same center pair
    const aOn=active.has(a), bOn=active.has(b);
    if(!aOn&&!bOn)return; // neither gate present -- genuinely nothing to show
    if(aOn&&bOn){
      // Complete channel: full solid line.
      svg+=`<line x1="${(c1.cx+off).toFixed(1)}" y1="${c1.cy.toFixed(1)}" x2="${(c2.cx+off).toFixed(1)}" y2="${c2.cy.toFixed(1)}" stroke="${LINE_ON}" stroke-width="3"/>`;
    }else{
      // Hanging gate -- researched real convention: only one gate of the
      // channel is active, so the channel itself is NOT complete (the
      // center doesn't get defined by it), but that one real, active gate
      // is genuine information. Real charts show this as a partial line
      // from the active side, stopping short of the other center, rather
      // than either a full line (wrong -- overstates it) or no line at
      // all (wrong -- drops real information the person actually has).
      const from=aOn?c1:c2, to=aOn?c2:c1;
      const midX=from.cx+(to.cx-from.cx)*0.4, midY=from.cy+(to.cy-from.cy)*0.4;
      svg+=`<line x1="${(from.cx+off).toFixed(1)}" y1="${from.cy.toFixed(1)}" x2="${(midX+off).toFixed(1)}" y2="${midY.toFixed(1)}" stroke="${LINE_ON}" stroke-width="1.6" opacity="0.75"/>`;
    }
  });
  Object.entries(CENTER_SHAPES).forEach(([name,shape])=>{
    const on=definedCenters.has(name);
    const pts=shape.pts.map(p=>p.join(',')).join(' ');
    // Outline always carries the center's own color (its "identity"),
    // filled solid when defined, hollow/cream when not -- same filled-vs-
    // outline logic as everything else on this chart, no gray involved.
    svg+=`<polygon points="${pts}" fill="${on?CENTER_COLOR[name]:CREAM}" stroke="${CENTER_COLOR[name]}" stroke-width="2"/>`;
    const gates=CENTER_GATES[name];
    const cols=gates.length>6?4:3;
    const fs=7.5, rowH=8.5;
    const rows=Math.ceil(gates.length/cols);
    const startY=shape.cy-((rows-1)*rowH)/2;
    // A gate can be individually active even when its center isn't fully
    // defined (needs a whole channel, not just one gate) -- so hollow vs
    // filled tracks the GATE's own state, and the hollow stroke color
    // adapts to whatever it's sitting on (the contrast color when the
    // center itself is filled, the center's own color when it's not) so
    // it's never a same-color outline invisible against its own fill.
    const hollowStroke=on?(CENTER_TEXT[name]||'#ffffff'):CENTER_COLOR[name];
    gates.forEach((g,i)=>{
      const row=Math.floor(i/cols), col=i%cols;
      const rowCount=Math.min(cols,gates.length-row*cols);
      const startX=shape.cx-((rowCount-1)*13)/2;
      const gx=startX+col*13, gy=startY+row*rowH;
      const gOn=active.has(g);
      const textAttrs=gOn?`fill="${on?(CENTER_TEXT[name]||INK):CENTER_COLOR[name]}"`:`fill="none" stroke="${hollowStroke}" stroke-width="0.5"`;
      svg+=`<text x="${gx.toFixed(1)}" y="${(gy+2.5).toFixed(1)}" text-anchor="middle" font-size="${fs}" font-weight="${gOn?800:600}" ${textAttrs} font-family="'Barlow Condensed',sans-serif">${g}</text>`;
    });
  });
  svg+='</svg>';
  return svg;
}

function ar(astro){
  if(!astro||astro.error)return apend('Unavailable');
  const planets=astro.planets||[];
  if(!planets.length)return apend('Unavailable');
  const byName={};
  planets.forEach(p=>{const name=p.name;if(name)byName[name]=p;});
  let h='';
  const emitPlanet=p=>{
    const name=p.name, sign=p.sign;
    if(!name||!sign)return;
    const glyph=PLANET_GLYPH[name]?`<span class="glyph" style="color:${PLANET_COLOR[name]||'inherit'}">${PLANET_GLYPH[name]}</span> `:'';
    let signOut=sign;
    if(p.house)signOut+=` \u00b7 House ${p.house}`;
    h+=arow(glyph+name,signOut,ASTRO_KEY[name],sign);
    // 'housecombo' keys are this specific planet in this specific house
    // (e.g. "sun_6") -- not the generic per-house blurb, which reads the
    // same for anyone with any planet there.
    if(p.house)h+=arow('House '+p.house,HOUSE_THEME[p.house]||('House '+p.house),'housecombo',`${ASTRO_KEY[name]}_${p.house}`);
  };
  // lead with the Sun sign -- the placement people actually expect to see first.
  // Ascendant/Midheaven move to their own small section at the bottom instead
  // of leading the card -- they're chart points, not planets in signs.
  if(byName.Sun)emitPlanet(byName.Sun);
  if(byName.Moon)emitPlanet(byName.Moon);
  ASTRO_GROUPS.forEach(([label,names])=>{
    if(label==='Luminaries')return; // Sun/Moon already emitted above
    const rows=names.map(n=>byName[n]).filter(Boolean);
    rows.forEach(emitPlanet);
  });
  if(astro.ascendant?.sign||astro.midheaven?.sign){
    h+=dpsec('Chart Points');
    if(astro.ascendant?.sign)h+=arow('Rising Sign',astro.ascendant.sign,'ascendant',astro.ascendant.sign);
    if(astro.midheaven?.sign)h+=arow('Midheaven',astro.midheaven.sign,'midheaven',astro.midheaven.sign);
  }
  // North/South Node, Chiron, Sirius, Lilith -- these already factor into
  // the Reading (aspects, house themes) but had no place on the visible
  // chart before; a real placement here, not just a mention in the prose.
  const extraPoints=[astro.northNode,astro.southNode,astro.chiron,astro.sirius,astro.lilith].filter(p=>p?.sign);
  if(extraPoints.length){
    h+=dpsec('Other Points');
    extraPoints.forEach(p=>{
      const name=p.name;
      const glyph=PLANET_GLYPH[name]?`<span class="glyph" style="color:${PLANET_COLOR[name]||'inherit'}">${PLANET_GLYPH[name]}</span> `:'';
      let signOut=p.sign;
      if(p.house)signOut+=` · House ${p.house}`;
      h+=arow(glyph+name,signOut,POINT_KEY[name],null);
    });
  }
  return h||apend('Unavailable');
}

function pcCol(label,value,defKey,defNum,specKey){
  const lookupKey=specKey||defKey;
  let specific=lookupKey&&defNum!=null&&NUM_DEFS[lookupKey]&&NUM_DEFS[lookupKey][defNum];
  const general=defKey&&GLOSSARY[defKey]?GLOSSARY[defKey]:null;
  let def=null;
  if(general&&specific)def=`<p>${general}</p><p>${specific}</p>`;
  else if(specific)def=`<p>${specific}</p>`;
  else if(general)def=`<p>${general}</p>`;
  const lbl=def?`<span class="dprl term" data-def="${defKey}">${label}</span>`:`<span class="dprl">${label}</span>`;
  return `<div class="pc-col"><div class="dpr">${lbl}<span class="dprv">${escapeHtml(value)}</span></div>${def?`<div class="dpdef" hidden>${def}</div>`:''}</div>`;
}

function hdr(hd){

  let h='';

  if(hd.authority)core.push(arow('Authority',hd.authority,'hdauthority',normalizeHDAuthority(hd.authority)));

  if(hd.incarnation_cross){h+=dpsec('Cross');h+=arow('Incarnation Cross',hd.incarnation_cross,'hdcross');}

  return h||apend('Unavailable');
}

// ---------- tagline rotation: 3 slides, one visible at a time, same spot ----------
(function(){
  const wrap = document.getElementById('taglineWrap');
  const slides = Array.from(wrap.querySelectorAll('.tagline-slide'));

  // measure the tallest slide for real (not guessed) so the wrapper height
  // never jumps as different-length taglines rotate through
  let maxH = 0;
  slides.forEach(s=>{
    s.style.position = 'static';
    s.style.opacity = '1';
    maxH = Math.max(maxH, s.getBoundingClientRect().height);
  });
  slides.forEach(s=>{
    s.style.position = 'absolute';
    s.style.opacity = '';
  });
  wrap.style.height = maxH + 'px';

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  let idx = 0;
  setInterval(()=>{
    slides[idx].classList.remove('active');
    idx = (idx + 1) % slides.length;
    slides[idx].classList.add('active');
  }, 4200);
})();

async function shareReading(){

// Astrology (col 1) and Human Design (col 3) are clear/transparent, no

// Each card's text list is capped and fades out partway down -- a real
// preview, not the entire chart dumped in place -- so the narrow middle
// column never grows tall enough to throw off the 3-column layout.
function quadItem(nm,sys,rows,preHtml,wheelSvg,rowNum){
  const idx=cardRegistry.push({title:nm+' \u00b7 '+sys,rows,preHtml})-1;
  const wheelHtml=wheelSvg?`<div class="quad-wheel">${wheelSvg}</div>`:'';
  return `<div class="quad-item" style="grid-row:${rowNum};" data-card-idx="${idx}"><div class="quad-title">${escapeHtml(nm)} \u00b7 ${sys}</div>${wheelHtml}<div class="dplist">${rows}</div></div>`;

function reportSlot(names,report,reportError,rowNum){
  const title=`${escapeHtml(names)} \u00b7 Reading`;
  if(!report){
    if(!reportError)return '';
    return `<div class="panel-error" style="grid-column:2;grid-row:${rowNum};"><div class="dp"><div class="dph">${title}</div><div class="dprow"><p class="report-body">Your chart data is ready, but the full reading couldn't be generated right now. Please try again.</p></div></div></div>`;
  }
  const sectionsHtml=(report.sections||[]).map(s=>{
    const head=s.eyebrow?`${escapeHtml(s.eyebrow)} \u2014 ${escapeHtml(s.title)}`:escapeHtml(s.title);
    return `${dpsec(head)}<div class="dprow"><p class="report-body">${escapeHtml(s.body)}</p></div>`;
  }).join('');
  const sigHtml=report.signature?`<div class="dprow"><p class="report-sig">${escapeHtml(report.signature)}</p></div>`:'';
  const fullRows=sectionsHtml+sigHtml;
  const idx=cardRegistry.push({title,rows:fullRows})-1;
  return `<div class="panel-auto" style="grid-column:2;grid-row:${rowNum};" data-card-idx="${idx}"><div class="dp"><div class="dph">Reading</div><div class="dplist"><div class="dprow report-tray-preview"><p class="report-preview">${escapeHtml(names)}</p></div></div></div></div>`;

// One row = Astrology (col 1) / Numerology (col 2) / Human Design
// (col 3), all equal width. Each card gets an EXPLICIT grid-row -- Astrology's wheel

// empty col-1/col-3 slots beside Reading with whatever card comes next in

function render(p1,p2,r,reportErr){
  cardRegistry=[];
  const n1=p1.first+(p1.last?' '+p1.last:'');
  const namesForTitle=p2?(p1.first+' & '+p2.first):n1;

  // Row 1 = P1, row 2 = Reading (middle column only) flanked by the nav
  // buttons in the empty columns 1 and 3 of that same row, row 3 = P2
  // mirrored below -- solo readings just end after Reading, no reserved
  // empty space.
  let h=personRow(p1,1)
    +topBtn('Run Another Reading','resetToForm()',BTN_ICON_REFRESH,'grid-column:1;grid-row:2;')
    +reportSlot(namesForTitle,r,reportErr,2)
    +topBtn('Save / Print Reading','window.print()',BTN_ICON_PRINT,'grid-column:3;grid-row:2;');
  if(p2)h+=personRow(p2,3);
  document.getElementById('mainGrid').innerHTML=h;
  document.getElementById('bottomBtns').innerHTML=topBtn('Share','shareReading()',BTN_ICON_SHARE);

  document.getElementById('loading').style.display='none';
  document.getElementById('resultsWrap').style.display='block';
  document.querySelector('.content').style.display='none';
}

function resetToForm(){
  document.getElementById('resultsWrap').style.display='none';
  document.querySelector('.content').style.display='block';
  document.getElementById('loading').style.display='none';
}

// ---------- form helpers ----------
function vd(d){return /^\d{2}\/\d{2}\/\d{4}$/.test(d);}
const g=id=>document.getElementById(id)?.value?.trim()||'';
function showErr(msg){
  const el=document.getElementById('err');
  el.textContent=msg;
  el.style.display='block';
}
function fmtDate(el){
  let v=el.value.replace(/\D/g,'');
  if(v.length>2&&v.length<=4)v=v.slice(0,2)+'/'+v.slice(2);
  else if(v.length>4)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4,8);
  el.value=v;
}
function fmtTime(el){
  let v=el.value.replace(/\D/g,'');
  if(v.length>2)v=v.slice(0,2)+':'+v.slice(2,4);
  el.value=v;
}
function parseLocation(raw){
  const parts=raw.split(',').map(s=>s.trim()).filter(Boolean);
  return {
    city: parts[0]||'',
    state: parts.length===3?parts[1]:'',
    country: parts.length===3?parts[2]:(parts[1]||'')
  };
}

const W_API='https://know-your-energy.kwdoanchor.workers.dev';

async function generate(){
  document.getElementById('err').style.display='none';
  const p1f=g('p1f'),p1l=g('p1l'),d1=g('p1d');
  if(!p1f||!p1l||!vd(d1)){showErr('Please enter first and last name, and date of birth (MM/DD/YYYY).');return;}
  if(isRelational){
    const p2f=g('p2f'),p2l=g('p2l'),d2=g('p2d');
    if(!p2f||!p2l||!vd(d2)){showErr('Please enter first and last name, and date of birth for Person Two.');return;}
  }
  const loc1=parseLocation(g('p1loc'));
  const p1={
    first:p1f, mid:g('p1m'), last:p1l, dob:d1,
    time: g('p1t') ? g('p1t')+' '+(document.getElementById('p1ap').value) : '',
    city:loc1.city, state:loc1.state, country:loc1.country,
    location: g('p1loc')
  };
  let p2=null;
  if(isRelational){
    const loc2=parseLocation(g('p2loc'));
    p2={
      first:g('p2f'), mid:g('p2m'), last:g('p2l'), dob:g('p2d'),
      time: g('p2t') ? g('p2t')+' '+(document.getElementById('p2ap').value) : '',
      city:loc2.city, state:loc2.state, country:loc2.country,
      location: g('p2loc')
    };
  }
  document.querySelector('.content').style.display='none';
  document.getElementById('loading').style.display='block';
  try{
    const res=await fetch(W_API+'/report',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({rtype:isRelational?'two-person':'individual',relLabel:relType,p1,p2,passEmail:g('pEmail')||undefined})
    });
    const result=await res.json();
    if(!res.ok){
      document.getElementById('loading').style.display='none';
      document.querySelector('.content').style.display='block';
      showErr(result.error||'Something went wrong. Please try again.');
      return;
    }
    p1.numerology=result.p1.numerology;
    p1.astro=result.p1.astrology;
    p1.hd=result.p1.humanDesign;
    if(p2&&result.p2){
      p2.numerology=result.p2.numerology;
      p2.astro=result.p2.astrology;
      p2.hd=result.p2.humanDesign;
    }
    render(p1,p2,result.report,result.reportError);
  }catch(e){
    document.getElementById('loading').style.display='none';
    document.querySelector('.content').style.display='block';
    showErr('Connection error: '+e.message);
  }
}

// ---------- tap-to-expand: cards, term definitions, gate chips ----------
document.addEventListener('click', e=>{
  const insideExpand=e.target.closest('#cardExpandBody');

  // term/gate tap-to-reveal only makes sense once a card is already open --
  // on the small collapsed card, several rows are already visible term
  // labels (e.g. "SUN"), so without this guard a tap meant to open the
  // card could land on one and get silently swallowed instead, making the
  // card feel unresponsive.
  if(insideExpand){
    const term=e.target.closest('.term');
    if(term){
      const def=term.parentElement.nextElementSibling;
      if(def&&def.classList.contains('dpdef')){
        def.hidden=!def.hidden;
        term.classList.toggle('open',!def.hidden);
      }
      return;
    }
    const gate=e.target.closest('.gate-chip');
    if(gate){
      const defBox=gate.closest('.dprow').querySelector('.gate-def');
      const num=gate.dataset.gate;
      document.querySelectorAll('.gate-chip').forEach(c=>c.classList.remove('active'));
      if(defBox.hidden || defBox.dataset.gate!==num){
        gate.classList.add('active');
        defBox.textContent='Gate '+num+' \u2014 '+(GATES[num]||'No description available.');
        defBox.dataset.gate=num;
        defBox.hidden=false;
        // The definition renders below a 3x-per-row grid -- on a phone
        // screen that's frequently off the bottom of the viewport, so a
        // tap can look like it did nothing at all. Bring it into view.
        defBox.scrollIntoView({behavior:'smooth',block:'nearest'});
      }else{
        defBox.hidden=true;
        defBox.dataset.gate='';
      }
      return;
    }
    return;
  }

  const closeExpand=e.target.closest('#cardExpandClose');
  if(closeExpand){
    document.getElementById('cardExpand').classList.remove('open');
    return;
  }

  const card=e.target.closest('.quad-item[data-card-idx], .panel-auto[data-card-idx]');
  if(card){
    const entry=cardRegistry[card.dataset.cardIdx];
    if(entry){
      document.getElementById('cardExpandTitle').textContent=entry.title;
      document.getElementById('cardExpandBody').innerHTML=(entry.preHtml||'')+entry.rows;
      document.getElementById('cardExpand').classList.add('open');
    }
  }
});

</script>
