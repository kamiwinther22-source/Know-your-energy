  mercury:{
    Aries:`With your Mercury in Aries, your mind moves fast and says what it thinks the moment it thinks it — you're a quick, decisive communicator who'd rather speak plainly and move on than deliberate endlessly. That directness makes you easy to understand and hard to stall, but it can also come across as blunt or impatient with people who need more time to process. The lesson is pausing half a beat before you speak, especially when you're frustrated.`,
    Taurus:`With your Mercury in Taurus, you think slowly and deliberately, preferring to fully form an opinion before you voice it — once you've said something, you tend to mean it and stand by it. That steadiness makes your word genuinely trustworthy, but it can also make you slow to update your thinking even when new information calls for it. The growth edge is treating a changed mind as flexibility, not failure.`,
    Gemini:`With your Mercury in Gemini, this placement is fully at home — your mind is quick, curious, and genuinely happiest juggling several ideas or conversations at once, picking up new information almost effortlessly. That mental agility makes you a natural communicator and connector, but it can also mean you skim the surface of a lot of things rather than go deep into any one of them. The lesson is choosing, sometimes, to finish the thought instead of chasing the next one.`,
    Cancer:`With your Mercury in Cancer, you think and communicate through feeling as much as logic — your memory for emotional detail is sharp, and you tend to filter information through "how does this affect the people I care about" rather than pure objectivity. That makes you an intuitive, sensitive communicator, but it can also mean a fact lands differently on a given day depending on your mood, or that you take a neutral comment more personally than it was meant. The growth edge is separating what was actually said from how it made you feel.`,
    Leo:`With your Mercury in Leo, you communicate with real conviction and warmth — you like being genuinely listened to, and your ideas tend to come with confidence and a bit of flair rather than hedging. That certainty makes you persuasive and fun to listen to, but it can also make it hard to hear you were wrong, since it can feel like a blow to your pride rather than just new information. The lesson is separating being right from being respected — you can lose the first without losing the second.`,
    Virgo:`With your Mercury in Virgo, this placement is fully at home — your mind is precise, detail-oriented, and genuinely skilled at spotting what's off or what could be improved, which makes you an excellent editor, analyst, or problem-solver. That precision is a real gift, but it can also tip into over-criticism, both of your own thinking and of other people's less-polished ideas. The growth edge is knowing when "good enough" is actually the more useful answer than "perfect."`,
    Libra:`With your Mercury in Libra, you think in terms of balance, weighing every side of an argument before committing to one, which makes you a genuinely fair-minded and diplomatic communicator. That instinct to see all perspectives is valuable, but it can also leave you stuck in indecision, or so focused on keeping the peace that you soften a truth someone actually needed to hear plainly. The lesson is being willing to land on an opinion, even an unpopular one.`,
    Scorpio:`With your Mercury in Scorpio, your mind digs — you're drawn to what's beneath the surface, uninterested in small talk, and genuinely perceptive about what people aren't saying out loud. That depth makes you an excellent investigator of any kind of truth, but it can also mean you assume hidden motives even when there aren't any, or keep your own thinking guarded until you're certain it's safe to share. The growth edge is voicing a half-formed thought instead of waiting until you're fully certain.`,
    Sagittarius:`With your Mercury in Sagittarius, you think in big, sweeping ideas rather than fine print, and you communicate with an honesty that can be refreshing or blunt depending on who's on the receiving end. That expansive thinking makes you a natural teacher or storyteller, but it can also mean you overlook the detail that actually mattered, or make a promise your follow-through can't quite match. The lesson is pairing your big-picture instinct with enough patience for the specifics.`,
    Capricorn:`With your Mercury in Capricorn, your thinking is structured, practical, and outcome-focused — you'd rather communicate a plan than a feeling, and you tend to take ideas seriously only once they've proven useful. That discipline makes your judgment reliable under pressure, but it can also make you dismissive of ideas (or people) that seem impractical on first pass, when they might just need more time. The growth edge is staying curious about possibilities you can't immediately monetize or execute.`,
    Aquarius:`With your Mercury in Aquarius, your mind runs original and a little ahead of the room — you're drawn to unconventional ideas and genuinely enjoy questioning assumptions everyone else has stopped examining. That originality makes you a real innovator, but it can also make you stubborn about your own theories, or detached enough in conversation that people struggle to feel you're actually engaging with them, not just their ideas. The lesson is letting a conversation be personal, not just intellectual.`,
    Pisces:`With your Mercury in Pisces, you think in images, impressions, and intuition more than hard logic, which gives you real creative and empathetic insight but can make your thinking hard to pin down or explain in a straight line. That intuitive style makes you unusually good at sensing what's true beneath the words, but it can also mean you avoid a difficult conversation rather than have it directly, or lose a fact in translation between what you meant and what you said. The growth edge is grounding an intuition in something concrete enough for others to follow.`

  venus:{
    Aries:`With your Venus in Aries, you love with the same directness you do everything else — pursuit excites you more than being pursued, and you're drawn to people and experiences with real energy and a bit of a challenge to them. That boldness makes romance and attraction feel alive and immediate, but it can also mean your interest cools once the chase is over, or that you push for what you want in a relationship before checking whether the other person is ready. The lesson is staying engaged after the initial spark fades.`,
    Taurus:`With your Venus in Taurus, this placement is fully at home — you love through the senses: touch, food, comfort, physical presence, and you build affection slowly but keep it once it's built. That steadiness makes you a deeply loyal partner and a genuine appreciator of beauty and pleasure, but it can also tip into possessiveness or a reluctance to release a relationship, habit, or comfort long past its useful life. The growth edge is loosening your grip without losing your loyalty.`,
    Gemini:`With your Venus in Gemini, what attracts you most is a good conversation — wit, curiosity, and mental chemistry matter to you as much as physical attraction, and you fall for minds as readily as looks. That intellectual playfulness keeps a relationship interesting, but it can also mean you get restless with a partner who doesn't keep you stimulated, or that you flirt with new ideas and people more than commitment strictly allows. The lesson is finding depth with the person you're already with instead of always the next interesting conversation.`,
    Cancer:`With your Venus in Cancer, you love by nurturing — caring for someone, feeding them, remembering the small things that matter to them, is how you show affection more than words or grand gestures. That devotion makes you an exceptionally warm, protective partner, but it can also mean you get hurt easily by perceived rejection, or hold onto an old attachment long after it's stopped serving you. The growth edge is trusting that love can survive a little distance without becoming abandonment.`,
    Leo:`With your Venus in Leo, you love generously and openly — grand romantic gestures, genuine pride in your partner, and being proud to be seen together all come naturally to you. That warmth makes you a loyal, affectionate partner who makes people feel adored, but it can also mean you need visible appreciation to feel secure, or that your pride gets bruised more easily than you'd admit when love isn't reciprocated with equal drama. The lesson is loving quietly sometimes, with no audience required.`,
    Virgo:`With your Venus in Virgo, you show love through usefulness — fixing something, helping someone improve, taking care of the practical details of a relationship rather than the poetic ones. That devotion is real and often underappreciated, but it can also mean you're overly critical of a partner (or yourself) instead of simply accepting them, and slow to believe you deserve love you haven't somehow earned. The growth edge is receiving affection without needing to justify it first.`,
    Libra:`With your Venus in Libra, this placement is fully at home — partnership itself is central to how you experience love, and you have a natural gift for charm, diplomacy, and creating beauty and harmony in a relationship. That grace makes you an easy, appealing partner, but it can also mean you avoid necessary conflict to keep the peace, or stay in a relationship past its expiration date because being alone feels worse than being unhappy together. The lesson is choosing honesty over harmony when the two conflict.`,
    Scorpio:`With your Venus in Scorpio, you love intensely and completely, with little interest in anything casual — once you're in, you're all in, and you expect the same depth of commitment back. That intensity makes for genuinely transformative, loyal relationships, but it can also tip into jealousy, control, or testing a partner's loyalty in ways that create the very insecurity you're trying to avoid. The growth edge is trusting without needing proof first.`,
    Sagittarius:`With your Venus in Sagittarius, you're drawn to partners who expand your world — different backgrounds, big ideas, a shared sense of adventure — and you need real freedom within a relationship to feel like yourself. That openness keeps love exciting and growth-oriented, but it can also mean you avoid commitment that feels confining, or overpromise more freedom or excitement than you can actually sustain day to day. The lesson is finding a partner who gives you room without mistaking every constraint for a cage.`,
    Capricorn:`With your Venus in Capricorn, you love seriously and for the long term — you're not drawn to fleeting romance so much as a partnership built on mutual respect, shared ambition, and real staying power. That commitment makes you an exceptionally reliable partner, but it can also mean you're slow to show vulnerability, or that you unconsciously treat love as something to be earned through achievement rather than simply given. The growth edge is letting affection be effortless sometimes, not just deserved.`,
    Aquarius:`With your Venus in Aquarius, you're drawn to partners who respect your independence and engage you intellectually — conventional romance interests you less than a real friendship with romantic and creative chemistry layered on top. That originality makes your relationships feel genuinely equal, but it can also create emotional distance, since you may retreat from intensity that feels like it's asking you to lose yourself. The lesson is letting closeness in without treating it as a threat to your freedom.`,
    Pisces:`With your Venus in Pisces, you love with real tenderness and imagination — you're drawn to a kind of soulful, almost boundless connection, and you're capable of genuine, selfless devotion to someone you love. That romantic sensitivity makes you a compassionate partner, but it can also mean you idealize someone before you actually know them, or stay in a relationship that's quietly costing you because leaving feels like abandoning them. The growth edge is loving someone clearly, as they actually are, not just as you imagine them.`

  mars:{
    Aries:`With your Mars in Aries, this placement is fully at home — you act on instinct, immediately and without much hesitation, which makes you a natural first-mover in almost any situation. That drive gives you real courage and initiative, but it can also mean you act before you've thought a decision all the way through, or that your temper flares fast and burns out just as quickly. The lesson is pairing your instinct to move with just enough pause to aim it well.`,
    Taurus:`With your Mars in Taurus, you act slowly and deliberately, building momentum steadily rather than exploding into action — once you're moving, though, you're genuinely hard to stop or redirect. That persistence makes you exceptionally good at finishing what you start, but it can also mean you're slow to act when speed actually matters, or stubborn about a course of action long after it's stopped working. The growth edge is knowing the difference between persistence and refusing to adapt.`,
    Gemini:`With your Mars in Gemini, your drive shows up mentally and verbally more than physically — you assert yourself through argument, wit, and ideas, and you're at your most energized when you have several projects or conversations going at once. That mental restlessness makes you quick and adaptable, but it can also mean your energy scatters across too many things to finish any one of them, or that you win an argument instead of actually resolving it. The lesson is following through on the idea you already started.`,
    Cancer:`With your Mars in Cancer, you act to protect — your drive shows up most clearly when someone or something you love is threatened, and you're capable of real fierceness in defense of family or home. That protective instinct is genuine strength, but it can also mean your assertiveness gets tangled up with emotion, showing up as moodiness or indirect action (guilt, withdrawal) rather than a clear, direct ask. The growth edge is asking for what you want directly instead of hoping it gets noticed.`,
    Leo:`With your Mars in Leo, you act with confidence and flair — you're motivated by pride in what you're doing and energized by recognition for it, which makes you a natural leader who takes initiative visibly rather than quietly. That boldness inspires others to follow you, but it can also mean your ego gets tangled up in being right or being first, making it hard to back down gracefully when you should. The lesson is letting someone else take the credit sometimes without it costing you anything real.`,
    Virgo:`With your Mars in Virgo, you act through precision and preparation rather than raw force — you'd rather do something correctly and efficiently than do it fast, and you take real satisfaction in getting the details exactly right. That care makes your work genuinely reliable, but it can also mean you hold back from acting until conditions are perfect, or turn your critical eye on your own effort so harshly it undercuts your confidence. The growth edge is acting before everything is fully ready.`,
    Libra:`With your Mars in Libra, you act through negotiation and partnership rather than solo force — you're most energized when you're working toward something fair, and direct confrontation genuinely drains you in a way it doesn't drain more combative signs. That diplomacy makes you effective at getting others on board, but it can also mean you avoid necessary conflict, or take too long weighing options while a decisive moment passes you by. The lesson is acting decisively even when it means someone won't be pleased with you.`,
    Scorpio:`With your Mars in Scorpio, this placement is fully at home — your drive is intense and controlled rather than loud, and you're capable of sustaining intense focus and willpower toward a goal far longer than most people can manage. That intensity makes you formidable once committed, but it can also mean you hold onto anger or a grudge well past the point it's useful, or that you manipulate a situation quietly rather than confront it openly. The growth edge is channeling that intensity into the open instead of underground.`,
    Sagittarius:`With your Mars in Sagittarius, you act on enthusiasm and belief — you move fastest toward something you're genuinely excited about or convinced is right, and hesitation isn't really your style. That boldness makes you a natural motivator and adventurer, but it can also mean you commit to something before thinking through the follow-through it requires, or speak more bluntly in the moment than the situation called for. The lesson is pacing your enthusiasm to match the actual size of the commitment.`,
    Capricorn:`With your Mars in Capricorn, you act with discipline and a long-term goal in mind — your drive shows up as patient, sustained effort toward a concrete outcome rather than a burst of impulse. That focus makes you exceptionally effective at achieving what you set out to do, but it can also mean you're overly hard on yourself for a setback, or so focused on the destination that you burn through your own energy getting there. The growth edge is letting effort be enough, even before the result arrives.`,
    Aquarius:`With your Mars in Aquarius, you act on principle — you're motivated by what you believe is right or fair, often for a group or cause bigger than your own immediate interest, and you're willing to break convention to get there. That independence makes you an effective agent of change, but it can also mean you act unpredictably just to avoid feeling boxed in, or get so attached to your own stance that you resist input that could actually improve it. The lesson is staying flexible on the method even while you're firm on the principle.`,
    Pisces:`With your Mars in Pisces, your drive is indirect and intuitive rather than forceful — you act on a feeling or a hunch more readily than a clear plan, and direct confrontation isn't a natural mode for you. That sensitivity can make you an unusually compassionate and creative force when you do act, but it can also mean you avoid asserting yourself directly, letting frustration build until it leaks out sideways instead. The growth edge is turning an intuitive pull into a concrete, stated action.`
  },
  jupiter:{
    Aries:`With your Jupiter in Aries, you grow through boldness — taking the leap, starting the venture, trusting your instinct before you've gathered every piece of information. That confidence tends to open real doors for you, since opportunity often does favor the person willing to move first. The caution worth naming is overconfidence: growth here comes from pairing your instinct to act with just enough planning to see it through.`,
    Taurus:`With your Jupiter in Taurus, you grow through patience and accumulation — steady effort, tangible resources, and a genuine appreciation for life's pleasures tend to expand your world more than any single dramatic leap. That grounded approach to growth means what you build tends to last, but it can also tip into excess, whether that's material overindulgence or simply resisting change that would actually serve your expansion. The lesson is trusting that some growth requires letting go of something comfortable first.`,
    Gemini:`With your Jupiter in Gemini, you grow through learning, conversation, and the sheer accumulation of information and connections — the more you know and the more people you talk to, the more your world expands. That intellectual appetite makes you a lifelong learner, but it can also mean you gather knowledge broadly without ever going deep enough to master any one thing. The growth edge is letting curiosity lead you somewhere specific, not just everywhere at once.`,
    Cancer:`With your Jupiter in Cancer, you grow through emotional security and home — the more rooted and cared-for you feel, the more capacity you have to expand outward into the rest of your life. That connection between home and growth means your family or chosen family is often central to your biggest opportunities, but it can also mean you overextend yourself caring for others as your own way of feeling significant. The lesson is letting your own growth matter as much as everyone else's comfort.`,
    Leo:`With your Jupiter in Leo, you grow through genuine self-expression and confidence — the more fully you let yourself be seen doing what you love, the more opportunity tends to find you. That generosity of spirit makes you naturally inspiring to others, but it can also tip into overconfidence or a need for the spotlight that outpaces your actual readiness. The growth edge is being generous with the credit even as your own light gets brighter.`,
    Virgo:`With your Jupiter in Virgo, you grow through skill, service, and getting the details right — mastery of a craft or genuine usefulness to others tends to be what actually expands your opportunities, more than any grand gesture. That practical approach to growth means your success is well-earned and durable, but it can also mean you undersell your own accomplishments, treating "good enough" as never quite enough. The lesson is recognizing your own expertise instead of always finding one more thing to fix first.`,
    Libra:`With your Jupiter in Libra, you grow through partnership and fairness — collaboration, diplomacy, and relationships built on genuine mutual benefit tend to be where your biggest opportunities show up. That relational instinct makes you skilled at building the alliances that actually move things forward, but it can also mean you avoid growth that requires a decision someone else might not like. The growth edge is trusting that fairness sometimes means disappointing someone anyway.`,
    Scorpio:`With your Jupiter in Scorpio, you grow through depth and transformation — the willingness to face what's hidden, uncomfortable, or intense tends to be exactly what expands your world, even when it doesn't feel like growth in the moment. That capacity for real change makes your development genuinely profound rather than superficial, but it can also mean you resist opportunities that don't come wrapped in intensity or high stakes. The lesson is trusting that not every expansion has to come from a crisis.`,
    Sagittarius:`With your Jupiter in Sagittarius, this placement is fully at home — your growth comes through exploration, belief, and a genuine appetite for the bigger picture, whether that's travel, philosophy, education, or simple optimism about what's possible. That expansiveness tends to bring real, visible good fortune, but it can also tip into overconfidence, overcommitment, or promising more than you can actually deliver. The growth edge is grounding your big vision in follow-through.`,
    Capricorn:`With your Jupiter in Capricorn, you grow slowly and structurally — steady, disciplined effort toward a concrete, long-term goal tends to be what actually expands your world, more than any lucky break. That patient approach means your success tends to be earned and durable, but it can also mean you undervalue growth that doesn't come with visible achievement attached, or delay enjoying your progress until some future finish line. The lesson is letting the climb itself count as success, not just the summit.`,
    Aquarius:`With your Jupiter in Aquarius, you grow through originality and community — unconventional ideas, causes bigger than yourself, and genuine connection to a group of like-minded people tend to be where your biggest opportunities show up. That independence of thought makes your growth genuinely innovative, but it can also mean you resist good opportunities simply because they look too conventional, or stay detached from a support system that could actually help you further. The growth edge is letting a group's success matter as much as your own originality.`,
    Pisces:`With your Jupiter in Pisces, this placement is fully at home — you grow through compassion, imagination, and a willingness to trust something you can't fully explain, with intuition, spirituality, or creative inspiration expanding your world more than a strictly logical plan would. That openness makes your growth feel genuinely meaningful and connected to something larger, but it can also mean you avoid the practical follow-through an opportunity needs, or overextend yourself helping others at your own expense. The lesson is pairing your faith in the bigger picture with a concrete next step.`
  },
  saturn:{
    Aries:`With your Saturn in Aries, your hardest lessons involve patience and self-assertion — you likely had to learn, the hard way, that acting purely on impulse doesn't get you as far as impulse plus discipline does. Life tends to test your confidence and independence early, asking you to earn the boldness that comes naturally to others. The mastery available here is real, hard-won courage — the kind that's been tested, not just assumed.`,
    Taurus:`With your Saturn in Taurus, your hardest lessons involve security and self-worth — you may have faced real material or financial hardship, or simply grew up believing your worth was tied to what you could produce or accumulate. That difficulty tends to build genuine resilience and a real, unshakeable relationship to stability once you've worked through it, rather than the more casual security others take for granted. The mastery here is trusting your own worth independent of what you own.`,
    Gemini:`With your Saturn in Gemini, your hardest lessons involve communication and confidence in your own mind — you may have felt dismissed, misunderstood, or unsure that your ideas were worth voicing, especially early on. That struggle tends to build unusually disciplined, precise thinking once you push through it, since you learn not to speak until you're genuinely sure of what you mean. The mastery available here is trusting your own voice without needing outside validation first.`,
    Cancer:`With your Saturn in Cancer, your hardest lessons involve home and emotional security — you may have grown up in a household that felt unstable, emotionally withheld, or where you had to be the responsible one before you were ready. That early weight tends to build real emotional resilience and an eventual gift for creating the stable home you didn't necessarily have. The mastery here is letting yourself be nurtured too, not just the one who provides it.`,
    Leo:`With your Saturn in Leo, your hardest lessons involve self-expression and being seen — you may have felt overlooked, criticized for taking up space, or unsure that your creativity or leadership was actually welcome. That struggle tends to build a hard-won, deeply earned confidence once you push through it, rather than the more effortless charisma other placements carry. The mastery here is claiming the spotlight you've genuinely earned, without waiting for permission.`,
    Virgo:`With your Saturn in Virgo, your hardest lessons involve perfectionism and self-worth tied to productivity — you likely learned early that mistakes carried real consequences, which can build a harsh inner critic that's difficult to quiet even after you've clearly proven your competence. That discipline tends to make you exceptionally skilled and reliable, but sometimes you do not separate your value from your output.`,
    Libra:`With your Saturn in Libra, your hardest lessons involve relationships and fairness — you may have learned early that partnership requires real work, compromise, and sometimes disappointment, rather than the effortless harmony it can look like from the outside. That struggle tends to build unusually mature, resilient relationships once you push through the lesson, built on real commitment rather than just chemistry. The mastery here is trusting a relationship can survive honesty, not just pleasantness.`,
    Scorpio:`With your Saturn in Scorpio, your hardest lessons involve trust, power, and facing what's hidden — you may have experienced betrayal, loss, or situations that forced you to confront intensity most people get to avoid, well before you felt ready. That difficulty tends to build genuine emotional depth and resilience, a hard-won capacity to face what others flinch from. The mastery here is using that depth to heal, rather than to guard yourself so tightly nothing gets through.`,
    Sagittarius:`With your Saturn in Sagittarius, your hardest lessons involve belief and meaning — you may have had your faith, worldview, or optimism tested hard, forced to build a philosophy that could actually withstand real disappointment rather than one that just sounded good. That struggle tends to build a grounded, tested wisdom once you work through it, more durable than untested optimism. The mastery here is holding real conviction without needing certainty first.`,
    Capricorn:`With your Saturn in Capricorn, this placement is fully at home — you were likely given real responsibility early, whether by circumstance or your own instinct, and discipline, structure, and achievement come to you almost by necessity rather than choice. That maturity tends to bring genuine, lasting authority and competence over time, but the growth work is not letting your entire sense of worth ride on constant achievement. The mastery here is success that includes rest, not just relentless climbing.`,
    Aquarius:`With your Saturn in Aquarius, your hardest lessons involve belonging and individuality — you may have felt like an outsider, different from your peers in a way that was hard to resolve, forced to build your own framework rather than simply adopting one. That struggle tends to build genuine, principled independence once you work through it, the kind that doesn't need the group's approval to hold steady. The mastery here is finding real community without sacrificing what makes you distinct.`,
    Pisces:`With your Saturn in Pisces, your hardest lessons involve boundaries and faith — you may have struggled to tell where you end and someone else begins, or felt disillusioned when reality didn't match the ideal you'd imagined. That struggle tends to build a hard-won, realistic compassion once you work through it — care for others that includes care for yourself. The mastery here is staying open-hearted without dissolving your own limits in the process.`
  },
  uranus:{
    Aries:`Uranus was in Aries from 1927–1935, and again 2010–2018, making this a generational placement, not a personal quirk — everyone born in either window shares it. That generation broke from old models through bold, sudden self-assertion rather than slow reform; the individual thread in your own chart is a real need to define yourself on your own terms, sometimes through abrupt changes of direction that catch the people around you off guard.`,
    Taurus:`Uranus was in Taurus from 1935–1942, and again 2018–2026, so this reflects your generation more than it singles you out. That generation reshaped inherited assumptions about money, ownership, and material security at scale; personally, it tends to surface as sudden shifts in what actually feels secure to you, or an unconventional relationship to comfort and possessions.`,
    Gemini:`Uranus entered Gemini in April 2026 (previously 1942–1949) — if you're one of the very first people born into this window, or part of the earlier one, this is a generational placement more than an individual one. That generation reinvents how information and ideas move; personally, it tends to show up as a restless, quick mind that gets bored fast and is drawn to unconventional ways of thinking and connecting.`,
    Cancer:`Uranus was in Cancer from 1948–1956, a generational placement shared by everyone born in that window. That generation challenged traditional models of home and family; personally, it tends to surface as an unpredictable relationship to home, or a need for emotional independence that doesn't fit neatly into conventional family expectations.`,
    Leo:`Uranus was in Leo from 1955–1962, a generational placement, not a personal one. That generation reshaped ideas about self-expression and individuality toward something more radical and authentic; personally, it tends to show up as an unconventional creative streak, or a need to express yourself in ways that don't follow anyone else's script.`,
    Virgo:`Uranus was in Virgo from 1961–1968, shared by everyone born in that window. That generation saw technology and new methods disrupt how people actually labor and care for their bodies; personally, it tends to surface as an unconventional relationship to routine, health, or work, drawn to methods that don't fit standard advice.`,
    Libra:`Uranus was in Libra from 1968–1975, a generational placement. That generation questioned traditional models of marriage, commitment, and justice; personally, it tends to show up as an unconventional approach to relationships, needing real independence within partnership rather than a fixed structure.`,
    Scorpio:`Uranus was in Scorpio from 1974–1981, shared by everyone born in that window. That generation disrupted institutions built on secrecy or control around power and sexuality; personally, your relationship to power, control, or intimacy tends to shift through sudden events rather than gradual choice.`,
    Sagittarius:`Uranus was in Sagittarius from 1981–1988, a generational placement. That generation questioned inherited philosophies, religions, and institutions of higher learning; personally, it tends to show up as an evolving belief system, drawn to ideas that break from whatever framework you were raised in.`,
    Capricorn:`Uranus was in Capricorn from 1988–1996, shared by everyone born in that window. That generation disrupted traditional structures of power, government, and established institutions; personally, it tends to surface as an unconventional relationship to authority — resisting it, or rebuilding it your own way.`,
    Aquarius:`Uranus was in Aquarius from 1996–2003 — and this is the one sign where Uranus is genuinely at home, its own ruling sign, not just passing through. That generation is wired especially strongly for innovation and group-oriented change; personally, it tends to show up as a real pull toward originality, humanitarian causes, and discomfort with anything that feels arbitrarily traditional.`,
    Pisces:`Uranus was in Pisces from 2003–2011, a generational placement. That generation disrupted old religious and creative institutions in favor of something more fluid and inclusive; personally, it tends to surface as an unconventional spiritual or creative path, drawn to ideas and practices that blend and dissolve traditional boundaries.`

  neptune:{
    Aries:`Neptune entered Aries in January 2026 — this is genuinely new ground; the last time Neptune was here was the 1860s–70s, so there's no living generation to compare yours to yet. What's real regardless: Neptune's placement reflects a generation's collective imagination, not an individual trait, so treat any "personal" reading of this one as provisional until the pattern is actually established.`,
    Taurus:`Neptune was in Taurus 1874–1889 and returns 2038–2052 — outside any currently living person's birth window. If you're reading this ahead of that future transit, this placement will reflect a generation's collective dream about material stability and simplicity, not an individual trait.`,
    Gemini:`Neptune was in Gemini 1887–1902, before anyone alive today was born — there's no living generation with this natal placement, so there's nothing accurate to say about it personally.`,
    Cancer:`Neptune was in Cancer from 1901–1916, a generational placement shared by everyone born in that window (few, if any, still living). That generation's collective dream centered on home, family, and what emotional safety was supposed to look like.`,
    Leo:`Neptune was in Leo from 1915–1929, a generational placement. That generation's collective dream centered on fame, creativity, and the myth of the extraordinary, larger-than-life self; personally, it tends to surface as an idealized picture of your own specialness or destiny, worth grounding in what you've actually built.`,
    Virgo:`Neptune was in Virgo from 1929–1943, shared by everyone born in that window. That generation's collective dream centered on perfect systems, clean living, and selfless usefulness; personally, it tends to show up as an idealized, sometimes unattainable standard for your own daily habits or usefulness to others.`,
    Libra:`Neptune was in Libra from 1942–1956, a generational placement. That generation's collective dream centered on soulmates and perfect fairness; personally, it tends to surface as an idealized picture of love that real, imperfect relationships struggle to match — worth checking against who a partner actually is.`,
    Scorpio:`Neptune was in Scorpio from 1956–1970, shared by everyone born in that window. That generation's collective fascination centered on intensity, secrecy, and radical transformation; personally, it tends to show up as a dramatized picture of your own crises, worth grounding in what's actually happening rather than the story about it.`,
    Sagittarius:`Neptune was in Sagittarius from 1970–1984, a generational placement. That generation's collective dream centered on utopian philosophies and grand quests for truth; personally, it tends to surface as an idealized picture of a belief system or a journey, worth checking against practical, lived experience.`,
    Capricorn:`Neptune was in Capricorn from 1984–1998, shared by everyone born in that window. That generation reckoned with whether traditional power structures actually deliver what they promise; personally, it tends to show up as an idealized or disillusioned relationship to achievement and authority.`,
    Aquarius:`Neptune was in Aquarius from 1998–2012, a generational placement. That generation's collective dream centered on technology and utopian community — what innovation and connection could make possible for everyone at once; personally, it tends to surface as an idealized picture of group belonging, worth grounding in what a community can actually deliver.`,
    Pisces:`Neptune was in Pisces from 2011–2026 — and this is the one sign where Neptune is genuinely at home, its own ruling sign. That generation carries an unusually strong collective imagination and compassion; personally, it tends to show up as a real intuitive or spiritual sensitivity, powerful when grounded, disorienting when it isn't.`

  pluto:{

    Gemini:`Pluto was in Gemini from 1882–1914, a generational placement (few, if any, still living). That generation reckoned with how information itself moves and who controls it, at the dawn of mass media.`,

  ascendant:{
    Aries:`With your Ascendant in Aries, you walk into a room already in motion — people read you as direct, energetic, and quick to act before you've said a word, since your Rising sign is the automatic front door other people meet first. That immediacy makes you easy to trust in a crisis and hard to mistake for passive, but it can also read as impatient or combative if you don't check your pace against the room's. The growth edge is letting a first reaction cool for a beat before it becomes your whole approach.`,
    Taurus:`With your Ascendant in Taurus, you come across as calm, physically present, and unhurried — your automatic manner is steady rather than quick, so people sense someone who isn't easily rattled before they know anything else about you. That groundedness makes you a reassuring presence in tense situations, but it can also read as stubborn or slow to engage when the moment actually calls for speed. The growth edge is letting your pace shift without treating the shift itself as a threat.`,
    Gemini:`With your Ascendant in Gemini, your automatic mode is curious and conversational — you meet new situations by asking questions, picking up cues fast, and adapting your approach almost as quickly as the room changes. That quickness makes you easy to talk to and hard to bore, but it can also read as inconsistent or scattered if people can't tell which version of you they're getting. The growth edge is letting one thread hold your attention long enough for people to actually know where you land.`,
    Cancer:`With your Ascendant in Cancer, your first move with anything unfamiliar is protective — you take a beat to read whether a person or situation is safe before you let your guard down, which can look like shyness or reserve to people meeting you for the first time. That instinct keeps you from being caught off guard, but it can also mean you come across as harder to reach than you actually are once someone's earned your trust. The growth edge is showing warmth earlier, on your own terms, instead of waiting to be proven safe.`,
    Leo:`With your Ascendant in Leo, you arrive with warmth and presence — your automatic manner carries confidence and a bit of natural performance, so people notice you before you've done anything to earn the attention. That radiance makes you a magnetic first impression and genuinely generous once people are in your orbit, but it can also read as attention-seeking if the warmth isn't backed by real interest in the people around you. The growth edge is letting the spotlight rest on someone else without it costing you anything.`,
    Virgo:`With your Ascendant in Virgo, your automatic mode is observant and a little reserved — you take stock of a new situation before you commit to a reaction, and your first move is usually to notice what's useful or what needs fixing rather than to perform. That precision makes you come across as capable and detail-oriented from the first meeting, but it can also read as overly critical or hard to relax around if your observing tips into visible judgment. The growth edge is letting a first impression be warm before it's useful.`,
    Libra:`With your Ascendant in Libra, you meet new people and situations by looking for the balance point — your automatic manner is polite, considerate, and quick to smooth over friction before it's even named. That grace makes you an easy, likable first impression that puts other people at ease, but it can also read as people-pleasing or indecisive if you're adjusting yourself to match the room rather than stating your actual position. The growth edge is letting your first move be honest, not just agreeable.`,
    Scorpio:`With your Ascendant in Scorpio, your automatic manner is guarded and intense — you size up a new situation before you reveal much of yourself, which gives you a magnetic, slightly unreadable presence that people notice even when they can't say why. That reserve protects you from being caught off guard, and it's doing exactly what it's built to do — people read it as intimidating or secretive because it genuinely is hard to get past, not because something's being done wrong. What changes over time isn't how much you show a stranger; it's who eventually stops being one.`,
    Sagittarius:`With your Ascendant in Sagittarius, you show up open, enthusiastic, and a little larger than life — your automatic manner is friendly and direct, and you tend to say what you actually think before you've calculated how it'll land. That candor makes you an energizing, refreshing first impression, but it can also read as tactless or restless if your honesty arrives without much cushioning. The growth edge is pairing your first instinct to speak freely with a beat of awareness for who's listening.`,
    Capricorn:`With your Ascendant in Capricorn, you come across as composed, competent, and older than your years — your automatic manner carries a natural reserve and seriousness, so people tend to trust you with responsibility before you've had to prove yourself. That gravity makes you look reliable from the first handshake, but it can also read as cold or unapproachable if the reserve never lifts. The growth edge is letting people see you before you've accomplished something worth showing them.`,
    Aquarius:`With your Ascendant in Aquarius, your automatic manner is friendly but a step removed — people sense someone original and easy to talk to, but also someone who's genuinely hard to get a full read on right away. That mix makes you memorable and refreshingly unconventional as a first impression, but it can also read as detached if your friendliness never quite deepens into closeness. The growth edge is letting a first meeting be personal, not just pleasant.`,
    Pisces:`With your Ascendant in Pisces, you come across as soft, imaginative, and quietly perceptive — your automatic manner absorbs the mood of a room before you've said anything, and people often sense you're gentler or more sensitive than you'd claim to be. That receptivity makes you an easy, non-threatening first impression that people open up to quickly, but it can also read as elusive or hard to pin down if you blend into whatever's around you rather than showing a clear edge. The growth edge is letting your first impression include something definite about who you actually are.`
