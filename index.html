<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know Your Energy — Landing</title>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
/* Background: black + starfield-style sparkle glints (removed below) was
   a direct repeat of the "dark/night-sky/cosmic" theme her standing
   rules reject forcefully, every time, wherever it's shown up. Real
   light technique instead: a wisp SVG layer (blurred + turbulence-
   distorted organic shapes in layered white/ivory/pearl/blush tones),
   sized to the actual document height in JS, built near the bottom of
   this file. All entry-page text colors below are flipped from white
   (built for the black version) to dark ink to match. */
body{
  /* Base font for the whole entry page is the typewriter face now --
     explicit per-element font-family overrides below are the only
     exceptions, and there's exactly one: the title (.brand, Alex
     Brush). Results-page-only classes (.dp*, .report-*, .gate-*, etc.,
     further down this file) keep their own separate typography and are
     untouched -- that's a different page with its own settled rules. */
  font-family:'Special Elite',monospace;overflow-x:hidden;position:relative;
  background-color:#f8f8fa;
  padding:0.8rem 1rem 1.3rem;
  display:flex;flex-direction:column;align-items:center;
  color:#000000;
}
#bgWisps{position:absolute;top:0;left:0;width:100%;z-index:0;pointer-events:none;display:block;}
/* min-width:0 overrides flexbox's automatic minimum size -- without it,
   the title's nowrap text was forcing this whole flex item (and
   everything inside it) wider than the actual phone viewport, which is
   what was cutting off the numerology row and crowding the two chart
   sections together on a real device. This is the real fix; the
   font-size floor below is the other half of it. */
.content{width:100%;max-width:420px;min-width:0;position:relative;z-index:1;}

/* One shared "emphasis label" role -- same family/weight/case/tracking
   used everywhere something needs to read as a short emphasized label
   (section titles, the lead key point), instead of each spot inventing
   its own one-off size. Real type system: hero (tagline) / label (this)
   / accent (Special Elite, used once, sparingly) / body (DM Sans) --
   four deliberate roles instead of a different treatment per element. */
.sys-section-title{
  font-family:'Special Elite',monospace;font-weight:400;font-size:0.85rem;
  letter-spacing:0.05em;text-transform:uppercase;color:#000000;
  text-align:center;margin-bottom:0.5rem;
}
/* "Pop" without color -- a thin rule above/below (real ink, not blue),
   a little extra letter-spacing, and a soft embossed text-shadow for
   dimension instead of a flat, flush-with-the-page line of type. */
.sys-section-sub{
  font-family:'Special Elite',monospace;font-weight:400;font-size:1.1rem;
  letter-spacing:0.01em;color:#000000;text-align:center;margin:0.75rem auto 0;
  width:fit-content;max-width:250px;padding:0.35rem 0;
  border-bottom:1px solid rgba(23,22,28,0.3);
}
/* ---------- swipeable carousel: numerology / astrology / human design
   share ONE raised platform now instead of three stacked sections --
   swipe left/right (or tap a dot) moves between them. This also solves
   the vertical-space problem: the platform is only as tall as the
   single tallest panel, not all three stacked, which is what leaves
   real room above the form. Height is set from real measured content
   (see the JS below) rather than a guessed fixed number so it's exactly
   as tall as it needs to be, no more. */
/* Unboxed -- sits directly on the page background now, no card/blur/
   border/shadow container. */
.chart-carousel{
  position:relative;padding:0.6rem 0;margin-bottom:0.4rem;
}
/* Native horizontal scroll-snap instead of hand-rolled drag math -- the
   custom Pointer Events version got the numerology->astrology swipe
   right on some devices but got stuck (jumped a slide immediately, then
   wouldn't swipe back) on hers. Letting the browser's own touch/scroll
   engine own the gesture is the reliable fix, not another round of
   custom threshold tuning. */
.carousel-track{
  display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;
}
.carousel-track::-webkit-scrollbar{display:none;height:0;}
.carousel-slide{
  flex:0 0 100%;width:100%;min-width:0;box-sizing:border-box;padding:0 1.1rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  scroll-snap-align:start;scroll-snap-stop:always;
}
.carousel-dots{display:flex;justify-content:center;gap:0.5rem;margin-top:0.5rem;}
.carousel-dots .dot{
  width:8px;height:8px;border-radius:50%;background:rgba(23,22,28,0.28);
  border:none;padding:0;cursor:pointer;transition:background 0.2s ease,transform 0.2s ease;
}
.carousel-dots .dot.active{background:#000000;transform:scale(1.4);}
/* Swipe symbol above the dots instead of side arrow buttons -- a small
   left-right glyph that reads as "swipe here" without sitting on top
   of the carousel content itself. */
.swipe-hint{display:flex;align-items:center;justify-content:center;gap:0.3rem;margin-top:0.35rem;color:#000000;opacity:0.55;}
.swipe-hint svg{width:22px;height:14px;}
/* Back to a plain grid, two rows of six, question between them --
   the circle/spiral/stadium experiments are done. */
/* Bleeds past the carousel-slide's own 1.1rem side padding (negative
   margin cancels it) so the tiles are the one element on this page that
   actually reaches toward the true screen edge instead of sitting
   politely centered in the same box as everything else -- real scale/
   weight contrast between the hero visual and the rest of the page,
   not just a bigger version of the same centered stack. */
.num-strip-row{display:grid;grid-template-columns:repeat(6,1fr);gap:0.5rem 0.32rem;width:calc(100% + 1.7rem);max-width:none;margin:0 -0.85rem;}
.num-tile-lg{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;}
.num-tile-lg .swatch{
  position:relative;overflow:hidden;cursor:pointer;width:100%;aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center;border:0.5px solid;border-radius:9px;
  /* Paint, not colored pencil: flat, fully opaque, saturated fill (no
     gradient wash across the surface -- that read as streaky/uneven,
     the way pencil coverage does). Shine comes entirely from the
     highlight below, not from blending the base color itself. */
  box-shadow: 0 5px 10px rgba(20,55,95,0.4);
}
.num-tile-lg .swatch::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  /* Real shine: a crisp, high-contrast, completely unblurred reflection
     -- no feathered/soft edge anywhere. A soft blurred highlight is
     what was reading as hazy/unsmooth; a hard-edged bright shape is
     what an actual glossy/lacquered surface looks like. */
  background:radial-gradient(ellipse 34% 20% at 30% 24%, #ffffff 0%, #ffffff 55%, rgba(255,255,255,0) 100%);
}
.num-tile-lg .n{
  position:relative;z-index:1;font-family:'Special Elite',monospace;font-weight:400;
  color:#ffffff;text-shadow:0 1px 2px rgba(0,0,0,0.45);
  font-size:clamp(1rem,6vw,1.7rem);line-height:1;
}
/* Special Elite only ships one real weight -- font-weight alone does
   nothing, the browser has no bold cut to switch to. A thin black
   text-stroke is what actually thickens the letterforms here, the same
   way the button label's outline-shadow above does real work rather
   than a weight value that silently no-ops. */
.num-tile-lg .lbl{margin-top:0.32rem;font-family:'Special Elite',monospace;font-weight:400;font-size:0.68rem;line-height:1.2;letter-spacing:0.01em;text-transform:uppercase;color:#000000;-webkit-text-stroke:0.4px #000000;text-align:center;overflow-wrap:break-word;word-break:break-word;hyphens:auto;}
/* No filter here anymore -- drop-shadow on this container was blurring
   EVERYTHING inside it, including the text labels, not just the
   shapes/planets it was meant for. A CSS/SVG filter applies to every
   child, text included -- that softened edge is what actually made the
   words hard to read, not eyesight or the font. Individual shapes still
   get their own lift via the num-tile-lg filter and their own gradient
   shading; text stays completely unfiltered so it's genuinely crisp. */
.chart-graphic{width:100%;position:relative;margin-top:0.3rem;}
.chart-graphic svg{display:block;width:100%;height:auto;}

/* ---------- title ---------- */
.brand-row{position:relative;text-align:center;margin-bottom:0.35rem;padding:0 1.6rem;}
/* Title color: YInMn Blue. #1C2CA9 is pixel-sampled from her own reference
   photo of the actual pigment (mean of the well-lit, fully-saturated pixels
   across the pile, excluding shadow crevices and blown highlight) rather
   than a documented/"verified" hex -- the ask was to match how the color
   looks in that photo, not to match a published reference value. A flat
   single fill read as noticeably flatter than the reference photo's own
   natural light/shadow variation, so this reuses the exact same gradient-
   text technique already used (and approved) on the tagline below --
   same hue family, deep-anchor + bright-accent + deep-anchor -- rather
   than inventing a new effect. This is a tonal gradient on shaped text,
   not a simulated directional-light sheen across a flat surface (the
   diagonal-sheen effect that was already tried and rejected elsewhere in
   this file was the latter, on a full-page background -- a different,
   much harder problem this isn't attempting). */
.brand{
  font-family:'Alex Brush',cursive;font-weight:400;line-height:1;
  /* Floor lowered from 2.3rem: on real phones narrower than ~370px CSS
     px, that floor was wider than the viewport itself (title always one
     line, so it can't wrap -- it has to actually shrink to fit instead).
     Still one line, still Alex Brush, just allowed to keep scaling down
     on the narrowest screens instead of hitting a hard floor early. */
  font-size:clamp(1.7rem,10vw,3.4rem);white-space:nowrap;
  /* Back to the dark-anchor version -- the brightened stops above were
     built for contrast against a black page; on the real light
     background they'd wash out instead. */
  background:linear-gradient(100deg,#0F1758 0%,#5364D6 35%,#8A96EE 50%,#5364D6 65%,#0F1758 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}


/* ---------- tagline / toggle ---------- */
/* Made deliberately the largest thing on the page now -- bigger than the
   title -- since it's the one line that can actually say what this is,
   where the title is just the name. */
.tagline-wrap{position:relative;max-width:400px;margin:0 auto 0.7rem;}
/* Smaller + tighter line-height than before: at the old clamp(...,2.5rem)
   ceiling this wrapped to 5 lines and became the single tallest thing on
   the page, which is the real reason the page read as "dropping" no
   matter how much margin got trimmed elsewhere -- margins were never
   the biggest mass here, this block was. Still clearly the largest body
   text on the page, just not five-lines-of-it large. text-stroke adds
   real weight the same way it does on the tile labels below -- this
   font has no separate bold cut for font-weight to switch to. */
.tagline-slide{
  position:absolute;top:0;left:0;width:100%;
  text-align:center;font-family:'Special Elite',monospace;font-size:clamp(1.4rem,7.6vw,2.05rem);line-height:1.16;font-weight:400;letter-spacing:0;
  -webkit-text-stroke:0.55px currentColor;
  opacity:0;transition:opacity 0.7s ease;pointer-events:none;
}
.tagline-slide.active{opacity:1;pointer-events:auto;}
/* Same shiny-gradient-text technique as the title (deep anchor + bright
   same-hue accent + deep anchor), but in gold, not blue -- directly under
   a blue title, a blue tagline didn't stand out from it, and the two
   taglines no longer have a reason to be different colors from each
   other (that made sense when they were 3 distinct pitches; now they're
   one statement + one question in the same voice). Gold already has an
   established role on this page (title-glint sparkles, numerology tile
   accents), so this reuses an existing palette color rather than
   introducing a new one. Contrast verified against this page's
   background (#fbf8f0): anchor tone 10.94:1, brightest accent tone
   4.75:1 -- both clear the same floor the blue version was held to. */
.tagline-slide.c-gold{
  /* Plain black placeholder for now -- not settled on gold. Final
     treatment is most likely going to be a cursive font of some kind,
     not this weight/style -- holding off on that until it's decided. */
  color:#000000;
}
@media(prefers-reduced-motion:reduce){.tagline-slide{transition:none;}}
.toggle-row{display:flex;align-items:center;justify-content:center;gap:0.35rem;margin-bottom:0.45rem;font-family:'Special Elite',monospace;font-weight:400;font-size:0.56rem;letter-spacing:0.02em;text-transform:uppercase;color:#000000;}
.tog-lbl{cursor:pointer;color:#000000;transition:color 0.2s;user-select:none;}
.tog-lbl.active{color:#000000;}
.toggle-pill{position:relative;width:32px;height:17px;border-radius:9px;background:#c7cbc0;box-shadow:inset 0 1px 3px rgba(40,45,30,0.3);cursor:pointer;transition:background 0.2s;}
.toggle-pill::after{content:'';position:absolute;top:1.5px;left:1.5px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#e9dbbd 60%,#c6b395 100%);box-shadow:0 1px 2px rgba(0,0,0,0.3);transition:left 0.2s;}
.toggle-pill.on{background:#000000;}
.toggle-pill.on::after{left:16.5px;}

/* ---------- relationship-type chips (Relational mode only) ---------- */
.rel-row{display:flex;flex-wrap:wrap;gap:0.35rem;justify-content:center;margin-bottom:0.7rem;}
.rel-chip{font-family:'Special Elite',monospace;font-size:0.6rem;font-weight:400;padding:0.28rem 0.6rem;border-radius:20px;border:1.3px solid #000000;background:transparent;color:#000000;cursor:pointer;transition:background 0.15s,color 0.15s;}
.rel-chip:hover{background:rgba(0,0,0,0.08);}
.rel-chip.active{background:#000000;color:#ffffff;}
.rel-chip.active:hover{background:#000000;}

/* ---------- bottom two-column: keys | form ---------- */
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;align-items:start;}

/* Boxed now (moved here from .form-panel, which is unboxed below) --
   same real glassmorphism recipe: blur + translucency + light edge +
   lift shadow, so it reads as floating glass, not a flat tint. */
/* Unboxed -- same reasoning as .chart-carousel above. */
.keys-col{
  position:relative;padding:0;
}
.key-item{display:flex;align-items:flex-start;gap:0.5rem;margin-bottom:1.1rem;}
.key-item:last-child{margin-bottom:0;}
.key-icon{flex:0 0 auto;width:25px;height:25px;margin-top:0.05rem;}
.key-txt{font-size:0.85rem;line-height:1.38;color:#000000;font-weight:500;}
.key-txt-lead{font-family:'Special Elite',monospace;font-size:1.15rem;line-height:1.3;font-weight:400;text-transform:uppercase;letter-spacing:0.02em;}
.key-txt em{font-style:normal;color:#000000;}
/* No highlighter box -- that was 3 emphasis signals stacked at once
   (background block + bold + a near-black tint reading as its own
   color), which is the actual reason it read as a highlighter mark
   instead of considered typography. Down to 2 signals -- color + the
   existing bold weight -- still findable at a skim, without the block. */
/* <mark> has a browser-default yellow background in every browser --
   omitting a background rule here does NOT mean "no background," it means
   "fall back to that yellow default." Has to be set explicitly to none. */
.key-hl{background:none;color:#000000;font-weight:800;}

.form-col{position:relative;}
/* Unboxed: the data-entry form now sits directly on the page background,
   no card/blur/border around it -- the box moved to .keys-col instead. */
.form-panel{
  position:relative;padding:0.3rem 0 0;
}
.form-panel .f{margin-bottom:0.7rem;}
.form-panel .f:last-child{margin-bottom:0;}
.form-panel label{display:block;font-size:0.52rem;letter-spacing:0.07em;text-transform:uppercase;color:#000000;margin-bottom:0.2rem;font-weight:700;}
.section-lbl{font-size:0.6rem!important;color:#000000!important;margin-bottom:0.35rem!important;}
.opt-note{font-style:normal;text-transform:none;letter-spacing:0;color:#000000;font-weight:600;}
.row3{display:grid;grid-template-columns:1fr 0.7fr 1fr;gap:0.4rem;}
.row-ampm{display:grid;grid-template-columns:1fr auto;gap:0.4rem;align-items:end;}

/* Thin underline field with small tick marks at the start and stop points of
   the writing line -- "|____________|" -- instead of a boxed/indented input,
   with italic text for a lighter, less typewriter-formal feel. */
.line-field{position:relative;padding-bottom:0.3rem;border-bottom:1.3px solid rgba(23,22,28,0.4);}
.line-field::before,.line-field::after{
  content:'';position:absolute;bottom:-0.5px;width:1.3px;height:6px;background:rgba(23,22,28,0.4);
}
.line-field::before{left:0;}
.line-field::after{right:0;}
.line-field input,.line-field select{
  width:100%;background:transparent;border:none;color:#000000;font-size:0.7rem;font-weight:400;
  font-style:normal;font-family:'Special Elite',monospace;padding:0.15rem 0.2rem 0;outline:none;
  -webkit-appearance:none;appearance:none;
}
.line-field select{width:auto;padding-right:1rem;}
.line-field select option{color:#000000;}
.line-field input::placeholder{color:#6b6558;font-style:normal;opacity:1;}

/* ---------- submit button: blue fill, 3D lift built from nothing but
   white / light silver / translucent layers -- slow-spinning silver ring
   still wraps it, same verified technique as the live entry form's button ---------- */
.submit-wrap{margin-top:1.2rem;display:flex;justify-content:center;}
.glow-ring{position:relative;display:block;width:fit-content;border-radius:9px;padding:3px;overflow:hidden;}
.glow-ring::before{content:'';position:absolute;inset:-100%;
  background:conic-gradient(from 0deg,#8a8fa0 0%,#eef1fb 12%,#fefeff 20%,#eef1fb 28%,#8a8fa0 40%,#5a5f70 50%,#8a8fa0 60%,#eef1fb 72%,#fefeff 80%,#eef1fb 88%,#8a8fa0 100%);
  animation:silverspin 3s linear infinite;}
.glow-ring .gen-btn{position:relative;z-index:1;margin:0;border-radius:7px;}
@keyframes silverspin{to{transform:rotate(360deg);}}
@media(prefers-reduced-motion:reduce){.glow-ring::before{animation:none;display:none;}}
/* Fill is the same real brushed-steel family as the numerology tiles'
   chrome tone (silverL/silverD stops from TONE_CONIC) instead of a flat
   blue pill -- the spinning ring around this button was already this
   metal; the fill fighting it with a different, unrelated material (flat
   blue) was two materials pretending to be one object. Linear, not
   conic, so the label sits on predictable light/dark bands left-to-right
   rather than a ring pattern that would cut across the letters. */
.gen-btn{position:relative;overflow:hidden;min-width:150px;padding:0.6rem 1.7rem;
  background:linear-gradient(115deg,#eef2f4 0%,#c9d6da 18%,#6f818a 42%,#4f5a61 58%,#8ea0a8 78%,#eef2f4 100%);
  border:1px solid rgba(255,255,255,0.6);border-radius:6px;
  color:#ffffff;font-size:0.74rem;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;
  text-shadow:0 1px 2px rgba(0,0,0,0.85),0 0 5px rgba(0,0,0,0.5);
  transition:transform 0.18s ease,box-shadow 0.18s ease;
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,0.65),
    inset 0 -4px 7px rgba(40,45,50,0.35),
    0 8px 18px -6px rgba(40,45,50,0.55);}
.gen-btn:hover{transform:translateY(-1px);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,0.7),
    inset 0 -4px 7px rgba(40,45,50,0.4),
    0 10px 22px -6px rgba(40,45,50,0.65);}
.gen-btn:active{transform:translateY(1px);}
.gen-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:55%;border-radius:6px 6px 50% 50%/6px 6px 100% 100%;
  background:linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.06) 100%);pointer-events:none;}
.tnote{font-style:italic;font-size:0.62rem;line-height:1.4;color:#000000;margin:0.35rem 0 0;}
.tnote.tight{margin:0.2rem 0 0.65rem;}
.err{display:none;font-size:0.7rem;color:#a3243f;margin:0.5rem 0 0;padding:0.4rem 0.6rem;background:rgba(200,40,60,0.08);border-radius:5px;border:1px solid rgba(200,40,60,0.3);font-weight:600;}

/* ---------- loading state ---------- */
.loading{display:none;text-align:center;padding:4rem 1rem;}
.loading-txt{font-family:'Special Elite',monospace;font-size:0.8rem;letter-spacing:0.04em;text-transform:uppercase;font-weight:400;color:#000000;}

.results-wrap{display:none;padding:1.6rem 0 2.5rem;max-width:460px;width:100%;min-width:0;margin:0 auto;}
.results-wrap .ttl{font-family:'Alex Brush',cursive;font-size:1.9rem;color:#1C2CA9;
  text-align:center;margin-bottom:1.4rem;}

/* ---------- panel content: dark text on the light brushed-metal panel,
   brand blue for accents instead of the old gold ---------- */
.dp{--card-text:#000000;--card-dim:#000000;--card-mid:#232a20;--card-accent:#1C2CA9;
  --card-a1:rgba(10,21,48,0.28);--card-a2:rgba(10,21,48,0.15);--card-a3:rgba(255,255,255,0.4);--card-a4:rgba(28,44,169,0.12);
  --card-stripe-odd:rgba(255,255,255,0.22);--card-stripe-even:transparent;
  color:var(--card-text);height:100%;display:flex;flex-direction:column;}
.dph{padding:0.3rem 0.4rem;font-family:'Barlow Condensed',sans-serif;font-size:0.5rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--card-accent);border-bottom:1px solid var(--card-a2);background:var(--card-a3);flex-shrink:0;font-weight:800;}
.dplist{flex:1;overflow:hidden;}
.dpr{display:flex;flex-direction:column;gap:0.02rem;padding:0.1rem 0.4rem;font-size:0.5rem;}
.dprl{font-family:'Barlow Condensed',sans-serif;color:var(--card-dim);font-size:0.42rem;text-transform:uppercase;letter-spacing:0.01em;font-weight:700;flex-shrink:0;align-self:flex-start;}
.glyph{color:var(--card-accent);font-size:0.6rem;font-weight:400;text-transform:none;}
.dprv{font-family:'Barlow Condensed',sans-serif;color:var(--card-text);font-style:normal;font-weight:800;text-align:left;}
.dprv.pend{color:var(--card-accent);font-size:0.44rem;}
.dpsec{padding:0.2rem 0.4rem 0.05rem;font-family:'Barlow Condensed',sans-serif;font-size:0.38rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--card-accent);font-weight:800;margin-top:0.05rem;}
.dpsec:first-child{margin-top:0;}
.stage-range{padding:0.1rem 0.4rem 0;font-family:'Barlow Condensed',sans-serif;font-size:0.34rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--card-mid);font-weight:700;}
.stage-pair{display:flex;gap:0.5rem;}
.stage-pair .pc-col{flex:1;min-width:0;}
.stage-pair .dprl{align-self:stretch;white-space:normal;overflow-wrap:anywhere;}
.birthdate-row .dprl,.birthdate-row .dprv{font-size:0.19rem;}
.card-expand-body .birthdate-row .dprl{font-size:0.72rem;}
.card-expand-body .birthdate-row .dprv{font-size:1.1rem;}
.stage-pair .dpr{padding:0.02rem 0.4rem;}
.stage-pair .dpdef{padding:0 0.4rem 0.3rem;}
.dprow:nth-child(odd){background:var(--card-stripe-odd);}
.dprow:nth-child(even){background:var(--card-stripe-even);}
/* Larger, real hit area: the previous version used an absolutely-
   positioned chevron plus a thin padding sliver as the only extra tap
   space, so the affordance looked tappable over a bigger area than it
   actually was. inline-flex puts the chevron in normal flow right next
   to the text (no positioning guesswork), and the padding/negative-margin
   pair grows the actual clickable box on all sides without shifting the
   visible text, so the whole label+chevron reads and taps as one unit. */
.dprl.term{
  cursor:pointer;color:var(--card-accent);
  display:inline-flex;align-items:center;gap:0.3em;
  padding:0.3em 0.35em;margin:-0.3em -0.35em;
  border-bottom:1px solid color-mix(in srgb, var(--card-accent) 45%, transparent);
  transition:border-color 0.15s ease;
}
.dprl.term::after{
  content:'';flex-shrink:0;width:0.4em;height:0.4em;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(45deg);transition:transform 0.15s ease;
}
.dprl.term.open::after{transform:rotate(-135deg);}
.dprl.term:hover{border-bottom-color:var(--card-accent);}
.dpdef{padding:0 0.4rem 0.3rem;font-family:'DM Sans',sans-serif;font-size:0.42rem;line-height:1.4;color:var(--card-mid);font-style:italic;font-weight:400;}
.dpdef p{margin:0 0 0.5em;}
.dpdef p:last-child{margin-bottom:0;}
.dpdef p:first-child{font-weight:700;font-style:normal;}
.wheel-wrap{display:none;}
.card-expand-body .wheel-wrap{display:flex;justify-content:center;width:calc(100% + 2.6rem);max-width:600px;margin:0 -1.3rem 0.8rem;}
.dpdef[hidden]{display:none;}
.report-print-full{display:none;}
.report-preview{padding:0 0.4rem;font-family:'Alex Brush',cursive;font-size:1.5rem;font-weight:400;letter-spacing:0.01em;text-transform:none;font-style:normal;text-align:center;
  color:#1C2CA9;}
.report-tray-preview{height:100%;display:flex;align-items:center;justify-content:center;}
.hd-mirror-type{padding:0 0.3rem;font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:800;letter-spacing:0.02em;text-transform:uppercase;color:var(--card-text);text-align:center;}

/* ---------- normal document-flow results layout: 3 equal columns,
   all 7 boxes (6 charts + Reading) the SAME fixed size. Cards are clear
   (transparent, no white fill) -- just a hairline border, page texture
   shows through. Each card is a fixed-height flex column: title (+
   wheel, for Astrology) stays full size, the text list fills whatever
   space is left and gets clipped with a fade -- a real preview, full
   content only in the tap-to-expand modal. ---------- */
/* Nav buttons now sit inside the grid itself, flanking the Reading panel
   (row 2, columns 1 and 3 -- both empty there since Reading only occupies
   column 2) instead of a separate row above everything. */
.grid-nav-btn{align-self:center;justify-self:center;}
.bottom-btns{display:flex;gap:0.7rem;justify-content:center;width:100%;margin:1.4rem auto 0;}

.main-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.6rem;align-items:start;width:100%;max-width:460px;margin:0 auto;}
.quad-item{position:relative;min-width:0;cursor:pointer;border-radius:10px;overflow:hidden;
  background:transparent;border:1.5px solid rgba(28,44,169,0.75);box-shadow:0 3px 10px -4px rgba(15,23,88,0.35);
  height:300px;display:flex;flex-direction:column;
  padding:0.55rem 0.45rem 0.6rem;}
.quad-item .quad-title{flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-size:0.54rem;letter-spacing:0.04em;text-transform:uppercase;font-weight:800;color:#1C2CA9;margin-bottom:0.35rem;text-align:center;}
.quad-item .quad-wheel{flex-shrink:0;width:100%;margin-bottom:0.45rem;}
.quad-item .quad-wheel svg{display:block;width:100%;height:auto;}
.quad-item .dpr{font-size:0.54rem;padding:0.06rem 0;gap:0.01rem;}
.quad-item .dprl{font-size:0.43rem;}
.quad-item .dpsec{font-size:0.39rem;padding:0.18rem 0 0.05rem;}
.quad-item .dpdef{font-size:0.43rem;padding:0 0 0.26rem;}
.quad-item .glyph{font-size:0.62rem;}
.panel-auto{position:relative;width:100%;border-radius:10px;cursor:pointer;overflow:hidden;
  background:transparent;border:1.5px solid rgba(28,44,169,0.75);box-shadow:0 3px 10px -4px rgba(15,23,88,0.35);
  height:300px;display:flex;flex-direction:column;}
/* Unlike panel-auto (fixed 300px, matching the 6 chart cards), this is a
   one-line service message with no real content to fill a card-sized box --
   forcing it to 300px left a large empty rectangle. Sized to its content. */
.panel-error{position:relative;width:100%;border-radius:10px;
  background:transparent;border:1.5px solid rgba(28,44,169,0.75);box-shadow:0 3px 10px -4px rgba(15,23,88,0.35);}
.panel-error .dp{height:auto;}
.panel-error .report-body{padding:0.5rem 0.4rem 0.6rem;}
.quad-item .dplist,.panel-auto .dplist{flex:1;min-height:0;overflow:hidden;position:relative;}
.panel-auto .report-tray-preview{height:100%;padding:1rem 0.4rem;}
.report-body{padding:0 0.4rem;font-family:'DM Sans',sans-serif;font-size:0.46rem;line-height:1.55;color:var(--card-text);font-weight:400;}
.report-sig{padding:0.3rem 0.4rem 0;font-family:'DM Sans',sans-serif;font-size:0.46rem;font-style:italic;line-height:1.55;color:var(--card-accent);font-weight:500;}
.gates-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.18rem;padding:0.1rem 0.4rem 0.3rem;}
/* Real depth (shadow) instead of flat, plus the same dotted-underline
   language .term already uses everywhere else in this app for "tap this" --
   so gates read as tappable using a convention the rest of the app already
   teaches, not a new, unlabeled one. */
.gate-chip{border:1px solid var(--card-a1);border-bottom:1.5px dotted var(--card-accent);border-radius:3px;color:var(--card-text);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:0.48rem;padding:0.14rem 0;cursor:pointer;text-align:center;background:var(--card-stripe-odd);box-shadow:0 1px 3px -1px rgba(15,23,88,0.35);}
.gate-chip:hover,.gate-chip.active{border-color:var(--card-accent);color:var(--card-accent);background:var(--card-a4);}
.gate-def{margin:0 0.4rem 0.3rem;padding:0.26rem 0.4rem;background:var(--card-a4);border-left:2px solid var(--card-accent);border-radius:2px;font-family:'DM Sans',sans-serif;font-size:0.42rem;line-height:1.35;color:var(--card-mid);font-style:italic;font-weight:400;}
.gate-def-print{display:none;}

/* Solid blue pills, sized to their own content (not stretched across the
   row) -- so they pop off the cream page instead of blending into it as
   white-on-white did. A real lift shadow so they read as pressable, and
   a small icon each for quick recognition at a glance. No shine/sheen
   overlay -- explicitly rejected, do not reintroduce. */
.side-btn{
  position:relative;overflow:hidden;cursor:pointer;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;gap:0.35rem;text-align:center;
  font-family:'Barlow Condensed',sans-serif;font-size:0.56rem;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;
  padding:0.6rem 1.1rem;color:#fdfdfd;
  background:linear-gradient(155deg,#707AC9 0%,#1C2CA9 55%,#15217E 100%);
  border:1px solid rgba(21,33,126,0.5);
  box-shadow:0 4px 12px -3px rgba(15,25,45,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
  transition:transform 0.15s ease, box-shadow 0.15s ease;
}
.side-btn .btn-icon{flex-shrink:0;width:11px;height:11px;display:block;}
.side-btn:active{transform:translateY(2px) scale(0.97);box-shadow:0 1px 4px -1px rgba(15,25,45,0.4), inset 0 1px 0 rgba(255,255,255,0.2);}

/* ---------- tap-to-expand modal ---------- */
.card-expand{
  display:none;position:fixed;inset:0;width:100dvw;height:100dvh;z-index:300;overflow-y:auto;
  color:#000000;padding:1.3rem 1.3rem 3rem;font-size:16px;
  background-color:#e8d2a0;
  background-image:
    radial-gradient(ellipse 60% 25% at 25% 10%, rgba(255,250,235,0.55) 0%, rgba(255,250,235,0) 55%),
    radial-gradient(ellipse 50% 20% at 75% 55%, rgba(201,172,114,0.3) 0%, rgba(201,172,114,0) 55%),
    radial-gradient(ellipse 55% 22% at 20% 85%, rgba(255,250,235,0.35) 0%, rgba(255,250,235,0) 55%);
  background-attachment:fixed;
}
.card-expand.open{display:block;}
.card-expand-close{position:sticky;top:0;float:right;background:none;border:none;font-size:1.3rem;color:#000000;cursor:pointer;padding:0.3rem;line-height:1;}
.card-expand-title{max-width:760px;margin:0 auto 0.7rem;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:0.02em;text-transform:uppercase;color:#1C2CA9;clear:both;}
.card-expand-body{max-width:600px;margin:0 auto;font-size:0.94rem;}
.card-expand-body .dplist{overflow:visible;}
.card-expand-body .dph{font-size:0.8rem;padding:0.4rem 0.3rem;}
.card-expand-body .dpr{font-size:1rem;padding:0.35rem 0.3rem;gap:0.15rem 0.9rem;}
.card-expand-body .dprl{font-size:0.72rem;}
.card-expand-body .glyph{font-size:1.2rem;}
.card-expand-body .dprv.pend{font-size:0.9rem;}
.card-expand-body .dpsec{font-size:0.72rem;padding:0.35rem 0.3rem 0.1rem;}
.card-expand-body .dpdef{font-size:0.88rem;line-height:1.45;padding:0 0.3rem 0.5rem;}
.card-expand-body .gates-grid{gap:0.4rem;padding:0.25rem 0.3rem 0.4rem;}
.card-expand-body .gate-chip{font-size:0.95rem;padding:0.35rem 0;}
.card-expand-body .gate-def{font-size:0.88rem;line-height:1.45;padding:0.4rem 0.6rem;margin:0 0.3rem 0.4rem;}
.card-expand-body .report-body{font-size:0.95rem;line-height:1.6;padding:0 0.3rem;}
.card-expand-body .report-sig{font-size:0.95rem;line-height:1.6;padding:0.5rem 0.3rem 0;}
@media print{
  .form-col,.chart-carousel,.brand-row,.tagline-wrap,.keys-col,.grid-nav-btn,.bottom-btns{display:none!important;}
  body,.card-expand{background:#fff!important;}
  .quad-item,.panel-auto{box-shadow:none!important;border:1.5px solid #1C2CA9!important;background:#fff!important;}
  .quad-item .dplist,.panel-auto .dplist{max-height:none!important;overflow:visible!important;}
  .dp{--card-text:#000!important;--card-accent:#1C2CA9!important;--card-stripe-odd:transparent!important;}
}

<svg id="bgWisps" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wispBlurLg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>

    <filter id="wispBlurSm" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="wispTurbA" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wispTurbB" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="3" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wispTurbC" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.028" numOctaves="3" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="32" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wispTurbD" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.032" numOctaves="3" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Thick/flowing white background: layered ribbon shapes (real
         parametric geometry -- centerline + perpendicular half-width,
         not a hand-drawn blob), each with its OWN soft drop-shadow so
         they stack into real physical thickness instead of one flat
         white shape. White fill with cool-grey shading only -- no warm
         ivory/tan, that was already tried and rejected on this
         background once. Smaller turbulence scale than the wispTurb*
         filters above so the edges read as poured/liquid, not shredded. -->
    <filter id="creamMarble" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="creamMarble2" x="-30%" y="-30%" width="160%" height="160%">

      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="creamLift1" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8a8d92" flood-opacity="0.32"/>
    </filter>

      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#8a8d92" flood-opacity="0.28"/>

      <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#e7e9ec"/><stop offset="100%" stop-color="#cfd3d8"/>
    </linearGradient>

      <stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#f2f3f5"/><stop offset="100%" stop-color="#dcdfe3"/>
    </linearGradient>
    <linearGradient id="creamFront" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eceef0"/>
    </linearGradient>

      <stop offset="34%" stop-color="#ffffff" stop-opacity="0"/><stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="72%" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="84%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<script>
// ---------- background wisps: real blurred/turbulence-distorted brush
// shapes, not a flat color fill. Four color/filter variants cycle down
// the actual document height with jittered offsets so nothing repeats
// as an obvious tiled pattern.
(function(){
  const CLUSTER_H = 800, VW = 420;
  // No warm ivory/cream/blush anywhere -- that's what was reading as
  // tan, confirmed directly. White, cool pearl-grey, and a pale tint of
  // the site's own established blue (#1C2CA9 family) only.
  const VARIANTS = [
    { blob:'#eef2f5', turb:'#ffffff', wisp1:'#ffffff', wisp2:'#e4e8f7', low:'#eef2f5', anchor1:'#ffffff', anchor2:'#e4e8f7', turbFilter:'wispTurbA' },
    { blob:'#e4e8f7', turb:'#eef2f5', wisp1:'#ffffff', wisp2:'#ffffff', low:'#ffffff', anchor1:'#eef2f5', anchor2:'#ffffff', turbFilter:'wispTurbB' },
    { blob:'#ffffff', turb:'#e4e8f7', wisp1:'#eef2f5', wisp2:'#ffffff', low:'#eef2f5', anchor1:'#e4e8f7', anchor2:'#eef2f5', turbFilter:'wispTurbC' },
    { blob:'#eef2f5', turb:'#ffffff', wisp1:'#ffffff', wisp2:'#e4e8f7', low:'#ffffff', anchor1:'#e4e8f7', anchor2:'#eef2f5', turbFilter:'wispTurbD' }
  ];
  function rand(seed){ const x = Math.sin(seed*999.123)*10000; return x - Math.floor(x); }
  function j(seed, base, range){ return Math.round(base + (rand(seed)-0.5)*2*range); }

  function cluster(i){
    const v = VARIANTS[i % 4];
    const y0 = i * CLUSTER_H, s = i * 13 + 1;
    return `
      <g transform="translate(0,${y0})">
        <path d="M -40,${j(s+1,180,30)} C 40,${j(s+2,100,20)} 90,${j(s+3,140,20)} 160,${j(s+4,80,20)}
                 C 230,${j(s+5,30,20)} 260,${j(s+6,80,20)} 340,${j(s+7,50,20)}
                 L 340,${j(s+8,220,20)} C 260,${j(s+9,240,20)} 240,${j(s+10,210,20)} 170,${j(s+11,260,20)}
                 C 100,${j(s+12,300,20)} 80,${j(s+13,280,20)} -40,${j(s+14,340,20)} Z"
              fill="${v.blob}" opacity="0.55" filter="url(#wispBlurLg)"/>
        <path d="M -30,${j(s+15,420,25)} C 60,${j(s+16,360,20)} 100,${j(s+17,390,20)} 180,${j(s+18,330,20)}
                 C 250,${j(s+19,290,20)} 280,${j(s+20,320,20)} 360,${j(s+21,270,20)}
                 C 320,${j(s+22,320,20)} 300,${j(s+23,350,20)} 240,${j(s+24,390,20)}
                 C 170,${j(s+25,435,20)} 150,${j(s+26,410,20)} 90,${j(s+27,460,20)}
                 C 40,${j(s+28,500,20)} 30,${j(s+29,490,20)} -60,${j(s+30,540,20)} Z"
              fill="${v.turb}" opacity="0.5" filter="url(#${v.turbFilter})"/>
        <path d="M 20,${j(s+31,380,20)} C 80,${j(s+32,340,20)} 100,${j(s+33,360,20)} 150,${j(s+34,320,20)}
                 C 200,${j(s+35,282,20)} 210,${j(s+36,300,20)} 270,${j(s+37,270,20)}"
              fill="none" stroke="${v.wisp1}" stroke-width="13" stroke-linecap="round" opacity="0.75" filter="url(#wispBlurMd)"/>
        <path d="M 60,${j(s+38,440,20)} C 110,${j(s+39,400,20)} 130,${j(s+40,415,20)} 180,${j(s+41,375,20)}
                 C 225,${j(s+42,340,20)} 235,${j(s+43,355,20)} 290,${j(s+44,325,20)}"
              fill="none" stroke="${v.wisp2}" stroke-width="7" stroke-linecap="round" opacity="0.65" filter="url(#wispBlurSm)"/>
        <path d="M -20,${j(s+45,590,25)} C 70,${j(s+46,550,20)} 110,${j(s+47,575,20)} 180,${j(s+48,535,20)}
                 C 250,${j(s+49,495,20)} 270,${j(s+50,520,20)} 350,${j(s+51,480,20)}
                 C 320,${j(s+52,520,20)} 300,${j(s+53,540,20)} 250,${j(s+54,570,20)}
                 C 190,${j(s+55,605,20)} 175,${j(s+56,585,20)} 120,${j(s+57,615,20)}
                 C 80,${j(s+58,635,20)} 60,${j(s+59,625,20)} -30,${j(s+60,650,20)} Z"
              fill="${v.low}" opacity="0.5" filter="url(#wispBlurLg)"/>
        <circle cx="${j(s+61,220,30)}" cy="${j(s+62,150,20)}" r="90" fill="${v.anchor1}" opacity="0.4" filter="url(#wispBlurLg)"/>
        <circle cx="${j(s+63,150,30)}" cy="${j(s+64,550,20)}" r="70" fill="${v.anchor2}" opacity="0.4" filter="url(#wispBlurLg)"/>
      </g>`;
  }

  // ---------- thick/flowing white hero layer: real parametric ribbon
  // geometry (centerline + perpendicular half-width per sample point),
  // not a hand-drawn blob path. Three stacked passes, each with its own
  // soft drop-shadow, is what actually reads as physical thickness --
  // one flat shape with a single shadow does not. Anchored to the top
  // of the page (fixed y-range) regardless of total document height, so
  // it stays a hero treatment behind the title/numbers/tagline and does
  // not stretch thin across the whole page or compete with the form
  // fields further down.
  function ribbonPath(points, halfWidths){
    const top=[], bot=[];
    for(let i=0;i<points.length;i++){
      const [x,y] = points[i];
      const prev = points[Math.max(0,i-1)];
      const next = points[Math.min(points.length-1,i+1)];
      let dx = next[0]-prev[0], dy = next[1]-prev[1];
      const len = Math.hypot(dx,dy)||1;
      dx/=len; dy/=len;
      const nx = -dy, ny = dx;
      const hw = halfWidths[i];
      top.push([x+nx*hw, y+ny*hw]);
      bot.push([x-nx*hw, y-ny*hw]);
    }
    let d = 'M'+top.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
    d += ' L'+bot.slice().reverse().map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
    d += ' Z';
    return d;
  }
  function creamLayerPath(seed, yOffset, hwBase, hwAmp, W, N){
    const pts = [], hws = [];
    for(let i=0;i<=N;i++){
      const t = i/N;
      const x = -80 + t*(W+160);
      const y = yOffset + 130*Math.sin(t*Math.PI*1.0 - 0.3 + seed) + t*200;
      pts.push([x,y]);
      hws.push(hwBase + hwAmp*Math.sin(t*Math.PI*2.0 + seed*1.7));
    }
    return ribbonPath(pts, hws);
  }
  function creamHero(W){
    const N = 44;
    const pathBack  = creamLayerPath(0.6, 20,  58, 20, W, N);
    const pathMid   = creamLayerPath(0.15, 35, 46, 16, W, N);
    const pathFront = creamLayerPath(-0.3, 50, 34, 12, W, N);
    return `
      <g filter="url(#creamLift1)"><path d="${pathBack}" fill="url(#creamBack)" filter="url(#creamMarble)"/></g>
      <g filter="url(#creamLift2)"><path d="${pathMid}" fill="url(#creamMid)" filter="url(#creamMarble2)"/></g>
      <g filter="url(#creamLift3)">
        <path d="${pathFront}" fill="url(#creamFront)" filter="url(#creamMarble)"/>
        <path d="${pathFront}" fill="url(#creamSheen)" filter="url(#creamMarble)"/>
      </g>`;
  }
  /* The hero ribbon stopped dead around y=350-380 with nothing below it
     -- rich, layered, shadowed material at the top, then a flat blank
     page for the remaining ~600px behind the form. That hard seam is
     its own bug independent of any bigger repaint: a page shouldn't
     look designed in one section and abandoned in the next. This is a
     single quiet tendril of the same material (not a second hero
     moment) hugging the right edge, tapering from a real width down to
     almost nothing, so the transition is a gradient instead of a
     cliff -- narrow and faint enough by the time it reaches the form
     that it never sits under input text. */
  function creamTrail(W, H){
    const startY = 300;
    if(H <= startY + 40) return '';
    const N = 30;
    const pts=[], hws=[];
    for(let i=0;i<=N;i++){
      const t = i/N;
      const y = startY + t*(H-startY);
      const x = W - 34 + 14*Math.sin(t*Math.PI*1.6);
      pts.push([x,y]);
      hws.push(24*(1-t) + 3);
    }
    const path = ribbonPath(pts, hws);
    return `<g filter="url(#creamLift3)"><path d="${path}" fill="url(#creamBack)" opacity="0.55" filter="url(#creamMarble2)"/></g>`;
  }

  function buildWisps(){
    const svg = document.getElementById('bgWisps');
    if(!svg) return;
    const h = document.body.scrollHeight;
    const numClusters = Math.max(1, Math.ceil(h / CLUSTER_H));
    let body = '';
    for(let i=0;i<numClusters;i++) body += cluster(i);
    body += creamHero(VW);
    body += creamTrail(VW, h);
    svg.setAttribute('viewBox', `0 0 ${VW} ${h}`);
    svg.setAttribute('height', h);
    svg.setAttribute('preserveAspectRatio','none');
    const defs = svg.querySelector('defs');
    svg.innerHTML = '';
    if(defs) svg.appendChild(defs);
    svg.insertAdjacentHTML('beforeend', body);
  }
  buildWisps();
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(buildWisps); }
  window.addEventListener('resize', buildWisps);
})();

// ---------- numerology numbers: monochrome palette, distinguished by outline ----------
// Correction from the previous pass: I'd sampled a real photo but that photo's
// warm ambient light was bouncing onto the metal -- a lighting artifact of
// that shot, not silver's actual hue. Silver here is now genuinely cool/
// neutral steel-gray (hue ~215, near-desaturated), gold is the only warm tone
// (as asked), white/cream stay true white/cream rather than tan-shifted.
// Contrast against the ink text verified per stop, same as before.
// Rebuilt from real, established metallic/precious color names instead of
// self-derived HSL math: Platinum + classic Silver for silverL, Silver +
// Steel + Gunmetal (lightened just enough to stay legible, same hue/sat
// preserved) for silverD, and Champagne -- a genuinely well-known pale gold
// that is NOT yellow/orange -- for goldT.
const TONES = {
  cream:   { grad:'radial-gradient(circle at 30% 26%, #ffffff 0%, #fdfaf3 55%, #f3ead9 100%)', border:'#d9cdb2' },
  white:   { grad:'radial-gradient(circle at 30% 26%, #ffffff 0%, #ffffff 55%, #f1f1f1 100%)', border:'#d8d4c9' },
  silverL: { grad:'radial-gradient(circle at 30% 26%, #f3f2f1 0%, #dddcda 55%, #c2c1bc 100%)', border:'#8c8b80' },
  silverD: { grad:'radial-gradient(circle at 30% 26%, #dddcdc 0%, #bcc1c4 55%, #b0c1c8 100%)', border:'#6f818a' },
  goldT:   { grad:'radial-gradient(circle at 30% 26%, #fdf6ea 0%, #ede2ce 55%, #ddccae 100%)', border:'#b7a684' },
  platinum:{ grad:'radial-gradient(circle at 30% 26%, #ffffff 0%, #eef1f3 55%, #d3d9dd 100%)', border:'#9aa2a8' },
  copper:  { grad:'radial-gradient(circle at 30% 26%, #ffe8d6 0%, #d9986a 55%, #a85f36 100%)', border:'#8a4a1f' },
  ice:     { grad:'#2e7fd4', border:'#164272' },
  iceDeep: { grad:'#1f5fa8', border:'#0f3862' },
};
// Real metal technique (researched, not guessed): a conic-gradient with
// alternating light/dark bands radiating around the shape, which is what
// actually reads as a polished reflective surface -- a mirror reflecting
// a whole room, not one soft highlight. A single radial highlight (the
// old TONES.grad, kept above for the tiny SVG planet dots where a conic
// band pattern is too small to read at all) is the thing that was
// reading as flat/painted rather than metal. Applied here to the
// numerology tiles specifically because they're large enough (real HTML
// squares, not few-pixel SVG dots) for the band pattern to actually show.
function conicBands(darkest, dark, mid, light, lightest){
  const seq = [darkest, light, mid, lightest, dark, mid, darkest, light, mid, lightest, dark, light, mid, lightest, dark, darkest];
  const angles = [0,22,40,58,78,100,125,150,175,200,225,250,275,300,325,360];
  return 'conic-gradient(from 200deg at 50% 50%, ' + seq.map((c,i)=>`${c} ${angles[i]}deg`).join(',') + ')';
}
const TONE_CONIC = {
  cream:   conicBands('#8a7a5c','#b7a47e','#d9c9a8','#f3e9d3','#fffefb'),
  white:   conicBands('#7a7a7a','#999999','#c2c2c2','#ececec','#ffffff'),
  silverL: conicBands('#6b7078','#8b9199','#a8adb3','#d6dce1','#ffffff'),
  silverD: conicBands('#4f5a61','#6f818a','#8ea0a8','#c9d6da','#eef2f4'),
  goldT:   conicBands('#7c5a1c','#9a7527','#d9b263','#eecf8e','#fffdf5'),
  /* Bright/high-key silver, distinct from silverL/silverD -- those two
     are both mid-value cool greys and read as "the same metal" next to
     each other at a glance. This one is pushed much closer to white
     overall (polished platinum, not brushed steel), real contrast
     against the other tones instead of a third shade of the same grey. */
  platinum: conicBands('#8a9098','#b8bfc6','#dde2e6','#f2f5f7','#ffffff'),
  /* Real copper: warm reddish-brown shadow through to a warm
     pink-white highlight -- genuinely different hue from gold (which
     stays yellow-brown throughout), not just a darker/lighter gold. */
  copper:  conicBands('#5c2e10','#8a4a1f','#b87333','#e0a878','#fff0e0'),
};
/* Ice, not metal: no conic bands (that's what was reading as a shiny
   brushed surface). A quiet, mostly-flat, very desaturated blue-white
   gradient instead -- almost colorless with just a whisper of blue, the
   way real ice reads, not the saturated, evenly-blue "clear sky" a
   stronger tint gives. Two tones in the same family for tile-to-tile
   distinction, not a different material. Also the one place blue is
   used outside the title, which is otherwise banned -- explicitly
   requested here. */
// Flat, fully saturated -- no gradient wash. The gradient version kept
// reading as faded/streaky (colored pencil) no matter how it was tinted;
// a solid opaque fill plus a crisp unblurred highlight (see .swatch::before
// above) is what actually reads as paint/shine instead.
const ICE_FILL = {
  ice:     '#2e7fd4',
  iceDeep: '#1f5fa8',
};
Object.assign(TONE_CONIC, ICE_FILL);
// Straight numeric order 1-9 (not the Pythagorean Square's row-major
// layout, which reads as "out of order" without that grid actually being
// built anywhere else in the app). Labels are the standard single-word
// Life Path archetypes -- the same real numerology tradition already
// used for the tap-to-reveal detail (NUM_DEFS.lifepath, below) -- so the
// always-visible word under each tile now matches what you get when you
// tap it, instead of naming a different, unbuilt tool.
// 6 per row x 2 rows -- single digits first, Master Numbers (11/22/33,
// real numerology terms, not dropped this time) on their own second
// row. Labels match NUM_DEFS.lifepath's own wording for each number
// (e.g. 22 is literally called "the Master Builder" in that text).
// Real (invisible-unless-needed) soft-hyphen character -- U+00AD, not
// the &shy; markup entity, since this string also gets used via
// textContent elsewhere and entities don't parse there -- inserted at
// a sensible syllable break for the words too long to fit their tile
// on one line. Was previously wrapping wherever the browser's raw
// break-word algorithm landed, which produced an ugly orphaned single
// letter on its own line ("NURTURE" / "R"); this forces a real,
// balanced, properly-hyphenated break instead.
/* Pulled back from four competing metals to one -- ice blue, alternating
   the lighter/deeper tone within that single family so tiles are still
   visually distinct without turning into a materials sample board. */
const NUMS = [
  {n:1, lbl:'Leader',       tone:'ice'},
  {n:2, lbl:'Diplomat',     tone:'iceDeep'},
  {n:3, lbl:'Communi­cator', tone:'ice'},
  {n:4, lbl:'Builder',      tone:'iceDeep'},
  {n:5, lbl:'Freedom',      tone:'ice'},
  {n:6, lbl:'Nurtur­er', tone:'iceDeep'},
  {n:7, lbl:'Seeker',       tone:'iceDeep'},
  {n:8, lbl:'Achiever',     tone:'ice'},
  {n:9, lbl:'Humani­tarian', tone:'iceDeep'},
  {n:11, lbl:'Intu­itive',      tone:'ice'},
  {n:22, lbl:'Master Builder', tone:'iceDeep'},
  {n:33, lbl:'Master Teacher', tone:'ice'},
];
// Plain grid, two rows of six, question between them.
function buildNumRow(container, items){
  if(!container) return;
  items.forEach(item=>{
    const t = TONES[item.tone];
    const tile = document.createElement('div');
    tile.className = 'num-tile-lg';
    tile.innerHTML = `<div class="swatch" style="background:${TONE_CONIC[item.tone]};border-color:${t.border};"><div class="n">${item.n}</div></div><div class="lbl">${item.lbl}</div>`;
    tile.querySelector('.swatch').addEventListener('click', (e)=>{ e.stopPropagation(); openNumberDef(item); });
    container.appendChild(tile);
  });
}
buildNumRow(document.getElementById('numStripRowA'), NUMS.slice(0,6));
buildNumRow(document.getElementById('numStripRowB'), NUMS.slice(6,12));
// item.lbl is this cell's real Pythagorean Square meaning (Character,
// Energy, etc.) -- the body reuses NUM_DEFS.lifepath, which is a
// different number system's content (what this digit means as a Life
// Path number), included as this number's broader significance rather
// than a claim that it's the Pythagorean Square meaning itself.
function openNumberDef(item){
  document.getElementById('cardExpandTitle').textContent=`Number ${item.n} — ${item.lbl}`;
  document.getElementById('cardExpandBody').innerHTML=`<div class="dprow"><p class="report-body">${NUM_DEFS.lifepath[item.n]||''}</p></div>`;
  document.getElementById('cardExpand').classList.add('open');
}

// ---------- solar system: monochrome, laid out like an actual snapshot in
// time -- distinct orbital tiers (inner rocky pair / inner-mid pair / outer
// gas giants / far icy trio) with a gap between tiers like the real solar
// system, each planet at its own radius within its tier and a scattered
// (not evenly-spaced) angle, rather than one continuously-growing spiral. ----
// Original radii kept (scaling them up made the label text render
// SMALLER on screen overall, since the container width is fixed and a
// bigger viewBox just packs everything tighter per pixel -- the actual
// fix for collisions at a bigger font is re-angling each planet, not
// inflating the whole diagram. These angles were found by a real
// pairwise bounding-box search (every label pair checked, 6-unit
// minimum gap enforced, not eyeballed) rather than the original
// "scattered" angles, which collided once the font size went up.
const PLANETS = [
  {name:'Mercury', lines:['Communication'],      r:26,  size:3.6, tone:'silverD', angle:-70.6},
  {name:'Venus',   lines:['Love & Beauty'],      r:34,  size:4.4, tone:'cream',   angle:-149.8},
  {name:'Moon',    lines:['Emotions'],           r:46,  size:4.2, tone:'white',   angle:11.5},
  {name:'Mars',    lines:['Drive & Action'],     r:54,  size:3.8, tone:'silverL', angle:146.5},
  {name:'Jupiter', lines:['Growth & Luck'],      r:74,  size:6.6, tone:'goldT',   angle:85.2},
  {name:'Saturn',  lines:['Discipline'],         r:86,  size:6.0, tone:'silverD', angle:-58.2},
  {name:'Uranus',  lines:['Change'],             r:100, size:4.6, tone:'silverL', angle:-91.8},
  {name:'Neptune', lines:['Intuition & Dreams'], r:110, size:4.6, tone:'cream',   angle:23.7},
  {name:'Pluto',   lines:['Transformation'],     r:120, size:3.4, tone:'white',   angle:-120.4},
];
const RINGS = [26,34,46,54,74,86,100,110,120];
const SIZE = 420, C = SIZE/2;
const solarWrap = document.getElementById('solarIcon');
// Wider crop than the old icon-sized version -- this graphic is now the
// prominent astrology visual, so there's real room around the ring
// cluster for each planet's own descriptor word to sit next to it,
// always visible rather than behind a tap.
let svg = `<svg viewBox="-40 69 486 253" xmlns="http://www.w3.org/2000/svg">`;

// glossy-sphere radial gradients, one per tone -- an off-center highlight
// (upper-left) fading to the same darkest stop used on the number tiles,
// so a small flat circle reads as a lit, dimensional bead rather than a dot.
const stopsByTone = {};
svg += '<defs>';
Object.entries(TONES).forEach(([name, t])=>{
  const stops = t.grad.match(/#[0-9a-fA-F]{6}/g);
  stopsByTone[name] = stops;
  svg += `<radialGradient id="pg-${name}" cx="35%" cy="30%" r="75%">
    <stop offset="0%" stop-color="${stops[0]}"/>
    <stop offset="55%" stop-color="${stops[1]}"/>
    <stop offset="100%" stop-color="${stops[2]}"/>
  </radialGradient>`;
});
// soft glow behind each orbit ring -- a wider, blurred, white duplicate of
// the ring line sitting underneath the crisp dashed ring, so the path itself
// reads as glowing without becoming a solid band.
svg += `<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.8"/></filter>`;
svg += '</defs>';

RINGS.forEach(r=>{
  svg += `<circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="#1C2CA9" stroke-width="0.9" opacity="0.3"/>`;
});

// sun -- the one warm point the (now-neutral) planets orbit
svg += `<circle cx="${C}" cy="${C}" r="14" fill="url(#pg-goldT)" stroke="#b9a97e" stroke-width="1"/>`;

PLANETS.forEach((p,i)=>{
  const t = TONES[p.tone];
  const a = p.angle * Math.PI/180;
  const dx = Math.cos(a), dy = Math.sin(a);
  const px = C + p.r*dx, py = C + p.r*dy;
  svg += `<circle class="p-dot" data-idx="${i}" cx="${px}" cy="${py}" r="${Math.max(p.size,7)}" fill="transparent"/>`;
  svg += `<circle cx="${px}" cy="${py}" r="${p.size}" fill="url(#pg-${p.tone})" stroke="${t.border}" stroke-width="0.9" style="pointer-events:none;"/>`;
  // descriptor word sits right next to its planet, always visible --
  // still tappable (whole label is part of the same hit circle) rather
  // than hidden behind a tap, per her instruction.
  const anchor = dx>0.2?'start':dx<-0.2?'end':'middle';
  const lx = px + (p.size+9)*dx, ly = py + (p.size+9)*dy + 3;
  // Two-word "X & Y" descriptors are stacked on their own line each --
  // half the horizontal reach of one long line, so the outer-ring labels
  // (Jupiter, Neptune etc.) don't run past the edge of the graphic.
  const words = p.lines[0].split(' & ');
  if(words.length>1){
    svg += `<text x="${lx}" text-anchor="${anchor}" font-family="'Special Elite',monospace" font-weight="400" font-size="18" fill="#000000" style="pointer-events:none;">`+
      `<tspan x="${lx}" y="${ly}">${words[0]}</tspan><tspan x="${lx}" y="${ly}" dy="10">&amp; ${words[1]}</tspan></text>`;
  } else {
    svg += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-family="'Special Elite',monospace" font-weight="400" font-size="18" fill="#000000" style="pointer-events:none;">${p.lines[0]}</text>`;
  }
});
svg += `</svg>`;
solarWrap.innerHTML = svg;
solarWrap.querySelectorAll('.p-dot').forEach(el=>{
  el.style.cursor='pointer';
  el.addEventListener('click',()=>openPlanetDef(PLANETS[+el.dataset.idx]));
});
function openPlanetDef(p){
  document.getElementById('cardExpandTitle').textContent=`${p.name} — ${p.lines.join(', ')}`;
  document.getElementById('cardExpandBody').innerHTML=`<div class="dprow"><p class="report-body">${p.name} governs ${p.lines.join(' and ').toLowerCase()} in astrology.</p></div>`;
  document.getElementById('cardExpand').classList.add('open');
}

// ---------- human design: compact preview using the same real 9-center
// topology and color palette as the full results-page bodygraph (kept as
// a separate, standalone copy since the real chart's own coordinates are
// defined much further down the script and reused inside a function that
// runs after real chart data exists -- referencing that here would hit a
// temporal-dead-zone error, since this preview has to render immediately
// on page load, before any birth data is submitted). One illustrative
// defined/undefined pattern (not a real chart -- there's no birth data
// yet), same convention as the real chart: filled = defined, hollow
// outline of its own color = undefined. ----------
(function(){
  const hdWrap = document.getElementById('hdIcon');
  if(!hdWrap) return;
  // Recolored to the same 5-tone metal palette as the number tiles and
  // solar-system planets (TONES/stopsByTone, defined above) instead of
  // the real chart's 9 distinct hues -- that rainbow palette is a
  // deliberate, separate choice for the results-page bodygraph and isn't
  // touched here; this small entry-page preview now draws from the same
  // shared metal set as everything else on this page.
  const HD_CENTERS = [
    {name:'Head',  pts:[[120,18],[101,52],[139,52]],                    tone:'silverL', on:false, label:'Inspiration', lx:120, ly:6,   anchor:'middle'},

// ---------- swipeable carousel: numerology / astrology / human design
// share one platform. Height is NOT set from JS/a guessed number -- the
// track is a row flex container with the default align-items:stretch
// and no explicit height, which is standard CSS behavior for "equal
// height columns": an auto-height flex row sizes itself to its tallest
// child's natural content height, then stretches every child (including
// the shorter numerology slide) to match. That's what centers the
// numerology row vertically inside a slide as tall as the diagrams,
// with zero JS and no risk of measuring a stale/already-stretched
// height on resize. Swipe is native horizontal scroll-snap (the track
// is a real scroll container, CSS handles the gesture) -- a hand-rolled
// Pointer Events drag was tried here twice and both times broke on her
// real device (missed the swipe on iPad, then jumped a slide immediately
// and got stuck unable to swipe back). Letting the browser own touch
// scrolling instead of reimplementing it in JS is the reliable fix.
// Tap a dot converges on the same goTo() so it can't get out of sync
// with a real swipe. ----------
function initCarousel(){
  const carousel = document.getElementById('chartCarousel');
  const track = document.getElementById('carouselTrack');
  const dotsWrap = document.getElementById('carouselDots');
  if(!carousel || !track || !dotsWrap || track.dataset.carouselInit) return;
  track.dataset.carouselInit = '1';
  const N = track.children.length;
  let idx = 0;

  function setDots(i){
    Array.from(dotsWrap.children).forEach((d,j)=>d.classList.toggle('active', j===i));
  }
  function goTo(i, smooth=true){
    idx = Math.max(0, Math.min(N-1, i));
    track.scrollTo({left: idx * track.clientWidth, behavior: smooth ? 'smooth' : 'auto'});
    setDots(idx);
  }
  // Delegated from the wrapper (not attached per-dot) so it can't be
  // affected by exactly when/how the dot nodes themselves were created.
  dotsWrap.addEventListener('click', e=>{
    const dot = e.target.closest('.dot');
    if(dot) goTo(+dot.dataset.i);
  });

  // A real swipe scrolls the track natively; this just reads where it
  // landed once it settles and updates idx/dots to match -- no gesture
  // math, no threshold tuning, nothing that can get stuck mid-drag.
  let scrollTimer = null;
  track.addEventListener('scroll', ()=>{
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(()=>{
      idx = Math.round(track.scrollLeft / track.clientWidth);
      setDots(idx);
    }, 100);
  }, {passive:true});

  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=> goTo(idx, false), 150);
  });

  goTo(0, false);
}
// Run now AND on load -- belt-and-suspenders against whatever timing
// caused this to silently no-op before (guarded by data-carousel-init
// so it can't double-attach if both actually fire).
initCarousel();
window.addEventListener('load', initCarousel);
document.addEventListener('DOMContentLoaded', initCarousel);

function titleCaseWords(s){return s.replace(/\b\w/g,c=>c.toUpperCase());}

// The glossary used to show one flat sentence per term -- real depth
// already exists for every sign/number/type variant (it's exactly what
// prints on a real reading's cards), it just wasn't surfaced here. Same
// tap-to-reveal pattern as everywhere else: one collapsed row per variant,
// full text underneath, so the list stays scannable instead of a wall of
// text, but the actual content is the same depth a real reading gets.
function deepGlossaryRows(key){
  const general=GLOSSARY[key]?`<div class="dprow"><div class="dpr"><span class="dprl">${GLOSSARY_LABEL[key]||key}</span></div><div class="dpdef"><p>${GLOSSARY[key]}</p></div></div>`:'';

  let variants=null, labelFor=v=>v;
  if(key==='house'){
    variants=ASTRO_DEFS.house;
    labelFor=n=>`House ${n} — ${HOUSE_THEME[n]||''}`;
  }else if(ASTRO_DEFS[key]){
    variants=ASTRO_DEFS[key];
    labelFor=sign=>`${SIGN_GLYPH[sign]||''} ${sign}`;
  }else if(NUM_DEFS[key]){
    variants=NUM_DEFS[key];
    labelFor=n=>`Number ${n}`;
  }else if(key==='hdtype'&&HD_DEFS.hdtype){
    variants=HD_DEFS.hdtype;
    labelFor=titleCaseWords;
  }else if(key==='hdauthority'&&HD_DEFS.hdauthority){
    variants=HD_DEFS.hdauthority;
    labelFor=titleCaseWords;
  }else if(key==='hdprofile'&&HD_DEFS.hdprofile){
    variants=HD_DEFS.hdprofile;
    labelFor=v=>`${v} Profile`;
  }

  if(!variants)return general||`<div class="dprow"><div class="dpr"><span class="dprl">${GLOSSARY_LABEL[key]||key}</span></div></div>`;

  const rows=Object.keys(variants).map(v=>
    `<div class="dprow"><div class="dpr"><span class="dprl term" data-def="${key}-${v}">${escapeHtml(labelFor(v))}</span></div><div class="dpdef" hidden><p>${variants[v]}</p></div></div>`
  ).join('');
  return general+rows;
}

function buildGlossaryHTML(){
  const gateSection=`<div class="dpsec">Gates</div><div class="dprow"><p class="report-body">Every Human Design chart activates a specific set of these 64 gates -- tap any one to see what it means. Your own reading only shows the gates that are actually defined in your chart.</p></div><div class="dprow"><div class="gates-grid">${Array.from({length:64},(_,i)=>i+1).map(g=>`<button type="button" class="gate-chip" data-gate="${g}">${g}</button>`).join('')}</div><div class="gate-def" hidden></div></div>`;
  return GLOSSARY_LAYOUT.map(([section,keys])=>{
    const rows=keys.map(deepGlossaryRows).join('');
    return `<div class="dpsec">${section}</div>${rows}`;
  }).join('')+gateSection;
}
function openGlossary(){
  document.getElementById('cardExpandTitle').textContent='Glossary';
  document.getElementById('cardExpandBody').innerHTML=buildGlossaryHTML();
  document.getElementById('cardExpand').classList.add('open');
}

const ASTRO_DEFS={

    Gemini:`With your Sun in Gemini, you don't build your identity around one fixed role — your basic sense of who you are is that you're the person who can slide into any conversation, try on a new interest, and adapt to whoever's in the room, rather than staying one version of yourself across every situation. That range makes you genuinely easy to be around and hard to box in, but it can also mean your sense of self feels spread thin instead of rooted anywhere in particular. The lesson is picking one version of yourself to actually commit to, at least for a while, instead of staying every version at once.`,
    Cancer:`With your Sun in Cancer, who you are is tied to what you protect — home, family, the people you've let close enough to matter. You lead with feeling before logic, and your instinct to nurture is real, not performative, which is why people trust you with their vulnerable moments. The edge to watch is taking things personally that were never about you, and mistaking withdrawal for self-protection when it's really just avoidance.`,
    Leo:`With your Sun in Leo, your identity is built to be seen — you carry a warmth and confidence that naturally draws attention, and you do your best work when you're genuinely proud of what you're making. That radiance is real generosity, not vanity, when it's healthy: you want others to shine too. The growth edge is handling the moments no one's watching with the same integrity you bring when they are.`,
    Virgo:`With your Sun in Virgo, your sense of self is built through usefulness — you know who you are by what you improve, refine, and get genuinely right, and sloppy or careless work bothers you more than it bothers most people. That precision makes you exceptionally good at the details others miss, but the same instinct can turn inward into self-criticism that's far harsher than anything you'd say to someone else. The lesson is letting "good enough" actually be enough sometimes.`,
    Libra:`With your Sun in Libra, your identity forms in relationship — you know yourself most clearly through how you connect, negotiate, and create fairness between people, and being genuinely alone with no one to weigh your choices against can feel disorienting. That gift for balance makes you a natural diplomat, but it can also mean losing track of your own preference under the weight of everyone else's. The growth edge is deciding what you want before you ask what's fair.`,
    Scorpio:`With your Sun in Scorpio, your core identity is built around intensity and the courage to face what most people flinch from — pulled instinctively toward whatever's hidden, taboo, or left unsaid, and more interested in a hard truth than a comfortable illusion. That same intensity is what gets you through a real crisis intact when it would break someone with less staying power, and it's also why you keep people at a distance until they've actually proven they belong closer — you're rarely wrong about who does and doesn't earn it. Once someone's proven themselves, your loyalty is total and doesn't waver; once they've proven the opposite, the door tends to close for good.`,
    Sagittarius:`With your Sun in Sagittarius, who you are is defined by the horizon — you need room to explore, question, and believe in something bigger than your immediate circumstances, whether that's travel, philosophy, or plain optimism. That expansiveness makes you genuinely inspiring to be around, but it can also make you blunt to the point of carelessness, or restless with anything that asks you to stay put. The growth edge is honoring a commitment even after the initial excitement fades.`,
    Capricorn:`With your Sun in Capricorn, your identity is built on what you can actually achieve and sustain — you measure yourself by competence and results, often holding yourself to standards well above what anyone else expects of you. That discipline makes you someone people trust with real responsibility early, but the same self-reliance that builds it can wall off the parts of you that need help or comfort — it's easier to produce your way through a hard time than to let someone see you struggling in the middle of it. The lesson is learning to receive — rest, help, love — without treating needing it as a failure of the standards you hold yourself to.`,
    Aquarius:`With your Sun in Aquarius, your core identity is tied to being distinct — you know yourself through your ideas, your independence, and your instinct to question whatever "everyone just does." That originality makes you a genuine innovator and a loyal friend to causes bigger than yourself, but it can also create real emotional distance, since detachment feels safer to you than dependency. The growth edge is letting people matter to you individually, not just as part of a group you champion.`,
    Pisces:`With your Sun in Pisces, your sense of self is fluid rather than fixed — you know yourself through empathy, imagination, and a porousness to other people's feelings that can make the line between "you" and "them" genuinely blurry. That sensitivity makes you unusually compassionate and creative, but it can also leave you without a firm center, absorbing moods that aren't yours to carry or escaping into fantasy when reality gets hard. The lesson is building a self solid enough to stay open without dissolving.`

    Taurus:`With your Moon in Taurus, you feel safe through consistency — familiar routines, physical comfort, and people who don't change the terms on you without warning. Your emotional world moves slowly and steadily, which makes you a calming, dependable presence, but it also means you can dig in and refuse to budge long after budging would actually help. The growth edge is letting comfort include some change, instead of treating change itself as the threat.`,

    Virgo:`With your Moon in Virgo, you process emotion by trying to fix, organize, or make sense of it — feelings that can't be turned into a useful action tend to make you uneasy, so you'll often clean, plan, or problem-solve your way through distress instead of just sitting with it. That instinct makes you genuinely helpful in a crisis, but it can also mean you criticize yourself for feeling "too much" or not handling things perfectly. The growth edge is letting a feeling just be messy sometimes, with nothing to fix.`,
    Libra:`With your Moon in Libra, you feel most at ease when there's harmony around you, and real conflict — even necessary conflict — can leave you emotionally unsettled long after it's resolved. You instinctively read the emotional temperature of a room and adjust to keep the peace, which makes you an easy, gracious presence, but it can also mean you swallow your own feelings to avoid rocking the boat. The lesson is naming what's actually bothering you before the resentment builds.`,
    Scorpio:`With your Moon in Scorpio, your emotional world runs intense and mostly private — you feel things at full volume internally while often showing very little on the surface, and trust has to be earned slowly before you'll let anyone see the depth of what's underneath. That intensity gives you real emotional courage and loyalty once trust is established. The instinct to keep people at a distance until they've proven themselves is reliable, not a flaw — the real risk is when suspicion gets ahead of the evidence, assuming the worst about someone before they've actually done anything to earn it.`,
    Sagittarius:`With your Moon in Sagittarius, you feel safest when you have room to move, explore, and believe things are ultimately going to work out — pessimism and confinement both weigh on you emotionally in a way that's hard for more cautious people to understand. That optimism makes you a genuinely uplifting presence, but it can also mean you dodge heavier feelings by staying busy, joking, or physically leaving rather than sitting with discomfort. The lesson is staying present for the hard feeling instead of moving past it too fast.`,
    Capricorn:`With your Moon in Capricorn, you were likely taught early — by circumstance or example — to manage your own feelings quietly rather than lean on others, and that self-sufficiency is deeply ingrained. You feel most secure when you're competent and in control of the situation, which makes you steady under pressure, but it can also mean you struggle to ask for comfort even when you genuinely need it. The growth edge is letting someone help carry something before you're at your absolute limit.`,
    Aquarius:`With your Moon in Aquarius, you process emotion at a bit of a remove — you'd rather understand a feeling than be swept up in it, which can make you seem cool or detached even when you care deeply. That objectivity makes you a clear-headed friend in other people's crises, but it can also mean you undervalue your own feelings, treating them as inconvenient data rather than something worth attending to. The lesson is letting a feeling be irrational and yours anyway.`,
    Pisces:`With your Moon in Pisces, you feel everything — your own and, often, everyone else's too, since the emotional boundary between you and the people around you tends to run thin. That empathy makes you an unusually gentle, intuitive presence, but it can also leave you overwhelmed, unsure which feelings actually originate with you, or tempted to escape into distraction rather than face something painful directly. The growth edge is building enough emotional structure to stay open without drowning in it.`
