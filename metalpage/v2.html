<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R;uniform sampler2D uI;uniform sampler2D uH;uniform vec3 uL1;uniform vec3 uL2;uniform vec3 uGround;uniform vec3 uWord;uniform vec3 uStop;
float hash(vec3 p){p=fract(p*0.3183099+vec3(.1,.2,.3));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float sdPlate(vec2 q){ // css px, plate centred at (195,422)
  q=abs(q-vec2(195.,422.));
  float d1=max(q.x-189.,q.y-416.);
  float d2=(q.x+q.y-(189.+416.-40.))*.70711;
  return max(d1,d2);}
float bevel(float sd){float t=clamp(-sd/14.,0.,1.);return 14.*sqrt(max(1.-(1.-t)*(1.-t),0.));}
float dome(vec2 p){float d=dot(p/vec2(.62,1.12),p/vec2(.62,1.12));return 2.3*(1.-pow(min(d,1.7)/1.7,1.25));}
vec2 px2uv(vec2 px){return vec2(px.x/390.,1.-px.y/844.);}
float bump(vec2 px){return texture2D(uH,px2uv(px)).r*5.;}
float Ht(vec2 px){vec2 p=(px-vec2(195.,422.))/390.;p.y=-p.y;return dome(p)+(bevel(sdPlate(px))+bump(px))/390.;}
float roomBase(vec3 r){float sky=smoothstep(-.30,.42,r.y+.25*r.x);return mix(.86,1.45,sky);}
float rb(vec2 q,vec2 h,float rad){vec2 d=abs(q)-h+rad;return 1.-smoothstep(-.004,.004,length(max(d,0.))+min(max(d.x,d.y),0.)-rad);}
float roomK(vec3 r){return exp((dot(r,uL1)-1.)/.010)*2.2+exp((dot(r,uL2)-1.)/.014)*1.5+exp((dot(r,uL1)-1.)/.030)*.30;}
void main(){
  vec2 px=vec2(gl_FragCoord.x/R.x*390.,(1.-gl_FragCoord.y/R.y)*844.);
  float sd=sdPlate(px);
  // ---- ground: deep ink with the plate's soft shadow
  float sh=exp(-max(sdPlate(px-vec2(5.,14.)),0.)/20.)*.62;
  vec3 col=uGround*(1.-sh)+vec3(.02,.03,.07)*smoothstep(500.,900.,px.y)*.0;
  if(sd<.9){
    float e=.7;
    float hx=Ht(px+vec2(e,0.))-Ht(px-vec2(e,0.));
    float hy=Ht(px+vec2(0.,e))-Ht(px-vec2(0.,e));
    vec3 N=normalize(vec3(-hx/(2.*e/390.),hy/(2.*e/390.),1.));
    vec3 r=reflect(vec3(0.,0.,-1.),N);
    vec4 id=texture2D(uI,px2uv(px));
    float base=roomBase(r),k=roomK(r);
    float sk=clamp((base-.86)/(1.45-.86),0.,1.);
    vec3 surf=mix(vec3(.006,.012,.036),vec3(.040,.075,.19),pow(sk,2.4))+vec3(1.)*k*.55;
    // soft shadow cast by the raised shapes onto the surface
    float cs=texture2D(uH,px2uv(px-vec2(4.,5.))).r;float own=texture2D(uH,px2uv(px)).r;
    surf*=1.-.16*cs*(1.-smoothstep(.25,.6,own));
    vec3 c=surf;
    // raised polished black (the word)
    if(id.r>.5){c=clamp(uWord*(1.0+.35*(base-.9))+vec3(k*.25),0.,1.);}
    // the full stop: one deep blue
    if(id.g>.5){c=uStop*(.55+.6*(base-.9))+vec3(.9)*k*.30;}
    // bright polished edge line and a fine dark inner line where the bevel meets the face
    c=mix(c,vec3(1.),.85*smoothstep(-2.4,-1.3,sd)*(1.-smoothstep(-1.3,-.2,sd)));
    c*=1.-.10*smoothstep(-15.,-13.,sd)*(1.-smoothstep(-13.,-10.,sd));
    c+=(hash(vec3(gl_FragCoord.xy,1.))-.5)/255.;
    float a=1.-smoothstep(-.7,.7,sd);
    col=mix(col,clamp(c,0.,1.),a);
  }
  gl_FragColor=vec4(col,1.);
}
</script>
<script>
(async()=>{
await document.fonts.load('800 172px Fraunces');await document.fonts.ready;
const Q=new URLSearchParams(location.search);
const W=780,Hh=1688,S=2;
function mk(){const c=document.createElement('canvas');c.width=W;c.height=Hh;const x=c.getContext('2d');x.scale(S,S);return [c,x];}
// id canvas: red = the word, green = the full stop
const [ci,xi]=mk();xi.fillStyle='#000';xi.fillRect(0,0,390,844);
xi.font='800 172px Fraunces';xi.textBaseline='alphabetic';xi.letterSpacing='-7.6px';
const X0=34,YB=566;const wFree=xi.measureText('free').width;
xi.fillStyle='#f00';xi.fillText('free',X0,YB);
xi.fillStyle='#0f0';xi.fillText('.',X0+wFree,YB);
// height canvas: the same shapes, softened so they read as rounded relief
const [ch,xh]=mk();xh.fillStyle='#000';xh.fillRect(0,0,390,844);
xh.font='800 172px Fraunces';xh.letterSpacing='-7.6px';xh.fillStyle='#fff';xh.fillText('free',X0,YB);xh.fillText('.',X0+wFree,YB);xh.beginPath();xh.moveTo(71,744);xh.arcTo(344,744,344,794,25);xh.arcTo(344,794,46,794,25);xh.arcTo(46,794,46,744,25);xh.arcTo(46,744,344,744,25);xh.closePath();xh.fill();
const hb=document.createElement('canvas');hb.width=W;hb.height=Hh;const hx=hb.getContext('2d');
hx.filter='blur(3px)';hx.drawImage(ch,0,0);hx.filter='none';
// aim the lights at chosen spots on the plate
const Hf=(x,y)=>{const d=(x/.62)**2+(y/1.12)**2;return 1.7*(1-Math.pow(Math.min(d,1.7)/1.7,1.25));};
function aim(px,py){const x=(px-195)/390,y=(422-py)/390,e=.0014;const dx=(Hf(x+e,y)-Hf(x-e,y))/(2*e),dy=(Hf(x,y+e)-Hf(x,y-e))/(2*e);
 let n=[-dx,-dy,1];const l=Math.hypot(...n);n=n.map(v=>v/l);const d=-n[2];return [0-2*d*n[0],0-2*d*n[1],-1-2*d*n[2]];}
const cv=document.getElementById('c');const gl=cv.getContext('webgl',{preserveDrawingBuffer:true});gl.viewport(0,0,W,Hh);
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
function tex(c,unit){const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);}
tex(ci,0);tex(hb,1);
gl.uniform1i(gl.getUniformLocation(pr,'uI'),0);gl.uniform1i(gl.getUniformLocation(pr,'uH'),1);gl.uniform2f(gl.getUniformLocation(pr,'R'),W,Hh);
const hx3=(h)=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
const GR=Q.get('g')||'#03050b',WD=Q.get('w')||'#f4f6ff',ST=Q.get('s')||'#3f6dff',AC=Q.get('a')||'#8fb0ff';
gl.uniform3fv(gl.getUniformLocation(pr,'uGround'),hx3(GR));gl.uniform3fv(gl.getUniformLocation(pr,'uWord'),hx3(WD));gl.uniform3fv(gl.getUniformLocation(pr,'uStop'),hx3(ST));
document.body.style.setProperty('--a',AC);document.body.style.background=GR;
const u1=gl.getUniformLocation(pr,'uL1'),u2=gl.getUniformLocation(pr,'uL2');
function draw(tx,ty){const L1=aim(372+tx*50,18+ty*60),L2=aim(372+tx*20,560+ty*100);gl.uniform3fv(u1,L1);gl.uniform3fv(u2,L2);gl.drawArrays(gl.TRIANGLES,0,3);}
draw(0,0);document.body.dataset.plate='1';
// light follows the phone's tilt, or the finger / pointer; a slow drift when nobody is touching it
if(!Q.has('still')){
 let tx=0,ty=0,last=0;
 addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2;draw(tx,ty);last=performance.now();});
 addEventListener('deviceorientation',e=>{if(e.gamma==null)return;tx=Math.max(-1,Math.min(1,e.gamma/30));ty=Math.max(-1,Math.min(1,(e.beta-45)/30));draw(tx,ty);last=performance.now();});
 addEventListener('click',()=>{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().catch(()=>{});});
 setInterval(()=>{if(performance.now()-last>2500){const t=performance.now()/4200;draw(Math.sin(t)*.5,Math.cos(t*.8)*.4);}},66);
}
})();
</script>
