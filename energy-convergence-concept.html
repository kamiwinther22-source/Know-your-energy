<!--
  Energy-convergence treatment for the results page -- design concept, not
  wired into index.html yet.

  Context: an earlier attempt used 3 plain straight connector lines between
  the chart cards and the center Reading panel and was rejected as gimmicky/
  obvious with no real visual craft to it. This is not that -- no lines
  drawn card-to-card, no literal "connectors." Instead it's a soft ambient
  convergence treatment sitting behind/around the Reading card: two
  math-generated logarithmic spirals (real curve formula, not hand-drawn
  squiggles) in the site's own navy/gold/silver tones, swirling toward a
  shared center glow. Built on the actual page background color (#f4f6f0)
  with zero dark/space/starfield elements -- explicitly avoiding the
  reference image's cosmic skin while keeping its compositional idea (two
  differently-colored energies spiraling into one bright convergence point).

  Three variants, increasing restraint:
    A) Full sprawling ribbon swirl -- closest to the reference's ambition.
    B) Tight central glow with short tapered trails -- sized to sit behind
       the Reading card without dominating the grid.
    C) Clean hairline spiral line-art -- no blur/glow, graphic not
       atmospheric.

  All colors pulled from what's already live in index.html: navy #193866,
  blue #306AC0, gold #a08e68 / #b9a97e, silver #c3c7cd / #eef0f2.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Convergence Concept</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'DM Sans',sans-serif;
  background-color:#f4f6f0;
  background-image:
    radial-gradient(ellipse 55% 38% at 12% 8%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 62%),
    radial-gradient(ellipse 48% 34% at 88% 18%, rgba(232,238,218,0.55) 0%, rgba(232,238,218,0) 60%),
    radial-gradient(ellipse 140% 75% at 50% 0%, #f8faf4 0%, #f1f4ec 45%, #e9ede2 100%);
  padding:2rem 1rem 4rem;
}
.section{max-width:460px;margin:0 auto 3.5rem;}
.label{font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:800;color:#193866;text-align:center;margin-bottom:1rem;}
.stage{position:relative;width:100%;height:420px;}
.stage svg{position:absolute;inset:0;width:100%;height:100%;}
.mock-card{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:132px;height:225px;border-radius:10px;background:rgba(244,246,240,0.55);
  border:1px solid rgba(25,56,102,0.35);backdrop-filter:blur(1px);
  display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:0.6rem;
  letter-spacing:0.04em;text-transform:uppercase;color:#193866;z-index:2;
}
.side-cards{position:absolute;inset:0;z-index:1;}
.side-card{position:absolute;width:110px;height:190px;border-radius:9px;border:1px solid rgba(25,56,102,0.18);background:rgba(244,246,240,0.35);}
</style>
</head>
<body>

<div class="section">
  <div class="label">Variant A — Full Ribbon Swirl</div>
  <div class="stage" id="stageA"></div>
</div>

<div class="section">
  <div class="label">Variant B — Tight Central Glow</div>
  <div class="stage" id="stageB"></div>
</div>

<div class="section">
  <div class="label">Variant C — Hairline Spiral Line-Art</div>
  <div class="stage" id="stageC"></div>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
const NAVY='#193866', BLUE='#306AC0', GOLD='#a08e68', GOLDLT='#b9a97e', SILVER='#c3c7cd';

// Real logarithmic spiral: r = a * e^(b*theta). Generates a smooth, math-true
// curve rather than a hand-drawn squiggle.
function spiralPoints(cx,cy,turns,startR,growth,steps,dir,rot){
  const pts=[];
  const thetaMax=turns*2*Math.PI;
  for(let i=0;i<=steps;i++){
    const t=i/steps*thetaMax;
    const r=startR*Math.exp(growth*t);
    const theta=dir*t+rot;
    pts.push([cx+r*Math.cos(theta), cy+r*Math.sin(theta)]);
  }
  return pts;
}
function pointsToPath(pts){
  return 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
}
function addDefs(svg,idPrefix){
  const defs=document.createElementNS(NS,'defs');
  const mk=(id,color,op)=>{
    const g=document.createElementNS(NS,'radialGradient');
    g.setAttribute('id',id);
    g.innerHTML=`<stop offset="0%" stop-color="${color}" stop-opacity="${op}"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>`;
    defs.appendChild(g);
  };
  mk(idPrefix+'glowGold',GOLD,0.55);
  mk(idPrefix+'glowBlue',BLUE,0.5);
  const blur=document.createElementNS(NS,'filter');
  blur.setAttribute('id',idPrefix+'soft');
  blur.innerHTML='<feGaussianBlur stdDeviation="3.2"/>';
  defs.appendChild(blur);
  const blurStrong=document.createElementNS(NS,'filter');
  blurStrong.setAttribute('id',idPrefix+'softer');
  blurStrong.innerHTML='<feGaussianBlur stdDeviation="7"/>';
  defs.appendChild(blurStrong);
  svg.appendChild(defs);
}

function buildVariantA(container){
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 460 420');
  addDefs(svg,'a');
  const cx=230,cy=210;
  svg.innerHTML+=`<ellipse cx="${cx}" cy="${cy}" rx="150" ry="150" fill="url(#aglowGold)"/>`;
  // cool spiral sweeping from upper-left into center
  const coolOuter=spiralPoints(cx,cy,1.6,190,-0.34,140,1,Math.PI*0.15);
  const coolInner=spiralPoints(cx,cy,1.55,150,-0.34,140,1,Math.PI*0.22);
  const warmOuter=spiralPoints(cx,cy,1.6,190,-0.34,140,-1,Math.PI*1.15);
  const warmInner=spiralPoints(cx,cy,1.55,150,-0.34,140,-1,Math.PI*1.08);
  [ [coolOuter,BLUE,2.6,0.55],[coolInner,SILVER,1.8,0.7],
    [warmOuter,GOLD,2.6,0.55],[warmInner,GOLDLT,1.8,0.7] ].forEach(([pts,color,w,op])=>{
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',pointsToPath(pts));
    p.setAttribute('fill','none');
    p.setAttribute('stroke',color);
    p.setAttribute('stroke-width',w);
    p.setAttribute('stroke-linecap','round');
    p.setAttribute('opacity',op);
    p.setAttribute('filter','url(#asoft)');
    svg.appendChild(p);
  });
  svg.innerHTML+=`<circle cx="${cx}" cy="${cy}" r="34" fill="url(#aglowGold)" filter="url(#asofter)"/>`;
  svg.innerHTML+=`<circle cx="${cx}" cy="${cy}" r="9" fill="#fdfaf2" opacity="0.9"/>`;
  container.appendChild(svg);
  addCards(container);
}

function buildVariantB(container){
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 460 420');
  addDefs(svg,'b');
  const cx=230,cy=210;
  svg.innerHTML+=`<ellipse cx="${cx}" cy="${cy}" rx="105" ry="105" fill="url(#bglowBlue)"/>`;
  svg.innerHTML+=`<ellipse cx="${cx}" cy="${cy}" rx="80" ry="80" fill="url(#bglowGold)"/>`;
  // short tapered trails instead of full sprawl
  const trailCool=spiralPoints(cx,cy,0.55,95,-0.5,60,1,Math.PI*1.3);
  const trailWarm=spiralPoints(cx,cy,0.55,95,-0.5,60,-1,Math.PI*0.25);
  [[trailCool,BLUE,2.2,0.6],[trailWarm,GOLD,2.2,0.6]].forEach(([pts,color,w,op])=>{
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',pointsToPath(pts));
    p.setAttribute('fill','none');
    p.setAttribute('stroke',color);
    p.setAttribute('stroke-width',w);
    p.setAttribute('stroke-linecap','round');
    p.setAttribute('opacity',op);
    p.setAttribute('filter','url(#bsoft)');
    svg.appendChild(p);
  });
  svg.innerHTML+=`<circle cx="${cx}" cy="${cy}" r="22" fill="#fdfaf2" opacity="0.85" filter="url(#bsoft)"/>`;
  container.appendChild(svg);
  addCards(container);
}

function buildVariantC(container){
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 460 420');
  const cx=230,cy=210;
  const coolPts=spiralPoints(cx,cy,1.4,170,-0.3,120,1,Math.PI*0.15);
  const warmPts=spiralPoints(cx,cy,1.4,170,-0.3,120,-1,Math.PI*1.15);
  [[coolPts,NAVY],[warmPts,GOLD]].forEach(([pts,color])=>{
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',pointsToPath(pts));
    p.setAttribute('fill','none');
    p.setAttribute('stroke',color);
    p.setAttribute('stroke-width',1.1);
    p.setAttribute('opacity',0.75);
    svg.appendChild(p);
  });
  svg.innerHTML+=`<circle cx="${cx}" cy="${cy}" r="3.5" fill="${NAVY}"/>`;
  container.appendChild(svg);
  addCards(container);
}

function addCards(container){
  const wrap=document.createElement('div');
  wrap.className='side-cards';
  const positions=[[18,20],[338,20],[18,215],[338,215]];
  positions.forEach(([l,t])=>{
    const c=document.createElement('div');
    c.className='side-card';
    c.style.left=l+'px'; c.style.top=t+'px';
    wrap.appendChild(c);
  });
  container.appendChild(wrap);
  const card=document.createElement('div');
  card.className='mock-card';
  card.textContent='Reading';
  container.appendChild(card);
}

buildVariantA(document.getElementById('stageA'));
buildVariantB(document.getElementById('stageB'));
buildVariantC(document.getElementById('stageC'));
</script>
</body>
</html>
